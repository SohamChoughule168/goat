                - generic [ref=f8e350]:
                  - heading "GitHub MCP Server" [level=1] [ref=f8e351]
                  - 'link "Permalink: GitHub MCP Server" [ref=f8e352] [cursor=pointer]':
                    - /url: "#github-mcp-server"
                - paragraph [ref=f8e355]: The GitHub MCP Server connects AI tools directly to GitHub's platform. This gives AI agents, assistants, and chatbots the ability to read repositories and code files, manage issues and PRs, analyze code, and automate workflows. All through natural language interactions.
                - generic [ref=f8e356]:
                  - heading "Use Cases" [level=3] [ref=f8e357]
                  - 'link "Permalink: Use Cases" [ref=f8e358] [cursor=pointer]':
                    - /url: "#use-cases"
                - list [ref=f8e361]:
                  - listitem [ref=f8e362]: "Repository Management: Browse and query code, search files, analyze commits, and understand project structure across any repository you have access to."
                  - listitem [ref=f8e363]: "Issue & PR Automation: Create, update, and manage issues and pull requests. Let AI help triage bugs, review code changes, and maintain project boards."
                  - listitem [ref=f8e364]: "CI/CD & Workflow Intelligence: Monitor GitHub Actions workflow runs, analyze build failures, manage releases, and get insights into your development pipeline."
                  - listitem [ref=f8e365]: "Code Analysis: Examine security findings, review Dependabot alerts, understand code patterns, and get comprehensive insights into your codebase."
                  - listitem [ref=f8e366]: "Team Collaboration: Access discussions, manage notifications, analyze team activity, and streamline processes for your team."
                - paragraph [ref=f8e367]: Built for developers who want to connect their AI tools to GitHub context and capabilities, from simple natural language queries to complex multi-step agent workflows.
                - separator [ref=f8e368]

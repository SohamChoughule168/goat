                  - text: To run the server in read-only mode, you can use the
                  - code [ref=f8e1304]: "--read-only"
                  - text: flag. This will only offer read-only tools, preventing any modifications to repositories, issues, pull requests, etc.
                - generic [ref=f8e1305]:
                  - generic [ref=f8e1306]: ./github-mcp-server --read-only
                  - button "Copy code to clipboard" [ref=f8e1308] [cursor=pointer]
                - paragraph [ref=f8e1312]: "When using Docker, you can pass the read-only mode as an environment variable:"
                - generic [ref=f8e1313]:
                  - generic [ref=f8e1314]: docker run -i --rm \ -e GITHUB_PERSONAL_ACCESS_TOKEN=<your-token> \ -e GITHUB_READ_ONLY=1 \ ghcr.io/github/github-mcp-server
                  - button "Copy code to clipboard" [ref=f8e1316] [cursor=pointer]
                - generic [ref=f8e1320]:
                  - heading "Lockdown Mode" [level=2] [ref=f8e1321]
                  - 'link "Permalink: Lockdown Mode" [ref=f8e1322] [cursor=pointer]':
                    - /url: "#lockdown-mode"
                - paragraph [ref=f8e1325]: Lockdown mode limits the content that the server will surface from public repositories. When enabled, the server checks whether the author of each item has push access to the repository. Private repositories are unaffected, and collaborators keep full access to their own content.
                - paragraph [ref=f8e1326]:
                  - text: Lockdown mode is a best-effort content filter intended to reduce the risk of prompt injection from untrusted repository content (issues, pull requests, comments, commits, etc.). It is
                  - strong [ref=f8e1327]: not
                  - text: "an authorization boundary: it does not change what the underlying GitHub credential can read or write, and content withheld from a filtered tool response may still be reachable through other tools or direct GitHub API access with the same credential."
                - paragraph [ref=f8e1328]:
                  - text: As an intentional exception, content authored by a small set of trusted bot accounts (currently
                  - code [ref=f8e1329]: github-actions[bot]
                  - text: and
                  - code [ref=f8e1330]: copilot
                  - text: ) is always treated as safe, regardless of push access. This avoids filtering routine automation output (e.g. CI-generated commits or comments) that would otherwise be withheld under lockdown mode.
                - generic [ref=f8e1331]:
                  - generic [ref=f8e1332]: ./github-mcp-server --lockdown-mode
                  - button "Copy code to clipboard" [ref=f8e1334] [cursor=pointer]
                - paragraph [ref=f8e1338]: "When running with Docker, set the corresponding environment variable:"
                - generic [ref=f8e1339]:
                  - generic [ref=f8e1340]: docker run -i --rm \ -e GITHUB_PERSONAL_ACCESS_TOKEN=<your-token> \ -e GITHUB_LOCKDOWN_MODE=1 \ ghcr.io/github/github-mcp-server
                  - button "Copy code to clipboard" [ref=f8e1342] [cursor=pointer]
                - paragraph [ref=f8e1346]:
                  - text: In HTTP mode, this flag (or
                  - code [ref=f8e1347]: GITHUB_LOCKDOWN_MODE
                  - text: ") is an upper bound: the"
                  - code [ref=f8e1348]: X-MCP-Lockdown
                  - text: request header can enable lockdown mode when the operator has not, but it cannot disable lockdown mode the operator has already enabled. See the
                  - link "Server Configuration Guide" [ref=f8e1349] [cursor=pointer]:
                    - /url: /github/github-mcp-server/blob/main/docs/server-configuration.md#lockdown-mode
                  - text: for details.
                - paragraph [ref=f8e1350]: The behavior of lockdown mode depends on the tool invoked.
                - paragraph [ref=f8e1351]: "Following tools will return an error when the author lacks the push access:"
                - list [ref=f8e1352]:
                  - listitem [ref=f8e1353]:
                    - code [ref=f8e1354]: issue_read:get
                  - listitem [ref=f8e1355]:
                    - code [ref=f8e1356]: pull_request_read:get
                  - listitem [ref=f8e1357]:
                    - code [ref=f8e1358]: pull_request_read:get_diff
                  - listitem [ref=f8e1359]:
                    - code [ref=f8e1360]: pull_request_read:get_files
                  - listitem [ref=f8e1361]:
                    - code [ref=f8e1362]: pull_request_read:get_commits
                - paragraph [ref=f8e1363]: "Following tools will filter out content from users lacking the push access:"
                - list [ref=f8e1364]:
                  - listitem [ref=f8e1365]:
                    - code [ref=f8e1366]: issue_read:get_comments
                  - listitem [ref=f8e1367]:
                    - code [ref=f8e1368]: issue_read:get_sub_issues
                  - listitem [ref=f8e1369]:
                    - code [ref=f8e1370]: pull_request_read:get_comments
                  - listitem [ref=f8e1371]:
                    - code [ref=f8e1372]: pull_request_read:get_review_comments
                  - listitem [ref=f8e1373]:
                    - code [ref=f8e1374]: pull_request_read:get_reviews
                - generic [ref=f8e1375]:
                  - heading "i18n / Overriding Descriptions" [level=2] [ref=f8e1376]
                  - 'link "Permalink: i18n / Overriding Descriptions" [ref=f8e1377] [cursor=pointer]':
                    - /url: "#i18n--overriding-descriptions"
                - paragraph [ref=f8e1380]:
                  - text: The descriptions of the tools can be overridden by creating a

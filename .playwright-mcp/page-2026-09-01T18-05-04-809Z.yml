                    - text: (tools without a scope category)
                - paragraph [ref=f25e725]: "Notes:"
                - list [ref=f25e726]:
                  - listitem [ref=f25e727]:
                    - text: Management API tools come from
                    - code [ref=f25e728]: "@neon/tools"
                    - text: . Selectors are SDK paths (
                    - code [ref=f25e729]: projects.list

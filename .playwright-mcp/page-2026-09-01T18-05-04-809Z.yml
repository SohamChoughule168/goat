                  - 'link "Permalink: Supported Tools" [ref=f25e687] [cursor=pointer]':
                    - /url: "#supported-tools"
                - paragraph [ref=f25e690]: The Neon MCP Server provides the following actions, which are exposed as "tools" to MCP Clients. You can use these tools to interact with your Neon projects and databases using natural language commands.
                - generic [ref=f25e691]:
                  - heading "Tool Scope Metadata" [level=4] [ref=f25e692]

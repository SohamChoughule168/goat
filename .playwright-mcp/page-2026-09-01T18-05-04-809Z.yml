                  - listitem [ref=f25e886]:
                    - strong [ref=f25e887]:
                      - code [ref=f25e888]: get_connection_string
                    - text: ": Returns your database connection string."
                  - listitem [ref=f25e889]:
                    - strong [ref=f25e890]:
                      - code [ref=f25e891]: run_sql
                    - text: ": Executes a single SQL query against a specified Neon database. Supports both read and write operations."
                  - listitem [ref=f25e892]:
                    - strong [ref=f25e893]:
                      - code [ref=f25e894]: run_sql_transaction
                    - text: ": Executes a series of SQL queries within a single transaction against a Neon database."
                  - listitem [ref=f25e895]:
                    - strong [ref=f25e896]:
                      - code [ref=f25e897]: get_database_tables
                    - text: ": Lists all tables within a specified Neon database."
                  - listitem [ref=f25e898]:
                    - strong [ref=f25e899]:
                      - code [ref=f25e900]: describe_table_schema
                    - text: ": Retrieves the schema definition of a specific table, detailing columns, data types, and constraints."
                - paragraph [ref=f25e901]:
                  - strong [ref=f25e902]: "Database Migrations (Schema Changes):"
                - list [ref=f25e903]:
                  - listitem [ref=f25e904]:
                    - strong [ref=f25e905]:
                      - code [ref=f25e906]: prepare_database_migration
                    - text: ": Initiates a database migration process. Critically, it creates a temporary branch to apply and test the migration safely before affecting the main branch."
                  - listitem [ref=f25e907]:
                    - strong [ref=f25e908]:
                      - code [ref=f25e909]: complete_database_migration
                    - text: ": Finalizes and applies a prepared database migration to the main branch. This action merges changes from the temporary migration branch and cleans up temporary resources."
                - paragraph [ref=f25e910]:
                  - strong [ref=f25e911]: "SQL Querying and Optimization:"
                - list [ref=f25e912]:
                  - listitem [ref=f25e913]:
                    - strong [ref=f25e914]:
                      - code [ref=f25e915]: inspect_database
                    - text: ": Runs one of 15 predefined read-only Postgres diagnostics against a branch — relation and index sizes, index and sequential-scan usage, active queries and locks, the heaviest and most frequent queries, cache hit rate and working-set size, autovacuum and bloat estimates, and replication state. Same checks as the"
                    - code [ref=f25e916]: neon inspect db
                    - text: CLI command. Omit
                    - code [ref=f25e917]: database_name
                    - text: to cover every database on the branch; pass a name to inspect one. Four of them need the
                    - code [ref=f25e918]: pg_stat_statements
                    - text: or
                    - code [ref=f25e919]: neon
                    - text: extension.
                  - listitem [ref=f25e920]:
                    - strong [ref=f25e921]:
                      - code [ref=f25e922]: list_slow_queries
                    - text: ": Identifies performance bottlenecks by finding the slowest queries in a database. Requires the pg_stat_statements extension."
                  - listitem [ref=f25e923]:
                    - strong [ref=f25e924]:
                      - code [ref=f25e925]: explain_sql_statement
                    - text: ": Provides detailed execution plans for SQL queries to help identify performance bottlenecks."
                  - listitem [ref=f25e926]:
                    - strong [ref=f25e927]:
                      - code [ref=f25e928]: prepare_query_tuning
                    - text: ": Analyzes query performance and suggests optimizations, like index creation. Creates a temporary branch for safely testing these optimizations."
                  - listitem [ref=f25e929]:
                    - strong [ref=f25e930]:
                      - code [ref=f25e931]: complete_query_tuning
                    - text: ": Finalizes query tuning by either applying optimizations to the main branch or discarding them. Cleans up the temporary tuning branch."
                - paragraph [ref=f25e932]:
                  - strong [ref=f25e933]: Neon Auth
                  - text: (
                  - code [ref=f25e934]: "?category=neon_auth"
                  - text: "):"

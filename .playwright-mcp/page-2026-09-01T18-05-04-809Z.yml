                  - button "Copy code to clipboard" [ref=f25e479] [cursor=pointer]
                - paragraph [ref=f25e483]:
                  - text: Alternatively, you can add the following "Neon" entry to your client's MCP server configuration file (e.g.,
                  - code [ref=f25e484]: mcp.json
                  - text: ","
                  - code [ref=f25e485]: mcp_config.json
                  - text: "):"
                - generic [ref=f25e486]:
                  - generic [ref=f25e487]:
                    - text: "{ \"mcpServers\": { \"Neon\": { \"type\":"
                    - generic [ref=f25e488]: "\"http\""
                    - text: ", \"url\":"
                    - generic [ref=f25e489]: "\"https://mcp.neon.tech/mcp?category=projects&category=branches&category=endpoints&category=querying&category=schema\""
                    - text: ", \"headers\": { \"Authorization\":"
                    - generic [ref=f25e490]: "\"Bearer <$NEON_API_KEY>\""
                    - text: "} } } }"
                  - button "Copy code to clipboard" [ref=f25e492] [cursor=pointer]
                - blockquote [ref=f25e496]:
                  - paragraph [ref=f25e497]: Provide an organization's API key to limit access to projects under the organization only.
                - generic [ref=f25e498]:
                  - heading "Scopes and Read-Only Mode" [level=3] [ref=f25e499]
                  - 'link "Permalink: Scopes and Read-Only Mode" [ref=f25e500] [cursor=pointer]':
                    - /url: "#scopes-and-read-only-mode"
                - paragraph [ref=f25e503]:
                  - text: Neon MCP supports OAuth scopes
                  - code [ref=f25e504]: read
                  - text: ","
                  - code [ref=f25e505]: write
                  - text: ", and"
                  - code [ref=f25e506]: "*"
                  - text: (

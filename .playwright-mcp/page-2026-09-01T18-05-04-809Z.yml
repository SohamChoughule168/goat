                    - text: ": Manage the Data API for a branch database."
                - paragraph [ref=f25e984]:
                  - strong [ref=f25e985]: "Search and Discovery:"
                - list [ref=f25e986]:
                  - listitem [ref=f25e987]:
                    - strong [ref=f25e988]:
                      - code [ref=f25e989]: search
                    - text: ": Searches across organizations, projects, and branches matching a query. Returns IDs, titles, and direct links to the Neon Console."
                  - listitem [ref=f25e990]:
                    - strong [ref=f25e991]:
                      - code [ref=f25e992]: fetch
                    - text: ": Fetches detailed information about a specific organization, project, or branch using an ID (typically from the search tool)."
                - paragraph [ref=f25e993]:
                  - strong [ref=f25e994]: Observability
                  - text: (
                  - code [ref=f25e995]: "?category=observability"
                  - text: "): these tools require the Neon Platform Beta and are currently only available for projects in the"
                  - code [ref=f25e996]: aws-us-east-2
                  - text: region. A branch without logs access returns HTTP 404 with reason
                  - code [ref=f25e997]: telemetry_not_enabled
                  - text: .
                - list [ref=f25e998]:
                  - listitem [ref=f25e999]:
                    - strong [ref=f25e1000]:
                      - code [ref=f25e1001]: query_logs
                    - text: ": Queries OpenTelemetry logs for a branch. POST in the Management API; treated as read-only by this server."
                  - listitem [ref=f25e1002]:
                    - strong [ref=f25e1003]:
                      - code [ref=f25e1004]: list_log_fields
                    - text: ": Lists the log fields you can enumerate values for on a branch."
                  - listitem [ref=f25e1005]:
                    - strong [ref=f25e1006]:
                      - code [ref=f25e1007]: list_log_field_values
                    - text: ": Lists the distinct values of a log field within a branch and time window."
                - paragraph [ref=f25e1008]:

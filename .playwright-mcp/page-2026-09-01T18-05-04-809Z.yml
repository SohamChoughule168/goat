                - img "Neon Logo fallback" [ref=f25e302]
                - generic [ref=f25e303]:
                  - heading "Neon MCP Server" [level=1] [ref=f25e304]
                  - 'link "Permalink: Neon MCP Server" [ref=f25e305] [cursor=pointer]':
                    - /url: "#neon-mcp-server"
                - paragraph [ref=f25e308]:
                  - link [ref=f25e309] [cursor=pointer]:
                    - /url: https://cursor.com/en-US/install-mcp?name=Neon&config=eyJ1cmwiOiJodHRwczovL21jcC5uZW9uLnRlY2gvbWNwP2NhdGVnb3J5PXByb2plY3RzJmNhdGVnb3J5PWJyYW5jaGVzJmNhdGVnb3J5PWVuZHBvaW50cyZjYXRlZ29yeT1xdWVyeWluZyZjYXRlZ29yeT1zY2hlbWEifQ%3D%3D
                    - img "Install MCP Server in Cursor" [ref=f25e310]
                  - link [ref=f25e311] [cursor=pointer]:
                    - /url: https://kiro.dev/launch/mcp/add?name=Neon&config=%7B%22url%22%3A%22https%3A%2F%2Fmcp.neon.tech%2Fmcp%3Fcategory%3Dprojects%26category%3Dbranches%26category%3Dendpoints%26category%3Dquerying%26category%3Dschema%22%7D
                    - img "Add to Kiro" [ref=f25e312]
                - paragraph [ref=f25e313]:
                  - strong [ref=f25e314]: Neon MCP Server
                  - text: is an open-source tool that lets you interact with your Lakebase Postgres databases on Neon in
                  - strong [ref=f25e315]: natural language
                  - text: .
                - paragraph [ref=f25e316]:
                  - link [ref=f25e317] [cursor=pointer]:
                    - /url: https://opensource.org/licenses/MIT
                    - 'img "License: MIT" [ref=f25e318]'
                - paragraph [ref=f25e319]:
                  - text: The Model Context Protocol (MCP) is a
                  - link "standardized protocol" [ref=f25e320] [cursor=pointer]:
                    - /url: https://modelcontextprotocol.io
                  - text: designed to manage context between large language models (LLMs) and external systems. This repository provides a remote MCP Server for
                  - link "Neon" [ref=f25e321] [cursor=pointer]:
                    - /url: https://neon.com
                  - text: .
                - paragraph [ref=f25e322]:
                  - text: Neon's MCP server acts as a bridge between natural language requests and the
                  - link "Neon API" [ref=f25e323] [cursor=pointer]:
                    - /url: https://neon.com/docs/reference/api
                  - text: . Built upon MCP, it translates your requests into the necessary API calls, enabling you to manage tasks such as creating projects and branches, running queries, and performing database migrations seamlessly.
                - paragraph [ref=f25e324]: "Some of the key features of the Neon MCP server include:"
                - list [ref=f25e325]:
                  - listitem [ref=f25e326]:
                    - strong [ref=f25e327]: "Natural language interaction:"
                    - text: Manage Neon databases using intuitive, conversational commands.
                  - listitem [ref=f25e328]:
                    - strong [ref=f25e329]: "Simplified database management:"
                    - text: Perform complex actions without writing SQL or directly using the Neon API.
                  - listitem [ref=f25e330]:
                    - strong [ref=f25e331]: "Accessibility for non-developers:"
                    - text: Empower users with varying technical backgrounds to interact with Neon databases.
                  - listitem [ref=f25e332]:
                    - strong [ref=f25e333]: "Database migration support:"
                    - text: Leverage Neon's branching capabilities for database schema changes initiated via natural language.
                - paragraph [ref=f25e334]: "For example, in Claude Code, or any MCP Client, you can use natural language to accomplish things with Neon, such as:"
                - list [ref=f25e335]:
                  - listitem [ref=f25e336]:
                    - code [ref=f25e337]: "Let's create a new Postgres database, and call it \"my-database\". Let's then create a table called users with the following columns: id, name, email, and password."
                  - listitem [ref=f25e338]:
                    - code [ref=f25e339]: I want to run a migration on my project called "my-project" that alters the users table to add a new column called "created_at".
                  - listitem [ref=f25e340]:
                    - code [ref=f25e341]: Can you give me a summary of all of my Neon projects and what data is in each one?
                - generic [ref=f25e342]:
                  - paragraph [ref=f25e343]: Warning
                  - paragraph [ref=f25e346]:
                    - strong [ref=f25e347]: Neon MCP Server Security Considerations
                    - text: The Neon MCP Server grants powerful database management capabilities through natural language requests.
                    - strong [ref=f25e348]: Always review and authorize actions requested by the LLM before execution.
                    - text: Ensure that only authorized users and applications have access to the Neon MCP Server.
                  - paragraph [ref=f25e349]:
                    - text: The Neon MCP Server is intended for local development and IDE integrations only.
                    - strong [ref=f25e350]: We do not recommend using the Neon MCP Server in production environments.
                    - text: It can execute powerful operations that may lead to accidental or unauthorized changes.
                  - paragraph [ref=f25e351]:
                    - text: For more information, see
                    - link "MCP security guidance →" [ref=f25e352] [cursor=pointer]:
                      - /url: https://neon.com/docs/ai/neon-mcp-server#mcp-security-guidance
                    - text: .
                - generic [ref=f25e353]:
                  - heading "Setting up Neon MCP Server" [level=2] [ref=f25e354]
                  - 'link "Permalink: Setting up Neon MCP Server" [ref=f25e355] [cursor=pointer]':
                    - /url: "#setting-up-neon-mcp-server"
                - paragraph [ref=f25e358]: "There are a few options for setting up the Neon MCP Server:"
                - list [ref=f25e359]:
                  - listitem [ref=f25e360]:
                    - strong [ref=f25e361]: "Quick Setup with API Key (Cursor, VS Code, and Claude Code):"
                    - text: Run
                    - link [ref=f25e362] [cursor=pointer]:
                      - /url: https://neon.com/docs/cli/init
                      - code [ref=f25e363]: neon@latest init
                    - text: to automatically configure Neon's MCP Server,
                    - link "agent skills" [ref=f25e364] [cursor=pointer]:
                      - /url: https://github.com/neondatabase/agent-skills
                    - text: ", and VS Code extension with one command."
                  - listitem [ref=f25e365]:
                    - strong [ref=f25e366]: "Remote MCP Server (OAuth Based Authentication):"
                    - text: Connect to Neon's managed MCP server using OAuth for authentication. This method is more convenient as it eliminates the need to manage API keys. Additionally, you will automatically receive the latest features and improvements as soon as they are released.
                  - listitem [ref=f25e367]:
                    - strong [ref=f25e368]: "Remote MCP Server (API Key Based Authentication):"
                    - text: Connect to Neon's managed MCP server using API key for authentication. This method is useful if you want to connect a remote agent to Neon where OAuth is not available. Additionally, you will automatically receive the latest features and improvements as soon as they are released.
                - generic [ref=f25e369]:
                  - heading "Prerequisites" [level=3] [ref=f25e370]
                  - 'link "Permalink: Prerequisites" [ref=f25e371] [cursor=pointer]':
                    - /url: "#prerequisites"
                - list [ref=f25e374]:
                  - listitem [ref=f25e375]: An MCP Client application.
                  - listitem [ref=f25e376]:
                    - text: A
                    - link "Neon account" [ref=f25e377] [cursor=pointer]:
                      - /url: https://console.neon.tech/signup
                    - text: .
                  - listitem [ref=f25e378]:
                    - strong [ref=f25e379]: "Node.js (>= v18.0.0):"
                    - text: Download from
                    - link "nodejs.org" [ref=f25e380] [cursor=pointer]:
                      - /url: https://nodejs.org
                    - text: .
                  - listitem [ref=f25e381]:
                    - text: If
                    - link "IP Allow" [ref=f25e382] [cursor=pointer]:
                      - /url: https://neon.com/docs/introduction/ip-allow
                    - text: is enabled, add
                    - code [ref=f25e383]: 34.192.103.46
                    - text: and
                    - code [ref=f25e384]: 23.22.233.166
                    - text: to your allowlist (
                    - code [ref=f25e385]: mcp.neon.tech
                    - text: static IPs).
                - paragraph [ref=f25e386]:
                  - text: For development, you'll need Node.js 22+ (pnpm is provided via Corepack — run
                  - code [ref=f25e387]: corepack enable
                  - text: to activate it).
                - generic [ref=f25e388]:
                  - heading "Option 1. Quick Setup with API Key" [level=3] [ref=f25e389]
                  - 'link "Permalink: Option 1. Quick Setup with API Key" [ref=f25e390] [cursor=pointer]':
                    - /url: "#option-1-quick-setup-with-api-key"
                - paragraph [ref=f25e393]:
                  - strong [ref=f25e394]: Don't want to manually create an API key?
                - paragraph [ref=f25e395]:
                  - text: Run
                  - link [ref=f25e396] [cursor=pointer]:
                    - /url: https://neon.com/docs/cli/init
                    - code [ref=f25e397]: neon@latest init
                  - text: "to automatically configure Neon's MCP Server with one command:"
                - generic [ref=f25e398]:
                  - generic [ref=f25e399]: npx neon@latest init
                  - button "Copy code to clipboard" [ref=f25e401] [cursor=pointer]
                - paragraph [ref=f25e405]: This works with Cursor, VS Code (GitHub Copilot), and Claude Code. It will authenticate via OAuth, create a Neon API key for you, and configure your editor automatically.
                - generic [ref=f25e406]:
                  - heading "Option 2. Remote Hosted MCP Server (OAuth Based Authentication)" [level=3] [ref=f25e407]
                  - 'link "Permalink: Option 2. Remote Hosted MCP Server (OAuth Based Authentication)" [ref=f25e408] [cursor=pointer]':
                    - /url: "#option-2-remote-hosted-mcp-server-oauth-based-authentication"
                - paragraph [ref=f25e411]: Connect to Neon's managed MCP server using OAuth for authentication. This is the easiest setup, requires no local installation of this server, and doesn't need a Neon API key configured in the client.
                - paragraph [ref=f25e412]: "Run the following command to add the Neon MCP Server for all detected agents and editors in your workspace:"
                - generic [ref=f25e413]:
                  - generic [ref=f25e414]:
                    - text: npx add-mcp
                    - generic [ref=f25e415]: "\"https://mcp.neon.tech/mcp?category=projects&category=branches&category=endpoints&category=querying&category=schema\""
                  - button "Copy code to clipboard" [ref=f25e417] [cursor=pointer]
                - paragraph [ref=f25e421]:
                  - text: That URL publishes projects, branches, compute endpoints, querying, and schema. Preview it with
                  - code [ref=f25e422]: /api/list-tools?category=projects&category=branches&category=endpoints&category=querying&category=schema
                  - text: ". The unfiltered URL publishes every category:"
                - generic [ref=f25e423]:
                  - generic [ref=f25e424]: npx add-mcp https://mcp.neon.tech/mcp
                  - button "Copy code to clipboard" [ref=f25e426] [cursor=pointer]
                - paragraph [ref=f25e430]:
                  - text: Add the
                  - code [ref=f25e431]: "-g"
                  - text: flag to add the Neon MCP Server to the global MCP server list instead of project-scoped.
                - paragraph [ref=f25e432]:
                  - text: Alternatively, you can add the following "Neon" entry to your client's MCP server configuration file (e.g.,
                  - code [ref=f25e433]: mcp.json
                  - text: ","
                  - code [ref=f25e434]: mcp_config.json
                  - text: "):"
                - generic [ref=f25e435]:
                  - generic [ref=f25e436]:
                    - text: "{ \"mcpServers\": { \"Neon\": { \"type\":"
                    - generic [ref=f25e437]: "\"http\""
                    - text: ", \"url\":"
                    - generic [ref=f25e438]: "\"https://mcp.neon.tech/mcp?category=projects&category=branches&category=endpoints&category=querying&category=schema\""
                    - text: "} } }"
                  - button "Copy code to clipboard" [ref=f25e440] [cursor=pointer]
                - paragraph [ref=f25e444]:
                  - strong [ref=f25e445]: "Kiro:"
                  - text: Add the following to your Kiro MCP config file (
                  - code [ref=f25e446]: ~/.kiro/settings/mcp.json
                  - text: for global, or
                  - code [ref=f25e447]: .kiro/settings/mcp.json
                  - text: "for project-scoped):"
                - generic [ref=f25e448]:
                  - generic [ref=f25e449]:
                    - text: "{ \"mcpServers\": { \"Neon\": { \"url\":"
                    - generic [ref=f25e450]: "\"https://mcp.neon.tech/mcp?category=projects&category=branches&category=endpoints&category=querying&category=schema\""
                    - text: "} } }"
                  - button "Copy code to clipboard" [ref=f25e452] [cursor=pointer]
                - paragraph [ref=f25e456]:
                  - text: Or use the one-click install button at the top of this README. For more information, see the
                  - link "Kiro MCP documentation" [ref=f25e457] [cursor=pointer]:
                    - /url: https://kiro.dev/docs/mcp/
                  - text: .
                - list [ref=f25e458]:
                  - listitem [ref=f25e459]: Restart or refresh your MCP client.
                  - listitem [ref=f25e460]: An OAuth window will open in your browser. Follow the prompts to authorize your MCP client to access your Neon account.
                - blockquote [ref=f25e461]:
                  - paragraph [ref=f25e462]:
                    - text: With OAuth-based authentication, the MCP server will, by default, operate on projects under your personal Neon account. To access or manage projects that belong to an organization, you must explicitly provide either the
                    - code [ref=f25e463]: org_id
                    - text: or the
                    - code [ref=f25e464]: project_id
                    - text: in your prompt to MCP client.
                - generic [ref=f25e465]:
                  - heading "Option 3. Remote Hosted MCP Server (API Key Based Authentication)" [level=3] [ref=f25e466]
                  - 'link "Permalink: Option 3. Remote Hosted MCP Server (API Key Based Authentication)" [ref=f25e467] [cursor=pointer]':
                    - /url: "#option-3-remote-hosted-mcp-server-api-key-based-authentication"
                - paragraph [ref=f25e470]:
                  - text: Remote MCP Server also supports authentication using an API key in the
                  - code [ref=f25e471]: Authorization
                  - text: header if your client supports it.
                - paragraph [ref=f25e472]:
                  - link "Create a Neon API key" [ref=f25e473] [cursor=pointer]:
                    - /url: https://console.neon.tech/app/settings?modal=create_api_key
                  - text: "in the Neon Console. Next, run the following command to add the Neon MCP Server for all detected agents and editors in your workspace:"
                - generic [ref=f25e474]:
                  - generic [ref=f25e475]:
                    - text: npx add-mcp
                    - generic [ref=f25e476]: "\"https://mcp.neon.tech/mcp?category=projects&category=branches&category=endpoints&category=querying&category=schema\""

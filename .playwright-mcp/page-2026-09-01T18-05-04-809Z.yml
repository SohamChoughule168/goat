                - generic [ref=f25e1059]:
                  - heading "Migrations" [level=3] [ref=f25e1060]
                  - 'link "Permalink: Migrations" [ref=f25e1061] [cursor=pointer]':
                    - /url: "#migrations"
                - paragraph [ref=f25e1064]:
                  - text: Migrations are a way to manage changes to your database schema over time. With the Neon MCP server, LLMs are empowered to do migrations safely with separate "Start" (
                  - code [ref=f25e1065]: prepare_database_migration
                  - text: ) and "Commit" (
                  - code [ref=f25e1066]: complete_database_migration
                  - text: ) commands.
                - paragraph [ref=f25e1067]: The "Start" command accepts a migration and runs it in a new temporary branch. Upon returning, this command hints to the LLM that it should test the migration on this branch. The LLM can then run the "Commit" command to apply the migration to the original branch.
                - generic [ref=f25e1068]:

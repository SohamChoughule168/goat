                    - text: ).
                  - listitem [ref=f25e740]:
                    - code [ref=f25e741]: "?category=branches"
                    - text: includes branch, role, and database tools (
                    - code [ref=f25e742]: list_postgres_roles
                    - text: ","
                    - code [ref=f25e743]: create_postgres_database
                    - text: ", …). A token already issued for"
                    - code [ref=f25e744]: branches
                    - text: gains those writes. Compute listing is
                    - code [ref=f25e745]: "?category=endpoints"
                    - text: . Snapshot restore is
                    - code [ref=f25e746]: "?category=snapshots"
                    - text: .
                  - listitem [ref=f25e747]:
                    - text: Project member and permission writes are not published.
                    - code [ref=f25e748]: list_project_members
                    - text: and
                    - code [ref=f25e749]: list_project_permissions
                    - text: are reads.

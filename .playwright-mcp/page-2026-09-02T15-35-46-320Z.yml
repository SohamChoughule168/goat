      - main [ref=e44]:
        - heading "Agent Plugins" [level=1] [ref=e45]
        - paragraph [ref=e46]: A portable package format for reusable components that extend AI agents.
        - generic [ref=e47]:
          - paragraph [ref=e48]:
            - text: Agent Plugins is an open, vendor-neutral standard for packaging reusable components into portable plugins. Its version 1.0.0 specification defines a shared format for
            - link "Agent Skills" [ref=e49] [cursor=pointer]:
              - /url: https://agentskills.io/specification
            - text: and
            - link "MCP servers" [ref=e50] [cursor=pointer]:
              - /url: https://modelcontextprotocol.io/specification
            - text: that compatible clients can discover and load consistently.
          - heading [level=2] [ref=e51]:
            - link "Why Agent Plugins?" [ref=e52] [cursor=pointer]:
              - /url: "#why-agent-plugins"
            - button "Copy Anchor Link" [ref=e53] [cursor=pointer]
          - paragraph [ref=e57]: AI agent clients have developed their own plugin formats, even when plugins contain the same underlying components. Authors must rearrange or duplicate those components for each client, so a plugin packaged for one client may need adaptation before another can use it.
          - paragraph [ref=e58]: Agent Plugins defines a small interoperability floor for the parts that can be portable across clients. Shared components can use one predictable structure, while distribution, installation, permissions, user experience, and client-specific capabilities remain under each client's control.
          - heading [level=2] [ref=e59]:
            - link "The portable package" [ref=e60] [cursor=pointer]:
              - /url: "#the-portable-package"
            - button "Copy Anchor Link" [ref=e61] [cursor=pointer]
          - paragraph [ref=e65]: "An Agent Plugin is a directory with a required manifest and optional components in fixed locations:"
          - generic [ref=e66]:
            - code [ref=e68]:
              - generic [ref=e69]: my-plugin/
              - generic [ref=e70]: ├── plugin.json
              - generic [ref=e71]: ├── skills/
              - generic [ref=e72]: │ └── summarize/
              - generic [ref=e73]: │ ├── SKILL.md
              - generic [ref=e74]: │ ├── scripts/
              - generic [ref=e75]: │ └── references/
              - generic [ref=e76]: ├── mcp.json
              - generic [ref=e77]: └── com.example.client/
              - generic [ref=e78]: └── hooks/
            - button "Copy code" [ref=e79] [cursor=pointer]
          - list [ref=e80]:
            - listitem [ref=e81]:
              - code [ref=e82]: plugin.json
              - text: identifies the plugin and the Agent Plugins version it targets.
            - listitem [ref=e83]:
              - code [ref=e84]: skills/
              - text: contains Agent Skills in the format defined by the Agent Skills specification.
            - listitem [ref=e85]:
              - code [ref=e86]: mcp.json
              - text: describes stdio, Streamable HTTP, or legacy HTTP+SSE MCP servers.
            - listitem [ref=e87]: Reverse-domain extension namespaces let individual clients add behavior without changing the portable core.
          - heading [level=2] [ref=e88]:
            - link "Open development" [ref=e89] [cursor=pointer]:
              - /url: "#open-development"
            - button "Copy Anchor Link" [ref=e90] [cursor=pointer]
          - paragraph [ref=e94]: Agent Plugins is openly licensed and developed in public. Its initial Technical Steering Committee includes Core Maintainers from Amazon, Cursor, Microsoft, OpenAI, and Vercel.
          - paragraph [ref=e95]:
            - text: Proposals and technical decisions are public, and participation is open to the broader ecosystem. Use
            - link "GitHub Discussions" [ref=e96] [cursor=pointer]:
              - /url: https://github.com/agentplugins/agent-plugins-spec/discussions
            - text: for asynchronous collaboration on ideas for new features and material changes, where proposals can establish a concrete portability need and implementer support. When synchronous collaboration on the standard is useful, join the
            - link "Agent Plugins Discord" [ref=e97] [cursor=pointer]:
              - /url: https://discord.gg/692jE8wsmj
            - text: .
          - paragraph [ref=e98]:

                - generic [ref=f7e704]:
                  - heading "User profile" [level=3] [ref=f7e705]
                  - 'link "Permalink: User profile" [ref=f7e706] [cursor=pointer]':
                    - /url: "#user-profile"
                - paragraph [ref=f7e709]: You can run Playwright MCP with persistent profile like a regular browser (default), in isolated contexts for testing sessions, or connect to your existing browser using the browser extension.
                - paragraph [ref=f7e710]:
                  - strong [ref=f7e711]: Persistent profile
                - paragraph [ref=f7e712]:
                  - text: All the logged in information will be stored in the persistent profile, you can delete it between sessions if you'd like to clear the offline state. Persistent profile is located at the following locations and you can override it with the
                  - code [ref=f7e713]: "--user-data-dir"
                  - text: argument.
                - generic [ref=f7e714]:
                  - generic [ref=f7e715]:
                    - generic [ref=f7e716]: "# Windows"
                    - text: "%USERPROFILE%\\AppData\\Local\\ms-playwright\\mcp-{channel}-{workspace-hash}"
                    - generic [ref=f7e717]: "# macOS"
                    - text: "- ~/Library/Caches/ms-playwright/mcp-{channel}-{workspace-hash}"
                    - generic [ref=f7e718]: "# Linux"
                    - text: "- ~/.cache/ms-playwright/mcp-{channel}-{workspace-hash}"
                  - button "Copy code to clipboard" [ref=f7e720] [cursor=pointer]
                - paragraph [ref=f7e724]:
                  - code [ref=f7e725]: "{workspace-hash}"
                  - text: is derived from the MCP client's workspace root, so different projects get separate profiles automatically.
                - generic [ref=f7e726]:
                  - paragraph [ref=f7e727]: Important
                  - paragraph [ref=f7e730]:
                    - text: A persistent profile can only be used by one browser instance at a time, so concurrent MCP clients sharing the same workspace will conflict. To run several clients in parallel, start each additional client with
                    - code [ref=f7e731]: "--isolated"
                    - text: or point it at a distinct
                    - code [ref=f7e732]: "--user-data-dir"
                    - text: .
                - paragraph [ref=f7e733]:
                  - strong [ref=f7e734]: Isolated
                - paragraph [ref=f7e735]:
                  - text: In the isolated mode, each session is started in the isolated profile. Every time you ask MCP to close the browser, the session is closed and all the storage state for this session is lost. You can provide initial storage state to the browser via the config's
                  - code [ref=f7e736]: contextOptions
                  - text: or via the
                  - code [ref=f7e737]: "--storage-state"
                  - text: argument. Learn more about the storage state
                  - link "here" [ref=f7e738] [cursor=pointer]:
                    - /url: https://playwright.dev/docs/auth
                  - text: .
                - generic [ref=f7e739]:
                  - generic [ref=f7e740]: "{ \"mcpServers\": { \"playwright\": { \"command\": \"npx\", \"args\": [ \"@playwright/mcp@latest\", \"--isolated\", \"--storage-state={path/to/storage.json}\" ] } } }"
                  - button "Copy code to clipboard" [ref=f7e742] [cursor=pointer]
                - paragraph [ref=f7e746]:
                  - strong [ref=f7e747]: Browser Extension
                - paragraph [ref=f7e748]:
                  - text: The Playwright MCP Chrome Extension allows you to connect to existing browser tabs and leverage your logged-in sessions and browser state. See
                  - link "microsoft/playwright › packages/extension" [ref=f7e749] [cursor=pointer]:
                    - /url: https://github.com/microsoft/playwright/tree/main/packages/extension#readme
                  - text: for installation and setup instructions.
                - generic [ref=f7e750]:
                  - heading "Initial state" [level=3] [ref=f7e751]
                  - 'link "Permalink: Initial state" [ref=f7e752] [cursor=pointer]':
                    - /url: "#initial-state"
                - paragraph [ref=f7e755]: There are multiple ways to provide the initial state to the browser context or a page.
                - paragraph [ref=f7e756]: "For the storage state, you can either:"
                - list [ref=f7e757]:
                  - listitem [ref=f7e758]:
                    - text: Start with a user data directory using the
                    - code [ref=f7e759]: "--user-data-dir"
                    - text: argument. This will persist all browser data between the sessions.
                  - listitem [ref=f7e760]:
                    - text: Start with a storage state file using the
                    - code [ref=f7e761]: "--storage-state"
                    - text: argument. This will load cookies and local storage from the file into an isolated browser context.
                - paragraph [ref=f7e762]: "For the page state, you can use:"
                - list [ref=f7e763]:
                  - listitem [ref=f7e764]:
                    - code [ref=f7e765]: "--init-page"
                    - text: to point to a TypeScript file that will be evaluated on the Playwright page object. This allows you to run arbitrary code to set up the page.
                - generic [ref=f7e766]:
                  - generic [ref=f7e767]: "// init-page.ts export default async ({ page }) => { await page.context().grantPermissions(['geolocation']); await page.context().setGeolocation({ latitude: 37.7749, longitude: -122.4194 }); await page.setViewportSize({ width: 1280, height: 720 }); };"
                  - button "Copy code to clipboard" [ref=f7e769] [cursor=pointer]
                - list [ref=f7e773]:
                  - listitem [ref=f7e774]:
                    - code [ref=f7e775]: "--init-script"
                    - text: to point to a JavaScript file that will be added as an initialization script. The script will be evaluated in every page before any of the page's scripts. This is useful for overriding browser APIs or setting up the environment.
                - generic [ref=f7e776]:
                  - generic [ref=f7e777]: // init-script.js window.isPlaywrightMCP = true;
                  - button "Copy code to clipboard" [ref=f7e779] [cursor=pointer]
                - generic [ref=f7e783]:
                  - heading "Configuration file" [level=3] [ref=f7e784]
                  - 'link "Permalink: Configuration file" [ref=f7e785] [cursor=pointer]':
                    - /url: "#configuration-file"
                - paragraph [ref=f7e788]:
                  - text: The Playwright MCP server can be configured using a JSON configuration file. You can specify the configuration file using the
                  - code [ref=f7e789]: "--config"
                  - text: "command line option:"
                - generic [ref=f7e790]:
                  - generic [ref=f7e791]: npx @playwright/mcp@latest --config path/to/config.json
                  - button "Copy code to clipboard" [ref=f7e793] [cursor=pointer]
                - group [ref=f7e797]:
                  - generic "Configuration file schema" [ref=f7e798] [cursor=pointer]
                - generic [ref=f7e799]:
                  - heading "Standalone MCP server" [level=3] [ref=f7e800]
                  - 'link "Permalink: Standalone MCP server" [ref=f7e801] [cursor=pointer]':
                    - /url: "#standalone-mcp-server"
                - paragraph [ref=f7e804]:
                  - text: When running headed browser on system w/o display or from worker processes of the IDEs, run the MCP server from environment with the DISPLAY and pass the
                  - code [ref=f7e805]: "--port"
                  - text: flag to enable HTTP transport.
                - generic [ref=f7e806]:
                  - generic [ref=f7e807]: npx @playwright/mcp@latest --port 8931
                  - button "Copy code to clipboard" [ref=f7e809] [cursor=pointer]
                - paragraph [ref=f7e813]:
                  - text: And then in MCP client config, set the
                  - code [ref=f7e814]: url
                  - text: "to the HTTP endpoint:"
                - generic [ref=f7e815]:
                  - generic [ref=f7e816]: "{ \"mcpServers\": { \"playwright\": { \"url\": \"http://localhost:8931/mcp\" } } }"

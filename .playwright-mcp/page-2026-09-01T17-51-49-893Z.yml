                  - heading "Configuration" [level=3] [ref=f7e456]
                  - 'link "Permalink: Configuration" [ref=f7e457] [cursor=pointer]':
                    - /url: "#configuration"
                - paragraph [ref=f7e460]:
                  - text: Playwright MCP server supports following arguments. They can be provided in the JSON configuration above, as a part of the
                  - code [ref=f7e461]: "\"args\""
                  - text: "list:"
                - table [ref=f7e463]:
                  - rowgroup [ref=f7e464]:
                    - row [ref=f7e465]:
                      - columnheader "Option" [ref=f7e466]
                      - columnheader "Description" [ref=f7e467]
                  - rowgroup [ref=f7e468]:
                    - row [ref=f7e469]:
                      - cell "--allowed-hosts <hosts...>" [ref=f7e470]
                      - cell [ref=f7e471]:
                        - text: comma-separated list of hosts this server is allowed to serve from. Defaults to the host the server is bound to. Pass '*' to disable the host check.
                        - emphasis [ref=f7e472]: env
                        - code [ref=f7e473]: PLAYWRIGHT_MCP_ALLOWED_HOSTS
                    - row [ref=f7e474]:
                      - cell "--allowed-origins" [ref=f7e475]
                      - cell [ref=f7e476]:
                        - text: "semicolon-separated list of TRUSTED origins to allow the browser to request. Default is to allow all. Important:"
                        - emphasis [ref=f7e477]: does not
                        - text: serve as a security boundary and
                        - emphasis [ref=f7e478]: does not
                        - text: affect redirects.
                        - emphasis [ref=f7e479]: env
                        - code [ref=f7e480]: PLAYWRIGHT_MCP_ALLOWED_ORIGINS
                    - row [ref=f7e481]:
                      - cell "--allow-unrestricted-file-access" [ref=f7e482]
                      - cell [ref=f7e483]:
                        - text: allow access to files outside of the workspace roots. Also allows unrestricted access to file:// URLs. By default access to file system is restricted to workspace root directories (or cwd if no roots are configured) only, and navigation to file:// URLs is blocked.
                        - emphasis [ref=f7e484]: env
                        - code [ref=f7e485]: PLAYWRIGHT_MCP_ALLOW_UNRESTRICTED_FILE_ACCESS
                    - row [ref=f7e486]:

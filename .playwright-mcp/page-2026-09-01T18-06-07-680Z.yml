                - 'link "Permalink: Cloudflare MCP Server" [ref=f26e309] [cursor=pointer]':
                  - /url: "#cloudflare-mcp-server"
              - paragraph [ref=f26e312]:
                - text: Model Context Protocol (MCP) is a
                - link "new, standardized protocol" [ref=f26e313] [cursor=pointer]:
                  - /url: https://modelcontextprotocol.io/introduction
                - text: for managing context between large language models (LLMs) and external systems. In this repository, you can find several MCP servers allowing you to connect to Cloudflare's service from an MCP client (e.g. Cursor, Claude) and use natural language to accomplish tasks through your Cloudflare account.
              - paragraph [ref=f26e314]:
                - text: These MCP servers allow your
                - link "MCP Client" [ref=f26e315] [cursor=pointer]:
                  - /url: https://modelcontextprotocol.io/clients
                - text: to read configurations from your account, process information, make suggestions based on data, and even make those suggested changes for you. All of these actions can happen across Cloudflare's many services including application development, security and performance.
              - paragraph [ref=f26e316]:
                - text: Every server in this repository exposes the same stateless Streamable HTTP handler at
                - code [ref=f26e317]: /mcp
                - text: and
                - code [ref=f26e318]: /sse
                - text: through a fresh SDK v2 server factory.
                - code [ref=f26e319]: /sse
                - text: remains as a URL compatibility alias; it does not use the deprecated HTTP+SSE transport. A legacy SSE
                - code [ref=f26e320]: GET /sse
                - text: request receives a
                - code [ref=f26e321]: 410 Gone
                - text: "Problem Details response with two migration options: configure the existing URL to use Streamable HTTP, or switch to the recommended"
                - code [ref=f26e322]: /mcp
                - text: URL for future compatibility. Modern 2026 requests and stateless 2025 requests share the same request-scoped implementation without an MCP protocol session. OAuth, credentials, account selection, application caches, and product Durable Objects remain application/security state where required.
              - paragraph [ref=f26e323]:
                - text: Cloudflare offers the following MCP servers. The domain-specific servers are included in this repository, while the recommended Code Mode server is maintained in
                - link [ref=f26e324] [cursor=pointer]:
                  - /url: https://github.com/cloudflare/mcp
                  - code [ref=f26e325]: cloudflare/mcp
                - text: ":"

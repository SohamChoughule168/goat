              - generic [ref=f11e350]:
                - heading "❌ Without Context7" [level=2] [ref=f11e351]
                - 'link "Permalink: ❌ Without Context7" [ref=f11e352] [cursor=pointer]':
                  - /url: "#-without-context7"
              - paragraph [ref=f11e355]: "LLMs rely on outdated or generic information about the libraries you use. You get:"
              - list [ref=f11e356]:
                - listitem [ref=f11e357]: ❌ Code examples are outdated and based on year-old training data
                - listitem [ref=f11e358]: ❌ Hallucinated APIs that don't even exist
                - listitem [ref=f11e359]: ❌ Generic answers for old package versions
              - generic [ref=f11e360]:
                - heading "✅ With Context7" [level=2] [ref=f11e361]
                - 'link "Permalink: ✅ With Context7" [ref=f11e362] [cursor=pointer]':
                  - /url: "#-with-context7"
              - paragraph [ref=f11e365]: Context7 pulls up-to-date, version-specific documentation and code examples straight from the source — and places them directly into your prompt.
              - generic [ref=f11e366]:
                - generic [ref=f11e367]: "Create a Next.js middleware that checks for a valid JWT in cookies and redirects unauthenticated users to `/login`. use context7"
                - button "Copy code to clipboard" [ref=f11e369] [cursor=pointer]
              - generic [ref=f11e373]:
                - generic [ref=f11e374]: Configure a Cloudflare Worker script to cache JSON API responses for five minutes. use context7
                - button "Copy code to clipboard" [ref=f11e376] [cursor=pointer]
              - generic [ref=f11e380]:
                - generic [ref=f11e381]: Show me the Supabase auth API for email/password sign-up.
                - button "Copy code to clipboard" [ref=f11e383] [cursor=pointer]
              - paragraph [ref=f11e387]: Context7 fetches up-to-date code examples and documentation right into your LLM's context. No tab-switching, no hallucinated APIs that don't exist, no outdated code generation.
              - paragraph [ref=f11e388]: "Works in two modes:"
              - list [ref=f11e389]:
                - listitem [ref=f11e390]:
                  - strong [ref=f11e391]: CLI + Skills
                  - text: — installs a skill that guides your agent to fetch docs using
                  - code [ref=f11e392]: ctx7
                  - text: CLI commands (no MCP required)
                - listitem [ref=f11e393]:
                  - strong [ref=f11e394]: MCP
                  - text: — registers a Context7 MCP server so your agent can call documentation tools natively
              - generic [ref=f11e395]:
                - heading "Installation" [level=2] [ref=f11e396]
                - 'link "Permalink: Installation" [ref=f11e397] [cursor=pointer]':
                  - /url: "#installation"
              - generic [ref=f11e400]:
                - paragraph [ref=f11e401]: Note
                - paragraph [ref=f11e404]:
                  - strong [ref=f11e405]: API Key Recommended
                  - text: ": Get a free API key at"
                  - link "context7.com/dashboard" [ref=f11e406] [cursor=pointer]:
                    - /url: https://context7.com/dashboard
                  - text: for higher rate limits.
              - paragraph [ref=f11e407]:
                - text: Set up Context7 for your coding agents with a single command. The
                - code [ref=f11e408]: ctx7
                - text: CLI requires Node.js 18 or newer.
              - generic [ref=f11e409]:
                - generic [ref=f11e410]: npx ctx7 setup
                - button "Copy code to clipboard" [ref=f11e412] [cursor=pointer]
              - paragraph [ref=f11e416]:
                - text: Authenticates via OAuth, generates an API key, and installs the appropriate skill. You can choose between CLI + Skills or MCP mode. Use
                - code [ref=f11e417]: "--cursor"
                - text: ","
                - code [ref=f11e418]: "--claude"
                - text: ", or"
                - code [ref=f11e419]: "--opencode"
                - text: to target a specific agent.
              - paragraph [ref=f11e420]:
                - text: To remove the generated setup later, run
                - code [ref=f11e421]: npx ctx7 remove
                - text: . If you globally installed the CLI with
                - code [ref=f11e422]: npm install -g ctx7
                - text: ", remove that package separately with"
                - code [ref=f11e423]: npm uninstall -g ctx7
                - text: .
              - paragraph [ref=f11e424]:
                - text: To configure manually, use the Context7 server URL
                - code [ref=f11e425]: https://mcp.context7.com/mcp
                - text: with your MCP client and pass your API key via the
                - code [ref=f11e426]: "Authorization: Bearer YOUR_API_KEY"
                - text: header. See the link below for client-specific setup instructions.
              - paragraph [ref=f11e427]:
                - strong [ref=f11e428]:
                  - link "Manual Installation / Other Clients →" [ref=f11e429] [cursor=pointer]:
                    - /url: https://context7.com/docs/resources/all-clients
              - generic [ref=f11e430]:
                - heading "Important Tips" [level=2] [ref=f11e431]
                - 'link "Permalink: Important Tips" [ref=f11e432] [cursor=pointer]':
                  - /url: "#important-tips"
              - generic [ref=f11e435]:
                - heading "Use Library Id" [level=3] [ref=f11e436]
                - 'link "Permalink: Use Library Id" [ref=f11e437] [cursor=pointer]':
                  - /url: "#use-library-id"
              - paragraph [ref=f11e440]: If you already know exactly which library you want to use, add its Context7 ID to your prompt. That way, Context7 can skip the library-matching step and directly retrieve docs.
              - generic [ref=f11e441]:
                - generic [ref=f11e442]: Implement basic authentication with Supabase. use library /supabase/supabase for API and docs.
                - button "Copy code to clipboard" [ref=f11e444] [cursor=pointer]
              - paragraph [ref=f11e448]: The slash syntax tells Context7 exactly which library to load docs for.
              - generic [ref=f11e449]:

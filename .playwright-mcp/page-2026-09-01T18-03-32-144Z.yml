                    - /url: /stripe/ai/blob/main/llm/token-meter
                    - code [ref=f23e328]: "@stripe/token-meter"
                  - text: "- for integrating Stripe's billing infrastructure with native SDKs from OpenAI, Anthropic, and Google Gemini, without any framework dependencies."
              - generic [ref=f23e329]:
                - heading "Model Context Protocol (MCP)" [level=2] [ref=f23e330]

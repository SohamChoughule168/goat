              - paragraph [ref=f23e316]: This repo is the one-stop shop for building AI-powered products and businesses on top of Stripe.
              - paragraph [ref=f23e317]: "It contains a collection of SDKs to help you integrate Stripe with LLMs and agent frameworks, including:"
              - list [ref=f23e318]:

                    - /url: "#8-agent-tool-firecrawl_agent"
                - paragraph [ref=f9e1230]: Autonomous web research agent. This is a separate AI agent layer that independently browses the internet, searches for information, navigates through pages, and extracts structured data based on your query.
                - paragraph [ref=f9e1231]:
                  - strong [ref=f9e1232]: "How it works:"
                - paragraph [ref=f9e1233]:
                  - text: The agent performs web searches, follows links, reads pages, and gathers data autonomously. This runs
                  - strong [ref=f9e1234]: asynchronously
                  - text: "- it returns a job ID immediately, and you poll"

                  - text: endpoint.
                - paragraph [ref=f9e1165]:
                  - strong [ref=f9e1166]: "Best for:"
                  - text: PDFs, Word documents, spreadsheets, HTML files, and other documents that need markdown or structured JSON output. Hosted MCP supports a two-step upload-ref flow; local direct file reads require a self-hosted
                  - code [ref=f9e1167]: FIRECRAWL_API_URL

                    - text: ": expand from one or more anchor papers through the citation graph."
                  - listitem [ref=f9e1404]:
                    - code [ref=f9e1405]: firecrawl_research_read_paper
                    - text: ": read full-text passages from a specific paper."
                  - listitem [ref=f9e1406]:
                    - code [ref=f9e1407]: firecrawl_research_search_github
                    - text: ": search indexed public GitHub issue, pull-request, and README content."
                - paragraph [ref=f9e1408]:
                  - strong [ref=f9e1409]: "Best for:"
                  - text: Literature review, paper lookup, and repository discovery workflows where the agent needs a focused research surface instead of general web scraping.
                - paragraph [ref=f9e1410]:
                  - code [ref=f9e1411]: firecrawl_search
                  - text: with
                  - code [ref=f9e1412]: "categories: [\"research\"]"
                  - text: "is a different surface: it filters ordinary web results to research-affiliated websites and returns page snippets, not paper records. Use these tools when the question is about the literature itself, and pass several distinct framings of the same question — they surface different papers than a single query does."
                - generic [ref=f9e1413]:
                  - heading [level=3] [ref=f9e1414]:
                    - text: 13. Monitor Tools (
                    - code [ref=f9e1415]: firecrawl_monitor_*
                    - text: )
                  - 'link "Permalink: 13. Monitor Tools (firecrawl_monitor_*)" [ref=f9e1416] [cursor=pointer]':
                    - /url: "#13-monitor-tools-firecrawl_monitor_"
                - paragraph [ref=f9e1419]: Create and manage recurring page monitors. Monitors run scheduled scrapes or crawls, diff each result against the last retained snapshot, and can notify by webhook or email.
                - paragraph [ref=f9e1420]:
                  - strong [ref=f9e1421]: "Best for:"
                - list [ref=f9e1422]:
                  - listitem [ref=f9e1423]: Watching one page or a few pages over time
                  - listitem [ref=f9e1424]: Alerting on meaningful changes using a plain-English goal
                  - listitem [ref=f9e1425]: Tracking check history and page-level diffs
                - paragraph [ref=f9e1426]:
                  - strong [ref=f9e1427]: "Recommended create pattern:"
                - paragraph [ref=f9e1428]:
                  - text: Use
                  - code [ref=f9e1429]: page
                  - text: or
                  - code [ref=f9e1430]: pages
                  - text: plus
                  - code [ref=f9e1431]: goal
                  - text: . The MCP server builds the monitor request with a 30-minute schedule and the API enables meaningful-change judging automatically.
                - paragraph [ref=f9e1432]:
                  - text: Meaningful-change judging runs automatically when
                  - code [ref=f9e1433]: goal
                  - text: is set. Page webhooks expose
                  - code [ref=f9e1434]: isMeaningful
                  - text: and
                  - code [ref=f9e1435]: judgment
                  - text: "on"
                  - code [ref=f9e1436]: monitor.page
                  - text: events.
                - paragraph [ref=f9e1437]: Write goals as concise 2-3 sentence monitor instructions. Say what should trigger an alert, preserve any scope the user gave, and include intent-specific exclusions only when obvious from the request. Generic noise such as whitespace, formatting-only changes, request IDs, tracking params, generic metadata, and unrelated page chrome is already handled by the judge, so do not repeat it in every goal. If the user is vague, keep the goal broad; if they ask for broad monitoring or "any change", preserve that. If the user says they do not care about something, include that explicitly.
                - generic [ref=f9e1438]:
                  - generic [ref=f9e1439]:
                    - text: "{ \"name\":"
                    - generic [ref=f9e1440]: "\"firecrawl_monitor_create\""
                    - text: ", \"arguments\": { \"page\":"

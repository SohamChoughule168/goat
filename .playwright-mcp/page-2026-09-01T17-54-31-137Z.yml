                    - /url: "#12-research-tools-firecrawl_research_"
                - paragraph [ref=f9e1392]: Search and inspect papers and GitHub repositories through the research MCP tools.
                - paragraph [ref=f9e1393]:
                  - strong [ref=f9e1394]: "Covers:"
                  - text: paper abstracts and full text across biomedical, life-science, and clinical literature (PubMed, bioRxiv, medRxiv) alongside arXiv and other scientific sources.
                - paragraph [ref=f9e1395]:
                  - strong [ref=f9e1396]: "Available research tools:"
                - list [ref=f9e1397]:
                  - listitem [ref=f9e1398]:
                    - code [ref=f9e1399]: firecrawl_research_search_papers
                    - text: ": search paper metadata and abstracts with a natural-language query, with optional author, category, and date filters."
                  - listitem [ref=f9e1400]:

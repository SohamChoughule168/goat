                  - text: Hosted MCP cannot read the caller's filesystem directly. Call
                  - code [ref=f9e1172]: firecrawl_parse
                  - text: with
                  - code [ref=f9e1173]: filePath
                  - text: to receive a short-lived upload command and
                  - code [ref=f9e1174]: nextToolCall
                  - text: ", upload the file locally, then call"

            - article [ref=f24e302]:
              - generic [ref=f24e303]:
                - heading "sentry-mcp" [level=1] [ref=f24e304]
                - 'link "Permalink: sentry-mcp" [ref=f24e305] [cursor=pointer]':
                  - /url: "#sentry-mcp"
              - paragraph [ref=f24e308]: Sentry's MCP service is primarily designed for human-in-the-loop coding agents. Our tool selection and priorities are focused on developer workflows and debugging use cases, rather than providing a general-purpose MCP server for all Sentry functionality.
              - paragraph [ref=f24e309]:
                - text: This remote MCP server acts as middleware to the upstream Sentry API, optimized for coding assistants like Cursor, Claude Code, and similar development tools. It's based on
                - link "Cloudflare's work towards remote MCPs" [ref=f24e310] [cursor=pointer]:
                  - /url: https://blog.cloudflare.com/remote-model-context-protocol-servers-mcp/
                - text: .
              - generic [ref=f24e311]:
                - heading "Getting Started" [level=2] [ref=f24e312]
                - 'link "Permalink: Getting Started" [ref=f24e313] [cursor=pointer]':
                  - /url: "#getting-started"
              - paragraph [ref=f24e316]: "You'll find everything you need to know by visiting the deployed service in production:"
              - paragraph [ref=f24e317]:
                - link "https://mcp.sentry.dev" [ref=f24e318] [cursor=pointer]:
                  - /url: https://mcp.sentry.dev
              - paragraph [ref=f24e319]: If you're looking to contribute, learn how it works, or to run this for self-hosted Sentry, continue below.
              - generic [ref=f24e320]:
                - heading "Claude Code Plugin" [level=3] [ref=f24e321]
                - 'link "Permalink: Claude Code Plugin" [ref=f24e322] [cursor=pointer]':
                  - /url: "#claude-code-plugin"
              - paragraph [ref=f24e325]: "Install as a Claude Code plugin for automatic subagent delegation:"
              - generic [ref=f24e326]:
                - generic [ref=f24e327]: claude plugin marketplace add getsentry/sentry-mcp claude plugin install sentry-mcp@sentry-mcp
                - button "Copy code to clipboard" [ref=f24e329] [cursor=pointer]
              - paragraph [ref=f24e333]:
                - text: This provides a
                - code [ref=f24e334]: sentry-mcp
                - text: subagent that Claude automatically delegates to when you ask about Sentry errors, issues, traces, or performance.
              - paragraph [ref=f24e335]: "For forward-looking tool variants and features:"
              - generic [ref=f24e336]:
                - generic [ref=f24e337]: claude plugin install sentry-mcp@sentry-mcp-experimental
                - button "Copy code to clipboard" [ref=f24e339] [cursor=pointer]
              - generic [ref=f24e343]:
                - heading "Stdio vs Remote" [level=3] [ref=f24e344]
                - 'link "Permalink: Stdio vs Remote" [ref=f24e345] [cursor=pointer]':
                  - /url: "#stdio-vs-remote"
              - paragraph [ref=f24e348]:
                - text: While this repository is focused on acting as an MCP service, we also support a
                - code [ref=f24e349]: stdio
                - text: transport. This is still a work in progress, but is the easiest way to adapt run the MCP against a self-hosted Sentry install.
              - paragraph [ref=f24e350]:
                - strong [ref=f24e351]: "Note:"
                - text: The AI-powered search tools (
                - code [ref=f24e352]: search_events
                - text: ","
                - code [ref=f24e353]: search_issues
                - text: ", etc.) require an LLM provider (OpenAI, Azure OpenAI, Anthropic, or OpenRouter). These tools use natural language processing to translate queries into Sentry's query syntax. Without a configured provider, these specific tools will be unavailable, but all other tools will function normally."
              - paragraph [ref=f24e354]:
                - text: To utilize the
                - code [ref=f24e355]: stdio
                - text: "transport, you'll need to create an User Auth Token in Sentry with the necessary scopes. As of writing this is:"
              - generic [ref=f24e356]:
                - code [ref=f24e358]: org:read project:read project:write team:read team:write event:write
                - button "Copy code to clipboard" [ref=f24e360] [cursor=pointer]
              - paragraph [ref=f24e364]: "Launch the transport:"
              - generic [ref=f24e365]:
                - generic [ref=f24e366]: npx @sentry/mcp-server@latest --access-token=sentry-user-token
                - button "Copy code to clipboard" [ref=f24e368] [cursor=pointer]
              - paragraph [ref=f24e372]:
                - text: Need to connect to a self-hosted deployment? Add
                - code [ref=f24e373]: "--host"
                - text: (hostname only, e.g.
                - code [ref=f24e374]: "--host=sentry.example.com"
                - text: ) when you run the command. For isolated internal deployments that only expose plain HTTP, also add
                - code [ref=f24e375]: "--insecure-http"
                - text: .
              - paragraph [ref=f24e376]: "Some features (like Seer) may not be available on self-hosted instances. You can disable specific skills to prevent unsupported tools from being exposed:"
              - generic [ref=f24e377]:
                - generic [ref=f24e378]: npx @sentry/mcp-server@latest --access-token=TOKEN --host=sentry.example.com --disable-skills=seer
                - button "Copy code to clipboard" [ref=f24e380] [cursor=pointer]
              - paragraph [ref=f24e384]: "For self-hosted instances without TLS:"
              - generic [ref=f24e385]:
                - generic [ref=f24e386]: npx @sentry/mcp-server@latest --access-token=TOKEN --host=sentry.internal:9000 --insecure-http
                - button "Copy code to clipboard" [ref=f24e388] [cursor=pointer]
              - generic [ref=f24e392]:
                - heading "Remote with an Explicit Sentry Token" [level=4] [ref=f24e393]
                - 'link "Permalink: Remote with an Explicit Sentry Token" [ref=f24e394] [cursor=pointer]':
                  - /url: "#remote-with-an-explicit-sentry-token"
              - paragraph [ref=f24e397]: "Remote clients that support custom HTTP headers can pass an upstream Sentry API token directly to the Cloudflare transport:"
              - generic [ref=f24e398]:
                - generic [ref=f24e399]:
                  - text: "{ \"mcpServers\": { \"sentry\": { \"url\":"
                  - generic [ref=f24e400]: "\"https://mcp.sentry.dev/mcp\""
                  - text: ", \"headers\": { \"Authorization\":"
                  - generic [ref=f24e401]: "\"Sentry-Bearer ${SENTRY_ACCESS_TOKEN}\""
                  - text: "} } } }"
                - button "Copy code to clipboard" [ref=f24e403] [cursor=pointer]
              - paragraph [ref=f24e407]:
                - code [ref=f24e408]: Sentry-Bearer
                - text: is intentionally separate from
                - code [ref=f24e409]: Bearer
                - text: ":"
                - code [ref=f24e410]: Bearer
                - text: is reserved for MCP OAuth access tokens. With
                - code [ref=f24e411]: Sentry-Bearer
                - text: ", the worker does not store, validate, exchange, or refresh the upstream token. It forwards the token through the same Sentry API calls used by OAuth-backed sessions, and the client or upstream provider remains responsible for token lifetime and refresh."
              - paragraph [ref=f24e412]:
                - text: Direct remote auth defaults to all active MCP skills. You can narrow the exposed tools with
                - code [ref=f24e413]: "?skills=inspect,triage"
                - text: or
                - code [ref=f24e414]: "?disable-skills=seer"
                - text: .
              - generic [ref=f24e415]:
                - heading "Environment Variables" [level=4] [ref=f24e416]
                - 'link "Permalink: Environment Variables" [ref=f24e417] [cursor=pointer]':
                  - /url: "#environment-variables"
              - generic [ref=f24e420]:
                - generic [ref=f24e421]:
                  - text: SENTRY_ACCESS_TOKEN=
                  - generic [ref=f24e422]: "# Required: Your Sentry auth token"
                  - generic [ref=f24e423]: "# LLM Provider Configuration (required for AI-powered search tools)"
                  - text: EMBEDDED_AGENT_PROVIDER=
                  - generic [ref=f24e424]: "# Required when multiple provider keys are set: 'openai', 'azure-openai', 'anthropic', or 'openrouter'"
                  - text: OPENAI_API_KEY=
                  - generic [ref=f24e425]: "# Required if using OpenAI"
                  - text: ANTHROPIC_API_KEY=
                  - generic [ref=f24e426]: "# Required if using Anthropic"
                  - text: OPENROUTER_API_KEY=
                  - generic [ref=f24e427]: "# Required if using OpenRouter"
                  - text: OPENROUTER_MODEL=
                  - generic [ref=f24e428]: "# Optional OpenRouter model, defaults to 'openai/gpt-5.6-luna'"
                  - text: OPENROUTER_REASONING_EFFORT=
                  - generic [ref=f24e429]: "# Optional OpenRouter reasoning effort, defaults to 'high'"
                  - generic [ref=f24e430]: "# Optional overrides"
                  - text: SENTRY_HOST=
                  - generic [ref=f24e431]: "# For self-hosted deployments"
                  - text: MCP_DISABLE_SKILLS=
                  - generic [ref=f24e432]: "# Disable specific skills (comma-separated, e.g. 'seer')"
                - button "Copy code to clipboard" [ref=f24e434] [cursor=pointer]
              - paragraph [ref=f24e438]:
                - strong [ref=f24e439]: "Important:"
                - text: Always set
                - code [ref=f24e440]: EMBEDDED_AGENT_PROVIDER
                - text: to explicitly specify your LLM provider. Auto-detection based on API keys alone is deprecated and will be removed in a future release. See
                - link "docs/operations/embedded-agents.md" [ref=f24e441] [cursor=pointer]:
                  - /url: /getsentry/sentry-mcp/blob/main/docs/operations/embedded-agents.md
                - text: for detailed configuration options.
              - generic [ref=f24e442]:
                - heading "Example MCP Configuration" [level=4] [ref=f24e443]
                - 'link "Permalink: Example MCP Configuration" [ref=f24e444] [cursor=pointer]':
                  - /url: "#example-mcp-configuration"
              - generic [ref=f24e447]:
                - generic [ref=f24e448]:
                  - text: "{ \"mcpServers\": { \"sentry\": { \"command\":"
                  - generic [ref=f24e449]: "\"npx\""
                  - text: ", \"args\": ["
                  - generic [ref=f24e450]: "\"@sentry/mcp-server\""
                  - text: "], \"env\": { \"SENTRY_ACCESS_TOKEN\":"
                  - generic [ref=f24e451]: "\"your-token\""

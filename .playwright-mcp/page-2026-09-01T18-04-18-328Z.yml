                - button "Copy code to clipboard" [ref=f24e455] [cursor=pointer]
              - paragraph [ref=f24e459]: If you leave the host variable unset, the CLI automatically targets the Sentry SaaS service. Only set the override when you operate self-hosted Sentry.
              - paragraph [ref=f24e460]: "For self-hosted instances that don't support Seer:"
              - generic [ref=f24e461]:

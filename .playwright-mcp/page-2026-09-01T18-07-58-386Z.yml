              - generic [ref=f28e562]:
                - heading "Snowflake Querying" [level=3] [ref=f28e563]
                - 'link "Permalink: Snowflake Querying" [ref=f28e564] [cursor=pointer]':
                  - /url: "#snowflake-querying"
              - blockquote [ref=f28e567]:
                - paragraph [ref=f28e568]:
                  - strong [ref=f28e569]: "Note:"
                  - text: Snowflake tools are
                  - strong [ref=f28e570]: disabled by default
                  - text: . To enable them, add
                  - code [ref=f28e571]: snowflake
                  - text: to your
                  - code [ref=f28e572]: "--enabled-tools"
                  - text: flag.
              - paragraph [ref=f28e573]:
                - text: Queries go through Grafana's Snowflake datasource (Grafana Enterprise plugin
                - code [ref=f28e574]: grafana-snowflake-datasource
                - text: ), so authentication is handled by the datasource configuration in Grafana — credentials are never seen by the MCP server. This is the same model used for the ClickHouse tools.
              - list [ref=f28e575]:
                - listitem [ref=f28e576]:
                  - strong [ref=f28e577]: "List Snowflake tables:"
                  - text: Discover tables (with database, schema, kind, row count, and size) via
                  - code [ref=f28e578]: INFORMATION_SCHEMA.TABLES
                  - text: . Optional database/schema filters.
                - listitem [ref=f28e579]:
                  - strong [ref=f28e580]: "Describe table schema:"
                  - text: Get column names, data types, nullability, defaults, and comments for a Snowflake table.
                - listitem [ref=f28e581]:
                  - strong [ref=f28e582]: "Query Snowflake:"
                  - text: Execute SQL queries with macro and variable substitution support. Useful for querying Snowflake's event tables (e.g.
                  - code [ref=f28e583]: SNOWFLAKE.TELEMETRY.EVENTS
                  - text: ) for logs and traces, or any user table.
                  - list [ref=f28e584]:
                    - listitem [ref=f28e585]:
                      - text: "Supported macros:"
                      - code [ref=f28e586]: $__timeFilter(column)
                      - text: ","
                      - code [ref=f28e587]: $__timeFrom
                      - text: ","
                      - code [ref=f28e588]: $__timeTo
                      - text: ","
                      - code [ref=f28e589]: $__from
                      - text: ","
                      - code [ref=f28e590]: $__to
                      - text: (Unix ms),
                      - code [ref=f28e591]: $__interval
                      - text: (seconds),
                      - code [ref=f28e592]: $__interval_ms
                      - text: ", and"
                      - code [ref=f28e593]: "${varname}"
                      - text: for template variable substitution.
              - generic [ref=f28e594]:

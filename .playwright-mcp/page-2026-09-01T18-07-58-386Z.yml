              - generic [ref=f28e3319]:
                - generic [ref=f28e3320]: make test-integration
                - button "Copy code to clipboard" [ref=f28e3322] [cursor=pointer]
              - list [ref=f28e3326]:
                - listitem [ref=f28e3327]: "Cloud Tests (requires cloud Grafana instance and credentials):"
              - generic [ref=f28e3328]:
                - generic [ref=f28e3329]: make test-cloud
                - button "Copy code to clipboard" [ref=f28e3331] [cursor=pointer]
              - blockquote [ref=f28e3335]:
                - paragraph [ref=f28e3336]: "Note: Cloud tests are automatically configured in CI. For local development, you'll need to set up your own Grafana Cloud instance and credentials."
              - paragraph [ref=f28e3337]: "More comprehensive integration tests will require a Grafana instance to be running locally on port 3000; you can start one with Docker Compose:"
              - generic [ref=f28e3338]:

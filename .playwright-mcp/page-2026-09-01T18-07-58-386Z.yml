              - paragraph [ref=f28e857]:
                - text: The list of tools is configurable, so you can choose which tools you want to make available to the MCP client. This is useful if you don't use certain functionality or if you don't want to take up too much of the context window. To disable a category of tools, use the
                - code [ref=f28e858]: "--disable-<category>"
                - text: flag when starting the server. For example, to disable the OnCall tools, use
                - code [ref=f28e859]: "--disable-oncall"
                - text: ", or to disable navigation deeplink generation, use"
                - code [ref=f28e860]: "--disable-navigation"
                - text: .
              - generic [ref=f28e861]:
                - heading "RBAC Permissions" [level=4] [ref=f28e862]
                - 'link "Permalink: RBAC Permissions" [ref=f28e863] [cursor=pointer]':
                  - /url: "#rbac-permissions"
              - paragraph [ref=f28e866]:
                - text: Each tool requires specific RBAC permissions to function properly. When creating a service account for the MCP server, ensure it has the necessary permissions based on which tools you plan to use. The permissions listed are the minimum required actions - you may also need appropriate scopes (e.g.,
                - code [ref=f28e867]: datasources:*
                - text: ","
                - code [ref=f28e868]: dashboards:*
                - text: ","
                - code [ref=f28e869]: folders:*
                - text: ) depending on your use case.
              - paragraph [ref=f28e870]:
                - text: "Tip: If you're not familiar with Grafana RBAC or you want a quicker, simpler setup instead of configuring many granular scopes, you can assign a built-in role such as"
                - code [ref=f28e871]: Editor
                - text: to the service account. The
                - code [ref=f28e872]: Editor
                - text: role grants broad read/write access that will allow most MCP server operations; it is less granular (and therefore less restrictive) than manually-applied scopes, so use it only when convenience is more important than strict least-privilege access.
              - paragraph [ref=f28e873]:
                - strong [ref=f28e874]: "Note:"
                - text: "Grafana Incident and Sift tools use basic Grafana roles instead of fine-grained RBAC permissions:"
              - list [ref=f28e875]:
                - listitem [ref=f28e876]:
                  - strong [ref=f28e877]: "Viewer role:"
                  - text: Required for read-only operations (list incidents, get investigations)
                - listitem [ref=f28e878]:
                  - strong [ref=f28e879]: "Editor role:"
                  - text: Required for write operations (create incidents, modify investigations)
              - paragraph [ref=f28e880]:
                - text: For more information about Grafana RBAC, see the
                - link "official documentation" [ref=f28e881] [cursor=pointer]:
                  - /url: https://grafana.com/docs/grafana/latest/administration/roles-and-permissions/access-control/
                - text: .
              - generic [ref=f28e882]:
                - heading "RBAC Scopes" [level=4] [ref=f28e883]
                - 'link "Permalink: RBAC Scopes" [ref=f28e884] [cursor=pointer]':
                  - /url: "#rbac-scopes"
              - paragraph [ref=f28e887]: Scopes define the specific resources that permissions apply to. Each action requires both the appropriate permission and scope combination.
              - paragraph [ref=f28e888]:
                - strong [ref=f28e889]: "Common Scope Patterns:"
              - list [ref=f28e890]:
                - listitem [ref=f28e891]:
                  - paragraph [ref=f28e892]:
                    - strong [ref=f28e893]: "Broad access:"
                    - text: Use
                    - code [ref=f28e894]: "*"
                    - text: wildcards for organization-wide access
                  - list [ref=f28e895]:
                    - listitem [ref=f28e896]:
                      - code [ref=f28e897]: datasources:*
                      - text: "- Access to all datasources"
                    - listitem [ref=f28e898]:
                      - code [ref=f28e899]: dashboards:*
                      - text: "- Access to all dashboards"
                    - listitem [ref=f28e900]:
                      - code [ref=f28e901]: folders:*
                      - text: "- Access to all folders"
                    - listitem [ref=f28e902]:
                      - code [ref=f28e903]: teams:*
                      - text: "- Access to all teams"
                - listitem [ref=f28e904]:
                  - paragraph [ref=f28e905]:
                    - strong [ref=f28e906]: "Limited access:"
                    - text: Use specific UIDs or IDs to restrict access to individual resources
                  - list [ref=f28e907]:
                    - listitem [ref=f28e908]:
                      - code [ref=f28e909]: datasources:uid:prometheus-uid
                      - text: "- Access only to a specific Prometheus datasource"
                    - listitem [ref=f28e910]:
                      - code [ref=f28e911]: dashboards:uid:abc123
                      - text: "- Access only to dashboard with UID"
                      - code [ref=f28e912]: abc123
                    - listitem [ref=f28e913]:
                      - code [ref=f28e914]: folders:uid:xyz789
                      - text: "- Access only to folder with UID"
                      - code [ref=f28e915]: xyz789
                    - listitem [ref=f28e916]:
                      - code [ref=f28e917]: teams:id:5
                      - text: "- Access only to team with ID"
                      - code [ref=f28e918]: "5"
                    - listitem [ref=f28e919]:
                      - code [ref=f28e920]: global.users:id:123
                      - text: "- Access only to user with ID"
                      - code [ref=f28e921]: "123"
              - paragraph [ref=f28e922]:
                - strong [ref=f28e923]: "Examples:"
              - list [ref=f28e924]:
                - listitem [ref=f28e925]:
                  - paragraph [ref=f28e926]:
                    - strong [ref=f28e927]: "Full MCP server access:"
                    - text: Grant broad permissions for all tools
                  - generic [ref=f28e928]:
                    - code [ref=f28e930]: datasources:* (datasources:read, datasources:query) dashboards:* (dashboards:read, dashboards:create, dashboards:write) folders:* (for dashboard creation and alert rules) teams:* (teams:read) global.users:* (users:read)
                    - button "Copy code to clipboard" [ref=f28e932] [cursor=pointer]
                - listitem [ref=f28e936]:

              - paragraph [ref=f28e2759]: "If your Grafana instance is behind mTLS or requires custom TLS certificates, you can configure the MCP server to use custom certificates. The server supports the following TLS configuration options:"
              - list [ref=f28e2760]:
                - listitem [ref=f28e2761]:
                  - code [ref=f28e2762]: "--tls-cert-file"
                  - text: ": Path to TLS certificate file for client authentication"
                - listitem [ref=f28e2763]:
                  - code [ref=f28e2764]: "--tls-key-file"
                  - text: ": Path to TLS private key file for client authentication"
                - listitem [ref=f28e2765]:
                  - code [ref=f28e2766]: "--tls-ca-file"
                  - text: ": Path to TLS CA certificate file for server verification"
                - listitem [ref=f28e2767]:
                  - code [ref=f28e2768]: "--tls-skip-verify"
                  - text: ": Skip TLS certificate verification (insecure, use only for testing)"
              - paragraph [ref=f28e2769]:
                - strong [ref=f28e2770]: "Example with client certificate authentication:"
              - generic [ref=f28e2771]:
                - generic [ref=f28e2772]:
                  - text: "{ \"mcpServers\": { \"grafana\": { \"command\":"
                  - generic [ref=f28e2773]: "\"mcp-grafana\""
                  - text: ", \"args\": ["
                  - generic [ref=f28e2774]: "\"--tls-cert-file\""
                  - text: ","
                  - generic [ref=f28e2775]: "\"/path/to/client.crt\""
                  - text: ","
                  - generic [ref=f28e2776]: "\"--tls-key-file\""
                  - text: ","
                  - generic [ref=f28e2777]: "\"/path/to/client.key\""
                  - text: ","
                  - generic [ref=f28e2778]: "\"--tls-ca-file\""
                  - text: ","
                  - generic [ref=f28e2779]: "\"/path/to/ca.crt\""
                  - text: "], \"env\": { \"GRAFANA_URL\":"
                  - generic [ref=f28e2780]: "\"https://secure-grafana.example.com\""
                  - text: ", \"GRAFANA_SERVICE_ACCOUNT_TOKEN\":"
                  - generic [ref=f28e2781]: "\"<your service account token>\""
                  - text: "} } } }"
                - button "Copy code to clipboard" [ref=f28e2783] [cursor=pointer]
              - paragraph [ref=f28e2787]:
                - strong [ref=f28e2788]: "Example with Docker:"
              - generic [ref=f28e2789]:
                - generic [ref=f28e2790]:
                  - text: "{ \"mcpServers\": { \"grafana\": { \"command\":"
                  - generic [ref=f28e2791]: "\"docker\""
                  - text: ", \"args\": ["
                  - generic [ref=f28e2792]: "\"run\""
                  - text: ","
                  - generic [ref=f28e2793]: "\"--rm\""
                  - text: ","
                  - generic [ref=f28e2794]: "\"-i\""
                  - text: ","
                  - generic [ref=f28e2795]: "\"-v\""
                  - text: ","
                  - generic [ref=f28e2796]: "\"/path/to/certs:/certs:ro\""
                  - text: ","
                  - generic [ref=f28e2797]: "\"-e\""
                  - text: ","
                  - generic [ref=f28e2798]: "\"GRAFANA_URL\""
                  - text: ","
                  - generic [ref=f28e2799]: "\"-e\""
                  - text: ","
                  - generic [ref=f28e2800]: "\"GRAFANA_SERVICE_ACCOUNT_TOKEN\""
                  - text: ","
                  - generic [ref=f28e2801]: "\"grafana/mcp-grafana\""
                  - text: ","
                  - generic [ref=f28e2802]: "\"-t\""
                  - text: ","
                  - generic [ref=f28e2803]: "\"stdio\""
                  - text: ","
                  - generic [ref=f28e2804]: "\"--tls-cert-file\""
                  - text: ","
                  - generic [ref=f28e2805]: "\"/certs/client.crt\""
                  - text: ","
                  - generic [ref=f28e2806]: "\"--tls-key-file\""
                  - text: ","
                  - generic [ref=f28e2807]: "\"/certs/client.key\""
                  - text: ","
                  - generic [ref=f28e2808]: "\"--tls-ca-file\""
                  - text: ","
                  - generic [ref=f28e2809]: "\"/certs/ca.crt\""
                  - text: "], \"env\": { \"GRAFANA_URL\":"
                  - generic [ref=f28e2810]: "\"https://secure-grafana.example.com\""
                  - text: ", \"GRAFANA_SERVICE_ACCOUNT_TOKEN\":"
                  - generic [ref=f28e2811]: "\"<your service account token>\""
                  - text: "} } } }"
                - button "Copy code to clipboard" [ref=f28e2813] [cursor=pointer]
              - paragraph [ref=f28e2817]: "The TLS configuration is applied to all HTTP clients used by the MCP server, including:"
              - list [ref=f28e2818]:
                - listitem [ref=f28e2819]: The main Grafana OpenAPI client
                - listitem [ref=f28e2820]: Prometheus datasource clients
                - listitem [ref=f28e2821]: Loki datasource clients
                - listitem [ref=f28e2822]: Incident management clients
                - listitem [ref=f28e2823]: Sift investigation clients
                - listitem [ref=f28e2824]: Alerting clients
                - listitem [ref=f28e2825]: Asserts clients
              - paragraph [ref=f28e2826]:
                - strong [ref=f28e2827]: "Direct CLI Usage Examples:"
              - paragraph [ref=f28e2828]: "For testing with self-signed certificates:"
              - generic [ref=f28e2829]:
                - generic [ref=f28e2830]: ./mcp-grafana --tls-skip-verify -debug
                - button "Copy code to clipboard" [ref=f28e2832] [cursor=pointer]
              - paragraph [ref=f28e2836]: "With client certificate authentication:"
              - generic [ref=f28e2837]:
                - generic [ref=f28e2838]: ./mcp-grafana \ --tls-cert-file /path/to/client.crt \ --tls-key-file /path/to/client.key \ --tls-ca-file /path/to/ca.crt \ -debug
                - button "Copy code to clipboard" [ref=f28e2840] [cursor=pointer]
              - paragraph [ref=f28e2844]: "With custom CA certificate only:"
              - generic [ref=f28e2845]:
                - generic [ref=f28e2846]: ./mcp-grafana --tls-ca-file /path/to/ca.crt
                - button "Copy code to clipboard" [ref=f28e2848] [cursor=pointer]
              - paragraph [ref=f28e2852]:
                - strong [ref=f28e2853]: "Programmatic Usage:"
              - paragraph [ref=f28e2854]: "If you're using this library programmatically, you can also create TLS-enabled context functions:"
              - generic [ref=f28e2855]:
                - generic [ref=f28e2856]: "// Using struct literals tlsConfig := &mcpgrafana.TLSConfig{ CertFile: \"/path/to/client.crt\", KeyFile: \"/path/to/client.key\", CAFile: \"/path/to/ca.crt\", } grafanaConfig := mcpgrafana.GrafanaConfig{ Debug: true, TLSConfig: tlsConfig, } contextFunc := mcpgrafana.ComposedStdioContextFunc(grafanaConfig) // Or inline grafanaConfig := mcpgrafana.GrafanaConfig{ Debug: true, TLSConfig: &mcpgrafana.TLSConfig{ CertFile: \"/path/to/client.crt\", KeyFile: \"/path/to/client.key\", CAFile: \"/path/to/ca.crt\", }, } contextFunc := mcpgrafana.ComposedStdioContextFunc(grafanaConfig)"
                - button "Copy code to clipboard" [ref=f28e2858] [cursor=pointer]
              - paragraph [ref=f28e2862]:
                - strong [ref=f28e2863]: "URL validation:"
              - paragraph [ref=f28e2864]:
                - text: When calling
                - code [ref=f28e2865]: NewGrafanaClient
                - text: "directly (stdio or programmatic construction), pre-validate URLs to avoid a reachable panic:"
              - generic [ref=f28e2866]:
                - generic [ref=f28e2867]: "if err := mcpgrafana.ValidateGrafanaURL(urlFromHeader); err != nil { http.Error(w, err.Error(), http.StatusBadRequest) return } client := mcpgrafana.NewGrafanaClient(ctx, urlFromHeader, apiKey, nil)"
                - button "Copy code to clipboard" [ref=f28e2869] [cursor=pointer]
              - generic [ref=f28e2873]:
                - heading "Server TLS Configuration (Streamable HTTP Transport Only)" [level=3] [ref=f28e2874]
                - 'link "Permalink: Server TLS Configuration (Streamable HTTP Transport Only)" [ref=f28e2875] [cursor=pointer]':
                  - /url: "#server-tls-configuration-streamable-http-transport-only"
              - paragraph [ref=f28e2878]:
                - text: When using the streamable HTTP transport (
                - code [ref=f28e2879]: "-t streamable-http"
                - text: ), you can configure the MCP server to serve HTTPS instead of HTTP. This is useful when you need to secure the connection between your MCP client and the server itself.
              - paragraph [ref=f28e2880]: "The server supports the following TLS configuration options for the streamable HTTP transport:"
              - list [ref=f28e2881]:
                - listitem [ref=f28e2882]:
                  - code [ref=f28e2883]: "--server.tls-cert-file"
                  - text: ": Path to TLS certificate file for server HTTPS (required for TLS)"
                - listitem [ref=f28e2884]:
                  - code [ref=f28e2885]: "--server.tls-key-file"
                  - text: ": Path to TLS private key file for server HTTPS (required for TLS)"
              - paragraph [ref=f28e2886]:
                - strong [ref=f28e2887]: Note
                - text: ": These flags are completely separate from the client TLS flags documented above. The client TLS flags configure how the MCP server connects to Grafana, while these server TLS flags configure how clients connect to the MCP server when using streamable HTTP transport."
              - paragraph [ref=f28e2888]:
                - strong [ref=f28e2889]: "Example with HTTPS streamable HTTP server:"
              - generic [ref=f28e2890]:
                - generic [ref=f28e2891]: ./mcp-grafana \ -t streamable-http \ --server.tls-cert-file /path/to/server.crt \ --server.tls-key-file /path/to/server.key \ -addr :8443
                - button "Copy code to clipboard" [ref=f28e2893] [cursor=pointer]
              - paragraph [ref=f28e2897]:
                - text: This would start the MCP server on HTTPS port 8443. Clients would then connect to
                - code [ref=f28e2898]: https://localhost:8443/
                - text: instead of
                - code [ref=f28e2899]: http://localhost:8000/
                - text: .
              - paragraph [ref=f28e2900]:
                - strong [ref=f28e2901]: "Docker example with server TLS:"
              - generic [ref=f28e2902]:
                - generic [ref=f28e2903]: docker run --rm -p 8443:8443 \ -v /path/to/certs:/certs:ro \ -e GRAFANA_URL=http://localhost:3000 \ -e GRAFANA_SERVICE_ACCOUNT_TOKEN=<your service account token> \ grafana/mcp-grafana \ -t streamable-http \ -addr :8443 \ --server.tls-cert-file /certs/server.crt \ --server.tls-key-file /certs/server.key
                - button "Copy code to clipboard" [ref=f28e2905] [cursor=pointer]
              - generic [ref=f28e2909]:
                - heading "Health Check Endpoint" [level=3] [ref=f28e2910]
                - 'link "Permalink: Health Check Endpoint" [ref=f28e2911] [cursor=pointer]':
                  - /url: "#health-check-endpoint"
              - paragraph [ref=f28e2914]:
                - text: When using the SSE (
                - code [ref=f28e2915]: "-t sse"
                - text: ) or streamable HTTP (
                - code [ref=f28e2916]: "-t streamable-http"
                - text: ) transports, the MCP server exposes a health check endpoint at
                - code [ref=f28e2917]: /healthz
                - text: . This endpoint can be used by load balancers, monitoring systems, or orchestration platforms to verify that the server is running and accepting connections.
              - paragraph [ref=f28e2918]:
                - strong [ref=f28e2919]: "Endpoint:"
                - code [ref=f28e2920]: GET /healthz
              - paragraph [ref=f28e2921]:
                - strong [ref=f28e2922]: "Response:"
              - list [ref=f28e2923]:
                - listitem [ref=f28e2924]:
                  - text: "Status Code:"
                  - code [ref=f28e2925]: 200 OK
                - listitem [ref=f28e2926]:
                  - text: "Body:"
                  - code [ref=f28e2927]: ok
              - paragraph [ref=f28e2928]:
                - strong [ref=f28e2929]: "Example usage:"
              - generic [ref=f28e2930]:
                - generic [ref=f28e2931]:
                  - generic [ref=f28e2932]: "# For streamable HTTP or SSE transport on default port"
                  - text: curl http://localhost:8000/healthz
                  - generic [ref=f28e2933]: "# With custom address"
                  - text: curl http://localhost:9090/healthz
                - button "Copy code to clipboard" [ref=f28e2935] [cursor=pointer]
              - paragraph [ref=f28e2939]:
                - strong [ref=f28e2940]: "Note:"
                - text: The health check endpoint is only available when using SSE or streamable HTTP transports. It is not available when using the stdio transport (
                - code [ref=f28e2941]: "-t stdio"
                - text: ), as stdio does not expose an HTTP server.
              - generic [ref=f28e2942]:
                - heading "Observability" [level=3] [ref=f28e2943]
                - 'link "Permalink: Observability" [ref=f28e2944] [cursor=pointer]':
                  - /url: "#observability"
              - paragraph [ref=f28e2947]:
                - text: The MCP server supports Prometheus metrics, OpenTelemetry distributed tracing, and OpenTelemetry log export, following the
                - link "OTel MCP semantic conventions" [ref=f28e2948] [cursor=pointer]:
                  - /url: https://opentelemetry.io/docs/specs/semconv/gen-ai/mcp/
                - text: . Tracing and log export are configured via standard
                - code [ref=f28e2949]: OTEL_*
                - text: environment variables and work with any transport.
              - paragraph [ref=f28e2950]:
                - strong [ref=f28e2951]: "Note:"
                - text: mcp-grafana currently only supports the OTLP/gRPC transport for both traces and logs.
                - code [ref=f28e2952]: OTEL_EXPORTER_OTLP_PROTOCOL
                - text: (and its
                - code [ref=f28e2953]: _TRACES_PROTOCOL
                - text: /
                - code [ref=f28e2954]: _LOGS_PROTOCOL
                - text: variants) are not honored — gRPC is used regardless.
              - generic [ref=f28e2955]:
                - heading "Metrics" [level=4] [ref=f28e2956]
                - 'link "Permalink: Metrics" [ref=f28e2957] [cursor=pointer]':
                  - /url: "#metrics"
              - paragraph [ref=f28e2960]:
                - text: When using the SSE or streamable HTTP transports, enable Prometheus metrics with the
                - code [ref=f28e2961]: "--metrics"
                - text: "flag:"
              - generic [ref=f28e2962]:
                - generic [ref=f28e2963]:
                  - generic [ref=f28e2964]: "# Metrics served on the main server at /metrics"
                  - text: ./mcp-grafana -t streamable-http --metrics
                  - generic [ref=f28e2965]: "# Metrics served on a separate address"
                  - text: ./mcp-grafana -t streamable-http --metrics --metrics-address :9090
                - button "Copy code to clipboard" [ref=f28e2967] [cursor=pointer]
              - paragraph [ref=f28e2971]:
                - strong [ref=f28e2972]: "Available Metrics:"
              - table [ref=f28e2974]:
                - rowgroup [ref=f28e2975]:
                  - row [ref=f28e2976]:
                    - columnheader "Metric" [ref=f28e2977]
                    - columnheader "Type" [ref=f28e2978]
                    - columnheader "Description" [ref=f28e2979]
                - rowgroup [ref=f28e2980]:
                  - row [ref=f28e2981]:
                    - cell [ref=f28e2982]:
                      - code [ref=f28e2983]: mcp_server_operation_duration_seconds
                    - cell "Histogram" [ref=f28e2984]
                    - cell [ref=f28e2985]:
                      - text: "Duration of MCP operations (labels:"
                      - code [ref=f28e2986]: mcp_method_name
                      - text: ","
                      - code [ref=f28e2987]: gen_ai_tool_name
                      - text: ","
                      - code [ref=f28e2988]: error_type
                      - text: ","
                      - code [ref=f28e2989]: network_transport
                      - text: ","
                      - code [ref=f28e2990]: mcp_protocol_version
                      - text: )
                  - row [ref=f28e2991]:
                    - cell [ref=f28e2992]:
                      - code [ref=f28e2993]: mcp_server_session_duration_seconds
                    - cell "Histogram" [ref=f28e2994]
                    - cell [ref=f28e2995]:
                      - text: "Duration of MCP client sessions (labels:"
                      - code [ref=f28e2996]: network_transport
                      - text: ","
                      - code [ref=f28e2997]: mcp_protocol_version
                      - text: )
                  - row [ref=f28e2998]:
                    - cell [ref=f28e2999]:
                      - code [ref=f28e3000]: http_server_request_duration_seconds
                    - cell "Histogram" [ref=f28e3001]
                    - cell "Duration of HTTP server requests (from otelhttp)" [ref=f28e3002]
              - paragraph [ref=f28e3003]:
                - strong [ref=f28e3004]: "Note:"
                - text: Metrics are only available when using SSE or streamable HTTP transports. They are not available with the stdio transport.
              - paragraph [ref=f28e3005]:
                - text: When the
                - link "Loki cost guardrail" [ref=f28e3006] [cursor=pointer]:
                  - /url: "#cli-flags-reference"
                - text: (
                - code [ref=f28e3007]: "--loki-guardrail-mode"
                - text: ") is enabled, four more counters record its decisions:"
              - table [ref=f28e3009]:
                - rowgroup [ref=f28e3010]:
                  - row [ref=f28e3011]:
                    - columnheader "Metric" [ref=f28e3012]
                    - columnheader "Type" [ref=f28e3013]
                    - columnheader "Description" [ref=f28e3014]
                - rowgroup [ref=f28e3015]:
                  - row [ref=f28e3016]:
                    - cell [ref=f28e3017]:
                      - code [ref=f28e3018]: mcp_loki_guardrail_admitted_total
                    - cell "Counter" [ref=f28e3019]
                    - cell [ref=f28e3020]:
                      - text: "Queries that passed every enabled check (labels:"
                      - code [ref=f28e3021]: backend
                      - text: )
                  - row [ref=f28e3022]:
                    - cell [ref=f28e3023]:
                      - code [ref=f28e3024]: mcp_loki_guardrail_would_block_total
                    - cell "Counter" [ref=f28e3025]
                    - cell [ref=f28e3026]:
                      - text: Queries that failed a check in
                      - code [ref=f28e3027]: shadow
                      - text: "mode and ran anyway (labels:"
                      - code [ref=f28e3028]: backend
                      - text: ","
                      - code [ref=f28e3029]: reason
                      - text: )
                  - row [ref=f28e3030]:
                    - cell [ref=f28e3031]:
                      - code [ref=f28e3032]: mcp_loki_guardrail_blocked_total
                    - cell "Counter" [ref=f28e3033]
                    - cell [ref=f28e3034]:
                      - text: Queries rejected in
                      - code [ref=f28e3035]: enforce
                      - text: "mode (labels:"
                      - code [ref=f28e3036]: backend
                      - text: ","
                      - code [ref=f28e3037]: reason
                      - text: )
                  - row [ref=f28e3038]:
                    - cell [ref=f28e3039]:
                      - code [ref=f28e3040]: mcp_loki_guardrail_fail_open_total
                    - cell "Counter" [ref=f28e3041]
                    - cell [ref=f28e3042]:
                      - text: "Queries the guardrail could not evaluate and admitted (labels:"
                      - code [ref=f28e3043]: backend
                      - text: ","
                      - code [ref=f28e3044]: cause
                      - text: )
              - paragraph [ref=f28e3045]:
                - code [ref=f28e3046]: reason
                - text: is one of
                - code [ref=f28e3047]: selector
                - text: ","
                - code [ref=f28e3048]: range
                - text: ","
                - code [ref=f28e3049]: bytes
                - text: ;
                - code [ref=f28e3050]: cause
                - text: is one of
                - code [ref=f28e3051]: unparseable
                - text: ","
                - code [ref=f28e3052]: estimate_failed
                - text: ;
                - code [ref=f28e3053]: backend
                - text: is one of
                - code [ref=f28e3054]: loki
                - text: ","
                - code [ref=f28e3055]: victorialogs
                - text: ","
                - code [ref=f28e3056]: unknown
                - text: . A query that trips several checks is counted once, labelled with the check that ran first (
                - code [ref=f28e3057]: selector
                - text: ", then"
                - code [ref=f28e3058]: range
                - text: ", then"
                - code [ref=f28e3059]: bytes
                - text: ), so the four counters partition the guarded population. See
                - link "Observability" [ref=f28e3060] [cursor=pointer]:
                  - /url: /grafana/mcp-grafana/blob/main/docs/sources/developer/observability-metrics-and-tracing.md#loki-cost-guardrail-metrics
                - text: for how to read them during a
                - code [ref=f28e3061]: shadow
                - text: →
                - code [ref=f28e3062]: enforce
                - text: rollout.
              - paragraph [ref=f28e3063]:
                - text: Library embedders should set
                - code [ref=f28e3064]: GrafanaConfig.MeterProvider
                - text: (the metrics counterpart of
                - code [ref=f28e3065]: GrafanaConfig.Logger
                - text: "): the guardrail runs inside a tool handler, so it has no constructor option, and a process that installs a noop global"
                - code [ref=f28e3066]: MeterProvider
                - text: would otherwise drop every recording.
              - generic [ref=f28e3067]:
                - heading "Slow-request logging" [level=4] [ref=f28e3068]
                - 'link "Permalink: Slow-request logging" [ref=f28e3069] [cursor=pointer]':
                  - /url: "#slow-request-logging"
              - paragraph [ref=f28e3072]:
                - text: The
                - code [ref=f28e3073]: "--slow-request-threshold"
                - text: flag emits a structured log event whenever an MCP request (tool invocation, list, resource read, etc.) exceeds the given duration. It is useful for diagnosing slow queries and tool calls without drowning in the full debug log.
              - generic [ref=f28e3074]:
                - generic [ref=f28e3075]:
                  - generic [ref=f28e3076]: "# Warn on any request slower than 500ms (works on all transports)"
                  - text: ./mcp-grafana -t streamable-http --slow-request-threshold 500ms
                  - generic [ref=f28e3077]: "# Same thing on stdio (the feature is transport-agnostic, unlike --metrics)"
                  - text: ./mcp-grafana -t stdio --slow-request-threshold 500ms
                  - generic [ref=f28e3078]: "# Log at INFO level instead of WARN (useful during investigation)"
                  - text: ./mcp-grafana -t streamable-http --slow-request-threshold 500ms --slow-request-log-level info
                - button "Copy code to clipboard" [ref=f28e3080] [cursor=pointer]
              - paragraph [ref=f28e3084]: "The log event carries these structured attributes:"
              - table [ref=f28e3086]:
                - rowgroup [ref=f28e3087]:
                  - row [ref=f28e3088]:
                    - columnheader "Attribute" [ref=f28e3089]
                    - columnheader "Description" [ref=f28e3090]
                - rowgroup [ref=f28e3091]:
                  - row [ref=f28e3092]:
                    - cell [ref=f28e3093]:
                      - code [ref=f28e3094]: mcp.method
                    - cell [ref=f28e3095]:
                      - text: The MCP method (e.g.,
                      - code [ref=f28e3096]: tools/call
                      - text: ","
                      - code [ref=f28e3097]: tools/list
                      - text: ","
                      - code [ref=f28e3098]: resources/read
                      - text: )
                  - row [ref=f28e3099]:
                    - cell [ref=f28e3100]:
                      - code [ref=f28e3101]: duration
                    - cell "Observed request duration" [ref=f28e3102]
                  - row [ref=f28e3103]:
                    - cell [ref=f28e3104]:
                      - code [ref=f28e3105]: threshold
                    - cell "Configured threshold" [ref=f28e3106]
                  - row [ref=f28e3107]:
                    - cell [ref=f28e3108]:
                      - code [ref=f28e3109]: tool
                    - cell [ref=f28e3110]:
                      - text: Tool name (only present for
                      - code [ref=f28e3111]: tools/call
                      - text: methods)
                  - row [ref=f28e3112]:
                    - cell [ref=f28e3113]:
                      - code [ref=f28e3114]: error
                    - cell "Error value, when the request failed (best-effort context; content is controlled by upstream error wrapping)" [ref=f28e3115]
                  - row [ref=f28e3116]:
                    - cell [ref=f28e3117]:
                      - code [ref=f28e3118]: error.type
                    - cell [ref=f28e3119]:
                      - text: Bounded-cardinality error classification (
                      - code [ref=f28e3120]: _OTHER
                      - text: for untyped errors)
              - paragraph [ref=f28e3121]:
                - text: Slow-request logging works on all transports (including stdio) and does not require
                - code [ref=f28e3122]: "--metrics"
                - text: . The default threshold of
                - code [ref=f28e3123]: "0"
                - text: disables it entirely. Proxied tools flow through
                - code [ref=f28e3124]: tools/call
                - text: and are covered automatically.
              - generic [ref=f28e3125]:
                - heading "Tracing" [level=4] [ref=f28e3126]
                - 'link "Permalink: Tracing" [ref=f28e3127] [cursor=pointer]':
                  - /url: "#tracing"
              - paragraph [ref=f28e3130]:
                - text: Distributed tracing is configured via standard
                - code [ref=f28e3131]: OTEL_*
                - text: environment variables and works independently of the
                - code [ref=f28e3132]: "--metrics"
                - text: flag. When
                - code [ref=f28e3133]: OTEL_EXPORTER_OTLP_ENDPOINT
                - text: (or the signal-specific
                - code [ref=f28e3134]: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
                - text: ") is set, the server exports traces via OTLP/gRPC:"
              - generic [ref=f28e3135]:
                - generic [ref=f28e3136]:
                  - generic [ref=f28e3137]: "# Send traces to a local Tempo instance"
                  - text: OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 \ OTEL_EXPORTER_OTLP_INSECURE=true \ ./mcp-grafana -t streamable-http
                  - generic [ref=f28e3138]: "# Send traces to Grafana Cloud with authentication"
                  - text: OTEL_EXPORTER_OTLP_ENDPOINT=https://tempo-us-central1.grafana.net:443 \ OTEL_EXPORTER_OTLP_HEADERS=
                  - generic [ref=f28e3139]: "\"Authorization=Basic ...\""
                  - text: \ ./mcp-grafana -t streamable-http
                - button "Copy code to clipboard" [ref=f28e3141] [cursor=pointer]
              - paragraph [ref=f28e3145]:
                - text: Tool call spans follow semconv naming (
                - code [ref=f28e3146]: tools/call <tool_name>
                - text: ) and include attributes like
                - code [ref=f28e3147]: gen_ai.tool.name
                - text: ","
                - code [ref=f28e3148]: mcp.method.name
                - text: ", and"
                - code [ref=f28e3149]: mcp.session.id
                - text: . The server also supports W3C trace context propagation from the
                - code [ref=f28e3150]: _meta
                - text: field of tool call requests.
              - generic [ref=f28e3151]:
                - heading "Logs" [level=4] [ref=f28e3152]
                - 'link "Permalink: Logs" [ref=f28e3153] [cursor=pointer]':
                  - /url: "#logs"
              - paragraph [ref=f28e3156]:
                - text: When
                - code [ref=f28e3157]: OTEL_EXPORTER_OTLP_ENDPOINT
                - text: (or the signal-specific
                - code [ref=f28e3158]: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
                - text: ) is set, the server also exports structured logs via OTLP/gRPC in addition to the existing plain-text stderr output. The
                - code [ref=f28e3159]: otelslog
                - text: bridge automatically attaches
                - code [ref=f28e3160]: trace_id
                - text: and
                - code [ref=f28e3161]: span_id
                - text: from the active span, so log records correlate with the traces the server already emits.
              - paragraph [ref=f28e3162]:
                - text: "Traces and logs resolve their endpoints independently, so the two signals can be enabled separately: setting only"
                - code [ref=f28e3163]: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
                - text: enables tracing
                - strong [ref=f28e3164]: without
                - text: log export, setting only
                - code [ref=f28e3165]: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
                - text: enables log export without tracing, and the generic
                - code [ref=f28e3166]: OTEL_EXPORTER_OTLP_ENDPOINT
                - text: enables both.
              - paragraph [ref=f28e3167]:
                - text: If you use the generic
                - code [ref=f28e3168]: OTEL_EXPORTER_OTLP_ENDPOINT
                - text: but want to disable log export (e.g. your backend does not support the
                - code [ref=f28e3169]: LogsService
                - text: "), set:"
              - generic [ref=f28e3170]:
                - generic [ref=f28e3171]: OTEL_LOGS_EXPORTER=none
                - button "Copy code to clipboard" [ref=f28e3173] [cursor=pointer]
              - paragraph [ref=f28e3177]:
                - text: This prevents the server from creating an OTLP logs exporter regardless of the endpoint configuration, avoiding errors like
                - code [ref=f28e3178]: unknown service opentelemetry.proto.collector.logs.v1.LogsService
                - text: .
              - paragraph [ref=f28e3179]:
                - text: Stderr logging is unchanged when OTLP logging is enabled; you can continue to rely on container logs or pipe stderr to
                - code [ref=f28e3180]: /dev/null
                - text: if you prefer.
              - generic [ref=f28e3181]:
                - generic [ref=f28e3182]:
                  - generic [ref=f28e3183]: "# Send both logs and traces to a local OTel collector"
                  - text: OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 \ OTEL_EXPORTER_OTLP_INSECURE=true \ ./mcp-grafana -t streamable-http
                - button "Copy code to clipboard" [ref=f28e3185] [cursor=pointer]
              - paragraph [ref=f28e3189]:
                - text: The transport is OTLP/gRPC (default port
                - code [ref=f28e3190]: "4317"
                - text: ). Logs can be sent directly to any managed backend that accepts OTLP/gRPC — for example, Grafana Cloud — by pointing
                - code [ref=f28e3191]: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
                - text: (or the generic
                - code [ref=f28e3192]: OTEL_EXPORTER_OTLP_ENDPOINT
                - text: ) at the remote gRPC endpoint and supplying auth via
                - code [ref=f28e3193]: OTEL_EXPORTER_OTLP_LOGS_HEADERS
                - text: (or
                - code [ref=f28e3194]: OTEL_EXPORTER_OTLP_HEADERS
                - text: ), mirroring the tracing example above. A local OTel collector is
                - strong [ref=f28e3195]: optional
                - text: — useful for fan-out, batching, or multi-backend routing, but not required.
              - paragraph [ref=f28e3196]:
                - text: The signal-specific variants
                - code [ref=f28e3197]: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
                - text: ","
                - code [ref=f28e3198]: OTEL_EXPORTER_OTLP_LOGS_HEADERS
                - text: ","
                - code [ref=f28e3199]: OTEL_EXPORTER_OTLP_LOGS_INSECURE
                - text: ","
                - code [ref=f28e3200]: OTEL_EXPORTER_OTLP_LOGS_CERTIFICATE
                - text: ","
                - code [ref=f28e3201]: OTEL_EXPORTER_OTLP_LOGS_TIMEOUT
                - text: ", and"
                - code [ref=f28e3202]: OTEL_EXPORTER_OTLP_LOGS_COMPRESSION
                - text: are honored and override their generic
                - code [ref=f28e3203]: OTEL_EXPORTER_OTLP_*
                - text: counterparts — see the
                - link "OTel exporter spec" [ref=f28e3204] [cursor=pointer]:
                  - /url: https://opentelemetry.io/docs/specs/otel/protocol/exporter/
                - text: for the full list and precedence rules.
              - paragraph [ref=f28e3205]: "If the configured collector is unreachable, log records are buffered in memory (default queue: 2048) and the oldest records are dropped once the queue fills. The process continues without blocking the service. Configure a local OTel collector if you need lossless buffering during outages."
              - paragraph [ref=f28e3206]:
                - text: Logs are also exported under the stdio transport, which makes it easy to centralize logs from local
                - code [ref=f28e3207]: mcp-grafana
                - text: instances invoked by IDE clients.
              - paragraph [ref=f28e3208]:
                - strong [ref=f28e3209]: "Docker example with metrics, tracing, and logs:"
              - generic [ref=f28e3210]:
                - generic [ref=f28e3211]: docker run --rm -p 8000:8000 \ -e GRAFANA_URL=http://localhost:3000 \ -e GRAFANA_SERVICE_ACCOUNT_TOKEN=<your token> \ -e OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317 \ -e OTEL_EXPORTER_OTLP_INSECURE=true \ grafana/mcp-grafana \ -t streamable-http --metrics
                - button "Copy code to clipboard" [ref=f28e3213] [cursor=pointer]
              - generic [ref=f28e3217]:
                - heading "Troubleshooting" [level=2] [ref=f28e3218]
                - 'link "Permalink: Troubleshooting" [ref=f28e3219] [cursor=pointer]':
                  - /url: "#troubleshooting"
              - generic [ref=f28e3222]:
                - heading "Grafana Version Compatibility" [level=3] [ref=f28e3223]
                - 'link "Permalink: Grafana Version Compatibility" [ref=f28e3224] [cursor=pointer]':
                  - /url: "#grafana-version-compatibility"
              - paragraph [ref=f28e3227]: "If you encounter the following error when using datasource-related tools:"
              - generic [ref=f28e3228]:
                - code [ref=f28e3230]: "get datasource by uid : [GET /datasources/uid/{uid}][400] getDataSourceByUidBadRequest {\"message\":\"id is invalid\"}"
                - button "Copy code to clipboard" [ref=f28e3232] [cursor=pointer]
              - paragraph [ref=f28e3236]:
                - text: This typically indicates that you are using a Grafana version earlier than 9.0. The
                - code [ref=f28e3237]: "/datasources/uid/{uid}"
                - text: API endpoint was introduced in Grafana 9.0, and datasource operations will fail on earlier versions.
              - paragraph [ref=f28e3238]:
                - strong [ref=f28e3239]: "Solution:"
                - text: Upgrade your Grafana instance to version 9.0 or later to resolve this issue.
              - generic [ref=f28e3240]:
                - heading "Development" [level=2] [ref=f28e3241]
                - 'link "Permalink: Development" [ref=f28e3242] [cursor=pointer]':
                  - /url: "#development"
              - paragraph [ref=f28e3245]:
                - text: Contributions are welcome! Please read
                - link "CONTRIBUTING.md" [ref=f28e3246] [cursor=pointer]:
                  - /url: /grafana/mcp-grafana/blob/main/CONTRIBUTING.md
                - text: first — it covers what belongs in this server and how to propose it.
              - paragraph [ref=f28e3247]:
                - text: If you're
                - strong [ref=f28e3248]: adding a new tool
                - text: ", please"
                - link "open a tool proposal" [ref=f28e3249] [cursor=pointer]:
                  - /url: https://github.com/grafana/mcp-grafana/issues/new?template=new-tool-proposal.yml
                - text: before writing the code. Every default-on tool is sent to the model on every request by every user, so we'd rather discuss the idea than decline a finished pull request. Bug fixes, docs, tests and new parameters on existing tools need no proposal — just send a PR.
              - paragraph [ref=f28e3250]: This project is written in Go. Install Go following the instructions for your platform.
              - paragraph [ref=f28e3251]: "To run the server locally in STDIO mode (which is the default for local development), use:"
              - generic [ref=f28e3252]:
                - generic [ref=f28e3253]: make run
                - button "Copy code to clipboard" [ref=f28e3255] [cursor=pointer]
              - paragraph [ref=f28e3259]: "To run the server locally in SSE mode, use:"
              - generic [ref=f28e3260]:
                - generic [ref=f28e3261]: go run ./cmd/mcp-grafana --transport sse
                - button "Copy code to clipboard" [ref=f28e3263] [cursor=pointer]
              - paragraph [ref=f28e3267]: "You can also run the server using the SSE transport inside a custom built Docker image. Just like the published Docker image, this custom image's entrypoint defaults to SSE mode. To build the image, use:"
              - generic [ref=f28e3268]:
                - code [ref=f28e3270]: make build-image
                - button "Copy code to clipboard" [ref=f28e3272] [cursor=pointer]
              - paragraph [ref=f28e3276]: "And to run the image in SSE mode (the default), use:"
              - generic [ref=f28e3277]:
                - code [ref=f28e3279]: docker run -it --rm -p 8000:8000 mcp-grafana:latest
                - button "Copy code to clipboard" [ref=f28e3281] [cursor=pointer]
              - paragraph [ref=f28e3285]: "If you need to run it in STDIO mode instead, override the transport setting:"
              - generic [ref=f28e3286]:
                - code [ref=f28e3288]: docker run -it --rm mcp-grafana:latest -t stdio
                - button "Copy code to clipboard" [ref=f28e3290] [cursor=pointer]
              - generic [ref=f28e3294]:
                - heading "Testing" [level=3] [ref=f28e3295]
                - 'link "Permalink: Testing" [ref=f28e3296] [cursor=pointer]':
                  - /url: "#testing"
              - paragraph [ref=f28e3299]: "There are three types of tests available:"
              - list [ref=f28e3300]:
                - listitem [ref=f28e3301]: "Unit Tests (no external dependencies required):"
              - generic [ref=f28e3302]:

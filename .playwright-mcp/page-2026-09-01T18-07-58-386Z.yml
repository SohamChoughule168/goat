              - generic [ref=f28e622]:
                - heading "Agent Observability" [level=3] [ref=f28e623]
                - 'link "Permalink: Agent Observability" [ref=f28e624] [cursor=pointer]':
                  - /url: "#agent-observability"
              - blockquote [ref=f28e627]:
                - paragraph [ref=f28e628]:
                  - strong [ref=f28e629]: "Note:"
                  - text: Agent Observability tools are
                  - strong [ref=f28e630]: disabled by default
                  - text: and work only in Grafana Cloud. To enable them, add
                  - code [ref=f28e631]: agento11y
                  - text: to your
                  - code [ref=f28e632]: "--enabled-tools"
                  - text: flag.
              - list [ref=f28e633]:
                - listitem [ref=f28e634]:
                  - strong [ref=f28e635]: "List and search conversations:"
                  - text: List recent LLM conversations or search them with a filter expression (model, provider, agent, status, error type, eval results, and more) over a time range. Search results include error counts, rating summaries, evaluation summaries, and trace IDs.
                - listitem [ref=f28e636]:
                  - strong [ref=f28e637]: "Get conversation detail:"
                  - text: Fetch a single conversation with all its generations, including prompts and outputs.
                - listitem [ref=f28e638]:
                  - strong [ref=f28e639]: "Get generation detail and scores:"
                  - text: Fetch a single generation by ID, and its evaluation scores (evaluator, score key, value, passed, explanation).
                - listitem [ref=f28e640]:
                  - strong [ref=f28e641]: "Read the agent catalog:"
                  - text: List the agents that send telemetry, fetch one agent version in full (complete system prompt, every tool with its JSON schema, and the models it ran on), walk an agent's version history, and compare evaluation score aggregates per version. Effective versions are
                  - code [ref=f28e642]: "sha256:"
                  - text: hashes that a tool change never affects; for an agent that reports no version of its own they hash the system prompt, so a prompt edit mints a new version. Catalog and version rows carry a
                  - code [ref=f28e643]: token_estimate
                  - text: ", which is worth checking before fetching a full prompt."
                - listitem [ref=f28e644]:
                  - strong [ref=f28e645]: "Inspect evaluators and templates:"
                  - text: Read the evaluators a score came from, the templates they were derived from, and the judge providers and models available to LLM-judge evaluators. With write tools enabled, also create, fork, test, and delete evaluators.
                - listitem [ref=f28e646]:
                  - strong [ref=f28e647]: "Inspect eval rules and guards:"
                  - text: Read the asynchronous eval rules that bind evaluators to production traffic, and the guards (hook rules) that run inline and can warn or deny. With write tools enabled, also create, update, preview, and delete them. Writes and the non-persisting
                  - code [ref=f28e648]: preview_rule
                  - text: and
                  - code [ref=f28e649]: test_evaluator
                  - text: operations need the
                  - code [ref=f28e650]: grafana-agento11y-app.eval:write
                  - text: permission, granted by the Agento11y Admin role.
                - listitem [ref=f28e651]:
                  - strong [ref=f28e652]: "Curate saved conversations and collections:"
                  - text: Read the saved conversations (bookmarks that give a conversation a stable ID, name, and tags) and the collections that group them, including each collection's member count and the collections embedded in every saved-conversation row. With write tools enabled, also bookmark a conversation, create and edit collections, and add or remove members. These writes need the same
                  - code [ref=f28e653]: grafana-agento11y-app.eval:write
                  - text: permission.
                - listitem [ref=f28e654]:
                  - strong [ref=f28e655]: "Read and edit test suites:"
                  - text: List the versioned test suites that offline experiments run against, read one with its full version history, and page through the test cases of a version. With write tools enabled, also create a suite, rename or retag it, open a draft version, publish it, and write or delete its test cases. A published version is frozen, so an edit means opening a new draft. These writes need
                  - code [ref=f28e656]: grafana-agento11y-app.eval:write
                  - text: .
                - listitem [ref=f28e657]:
                  - strong [ref=f28e658]: "Read offline experiments:"
                  - text: List the evaluation runs over a test suite and read one with its headline pass rate, cost, and token totals. Drill down through a per-test-case report to trials, their scores with each judge's explanation, and their artifact metadata. With write tools enabled, also rename or retag an experiment and cancel a running one, which need
                  - code [ref=f28e659]: grafana-agento11y-app.eval:write
                  - text: . Experiments are created by SDK runners, not by this tool.
              - generic [ref=f28e660]:
                - heading "Grafana Assistant" [level=3] [ref=f28e661]
                - 'link "Permalink: Grafana Assistant" [ref=f28e662] [cursor=pointer]':
                  - /url: "#grafana-assistant"
              - blockquote [ref=f28e665]:
                - paragraph [ref=f28e666]:
                  - strong [ref=f28e667]: "Note:"
                  - text: Assistant tools are
                  - strong [ref=f28e668]: disabled by default
                  - text: and require the
                  - link "Grafana Assistant" [ref=f28e669] [cursor=pointer]:
                    - /url: https://grafana.com/docs/grafana-cloud/machine-learning/assistant/
                  - text: plugin (
                  - code [ref=f28e670]: grafana-assistant-app
                  - text: ) to be installed on the target Grafana instance. They are also
                  - strong [ref=f28e671]: write tools
                  - text: (the assistant may mutate stack state), so they are skipped when
                  - code [ref=f28e672]: "--disable-write"
                  - text: is set. To enable them, add
                  - code [ref=f28e673]: assistant
                  - text: to your
                  - code [ref=f28e674]: "--enabled-tools"
                  - text: flag.
              - list [ref=f28e675]:
                - listitem [ref=f28e676]:
                  - strong [ref=f28e677]: "Ask the assistant:"
                  - text: Send a natural-language prompt to Grafana Assistant and wait for the full text reply. The assistant may use tools, metrics, logs, and other stack context—broader than firing one isolated data-source query. Pass the returned
                  - code [ref=f28e678]: contextId
                  - text: back in a follow-up call to continue the same conversation. Complex tasks can take several minutes; the call blocks until the reply is done or the request times out (5 minutes).

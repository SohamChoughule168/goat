              - generic [ref=f28e2097]:
                - heading "Read-Only Mode" [level=3] [ref=f28e2098]
                - 'link "Permalink: Read-Only Mode" [ref=f28e2099] [cursor=pointer]':
                  - /url: "#read-only-mode"
              - paragraph [ref=f28e2102]:
                - text: The
                - code [ref=f28e2103]: "--disable-write"
                - text: "flag provides a way to run the MCP server in read-only mode, preventing any write operations to your Grafana instance. This is useful for scenarios where you want to provide safe, read-only access such as:"
              - list [ref=f28e2104]:
                - listitem [ref=f28e2105]: Using service accounts with limited read-only permissions
                - listitem [ref=f28e2106]: Providing AI assistants with observability data without modification capabilities
                - listitem [ref=f28e2107]: Running in production environments where write access should be restricted
                - listitem [ref=f28e2108]: Testing and development scenarios where you want to prevent accidental modifications
              - paragraph [ref=f28e2109]:
                - text: When
                - code [ref=f28e2110]: "--disable-write"
                - text: "is enabled, the following write operations are disabled:"
              - paragraph [ref=f28e2111]:
                - strong [ref=f28e2112]: "Dashboard Tools:"
              - list [ref=f28e2113]:
                - listitem [ref=f28e2114]:
                  - code [ref=f28e2115]: update_dashboard
              - paragraph [ref=f28e2116]:
                - strong [ref=f28e2117]: "Folder Tools:"
              - list [ref=f28e2118]:
                - listitem [ref=f28e2119]:
                  - code [ref=f28e2120]: create_folder
              - paragraph [ref=f28e2121]:
                - strong [ref=f28e2122]: "Incident Tools:"
              - list [ref=f28e2123]:
                - listitem [ref=f28e2124]:
                  - code [ref=f28e2125]: create_incident
                - listitem [ref=f28e2126]:
                  - code [ref=f28e2127]: add_activity_to_incident
                - listitem [ref=f28e2128]:
                  - code [ref=f28e2129]: update_incident
              - paragraph [ref=f28e2130]:
                - strong [ref=f28e2131]: "Alerting Tools:"
              - list [ref=f28e2132]:
                - listitem [ref=f28e2133]:
                  - code [ref=f28e2134]: alerting_manage_rules
                  - text: (create, update, delete operations)
                - listitem [ref=f28e2135]:
                  - code [ref=f28e2136]: alerting_manage_silences
                  - text: (create, update, delete operations)
              - paragraph [ref=f28e2137]:
                - strong [ref=f28e2138]: "OnCall Tools:"
              - list [ref=f28e2139]:
                - listitem [ref=f28e2140]:
                  - code [ref=f28e2141]: update_alert_group
              - paragraph [ref=f28e2142]:
                - strong [ref=f28e2143]: "Annotation Tools:"
              - list [ref=f28e2144]:
                - listitem [ref=f28e2145]:
                  - code [ref=f28e2146]: create_annotation
                - listitem [ref=f28e2147]:
                  - code [ref=f28e2148]: update_annotation
              - paragraph [ref=f28e2149]:
                - strong [ref=f28e2150]: "Sift Tools:"
              - list [ref=f28e2151]:
                - listitem [ref=f28e2152]:
                  - code [ref=f28e2153]: find_error_pattern_logs
                  - text: (creates investigations)
                - listitem [ref=f28e2154]:
                  - code [ref=f28e2155]: find_slow_requests
                  - text: (creates investigations)
              - paragraph [ref=f28e2156]:
                - strong [ref=f28e2157]: "Snapshot Tools:"
              - list [ref=f28e2158]:
                - listitem [ref=f28e2159]:
                  - code [ref=f28e2160]: create_snapshot
                - listitem [ref=f28e2161]:
                  - code [ref=f28e2162]: delete_snapshot
              - paragraph [ref=f28e2163]:
                - strong [ref=f28e2164]: "Raw-SQL Query Tools:"
              - paragraph [ref=f28e2165]:
                - text: These execute whatever query you give them without inspecting it, so they can write when the datasource credentials permit it —
                - code [ref=f28e2166]: query_clickhouse
                - text: will run a
                - code [ref=f28e2167]: DROP TABLE
                - text: ","
                - code [ref=f28e2168]: query_influxdb
                - text: will run a
                - code [ref=f28e2169]: DELETE
                - text: . Read-only mode therefore removes them. Pass
                - code [ref=f28e2170]: "--enable-query"
                - text: to keep them when the datasource credentials are known to be read-only.
              - list [ref=f28e2171]:
                - listitem [ref=f28e2172]:
                  - code [ref=f28e2173]: query_clickhouse
                - listitem [ref=f28e2174]:
                  - code [ref=f28e2175]: query_snowflake
                - listitem [ref=f28e2176]:
                  - code [ref=f28e2177]: query_athena
                - listitem [ref=f28e2178]:
                  - code [ref=f28e2179]: query_influxdb
              - paragraph [ref=f28e2180]:
                - strong [ref=f28e2181]: "Agent Observability Tools:"
              - list [ref=f28e2182]:
                - listitem [ref=f28e2183]:
                  - code [ref=f28e2184]: agento11y_manage_evaluators
                  - text: (upsert, delete, fork, test evaluator operations)
                - listitem [ref=f28e2185]:
                  - code [ref=f28e2186]: agento11y_manage_eval_rules
                  - text: (create, update, delete, preview rule and guard operations)
                - listitem [ref=f28e2187]:
                  - code [ref=f28e2188]: agento11y_manage_eval_collections
                  - text: (save and delete saved conversations; create, update, delete collections; add and remove collection members)
                - listitem [ref=f28e2189]:
                  - code [ref=f28e2190]: agento11y_manage_experiments
                  - text: (update and cancel experiment operations)
                - listitem [ref=f28e2191]:
                  - code [ref=f28e2192]: agento11y_manage_test_suites
                  - text: (create and update test suites; create and publish versions; upsert and delete test cases)
              - paragraph [ref=f28e2193]: All read operations remain available, allowing you to query dashboards, run PromQL/LogQL queries, list resources, and retrieve data. The query languages that cannot express a write — PromQL, LogQL, TraceQL, the Elasticsearch DSL, Graphite, CloudWatch — keep their query tools in read-only mode; only the raw-SQL ones listed above are removed.
              - generic [ref=f28e2194]:
                - heading "Query-Free Mode" [level=3] [ref=f28e2195]
                - 'link "Permalink: Query-Free Mode" [ref=f28e2196] [cursor=pointer]':
                  - /url: "#query-free-mode"
              - paragraph [ref=f28e2199]:
                - text: The
                - code [ref=f28e2200]: "--disable-query"
                - text: flag removes every tool that executes a query against a datasource, while leaving the metadata and discovery tools in place. This is useful when you want an assistant that can explore what exists — datasources, dashboards, metric names, labels, table schemas — without running potentially expensive or data-revealing queries, for example when the service account has
                - code [ref=f28e2201]: datasources:read
                - text: but not
                - code [ref=f28e2202]: datasources:query
                - text: .
              - paragraph [ref=f28e2203]:
                - text: It is the strongest of the three query settings, and it wins over
                - code [ref=f28e2204]: "--enable-query"
                - text: ":"
              - table [ref=f28e2206]:
                - rowgroup [ref=f28e2207]:
                  - row [ref=f28e2208]:
                    - columnheader "Flags" [ref=f28e2209]
                    - columnheader [ref=f28e2210]:
                      - text: Safe query tools (
                      - code [ref=f28e2211]: query_prometheus
                      - text: ","
                      - code [ref=f28e2212]: query_loki_logs
                      - text: ","
                      - code [ref=f28e2213]: run_panel_query
                      - text: ", …)"
                    - columnheader [ref=f28e2214]:
                      - text: Raw-SQL query tools (
                      - code [ref=f28e2215]: query_clickhouse
                      - text: ","
                      - code [ref=f28e2216]: query_snowflake
                      - text: ","
                      - code [ref=f28e2217]: query_athena
                      - text: ","
                      - code [ref=f28e2218]: query_influxdb
                      - text: )
                - rowgroup [ref=f28e2219]:
                  - row [ref=f28e2220]:
                    - cell [ref=f28e2221]:
                      - emphasis [ref=f28e2222]: (none)
                    - cell "registered" [ref=f28e2223]
                    - cell "registered" [ref=f28e2224]
                  - row [ref=f28e2225]:
                    - cell [ref=f28e2226]:
                      - code [ref=f28e2227]: "--disable-write"
                    - cell "registered" [ref=f28e2228]
                    - cell [ref=f28e2229]:
                      - strong [ref=f28e2230]: not registered
                  - row [ref=f28e2231]:
                    - cell [ref=f28e2232]:
                      - code [ref=f28e2233]: "--disable-write --enable-query"
                    - cell "registered" [ref=f28e2234]
                    - cell "registered" [ref=f28e2235]
                  - row [ref=f28e2236]:
                    - cell [ref=f28e2237]:
                      - code [ref=f28e2238]: "--disable-query"
                    - cell "not registered" [ref=f28e2239]
                    - cell "not registered" [ref=f28e2240]
                  - row [ref=f28e2241]:
                    - cell [ref=f28e2242]:
                      - code [ref=f28e2243]: "--disable-query --enable-query"
                    - cell "not registered" [ref=f28e2244]
                    - cell "not registered" [ref=f28e2245]
              - paragraph [ref=f28e2246]:
                - text: When
                - code [ref=f28e2247]: "--disable-query"
                - text: "is enabled, the following tools are not registered:"
              - paragraph [ref=f28e2248]:
                - strong [ref=f28e2249]: "Prometheus Tools:"
              - list [ref=f28e2250]:
                - listitem [ref=f28e2251]:
                  - code [ref=f28e2252]: query_prometheus
                - listitem [ref=f28e2253]:
                  - code [ref=f28e2254]: query_prometheus_histogram
              - paragraph [ref=f28e2255]:
                - strong [ref=f28e2256]: "Loki Tools:"
              - list [ref=f28e2257]:
                - listitem [ref=f28e2258]:
                  - code [ref=f28e2259]: query_loki_logs
                - listitem [ref=f28e2260]:
                  - code [ref=f28e2261]: query_loki_patterns
              - paragraph [ref=f28e2262]:
                - code [ref=f28e2263]: query_loki_stats
                - text: and
                - code [ref=f28e2264]: analyze_loki_labels
                - text: "stay registered: both send a selector to the datasource, but they read the index and return stream, chunk, and byte counts rather than log content."
              - paragraph [ref=f28e2265]:
                - strong [ref=f28e2266]: "Elasticsearch/OpenSearch and Quickwit Tools:"
              - list [ref=f28e2267]:
                - listitem [ref=f28e2268]:
                  - code [ref=f28e2269]: query_elasticsearch
                - listitem [ref=f28e2270]:
                  - code [ref=f28e2271]: query_quickwit
              - paragraph [ref=f28e2272]:
                - strong [ref=f28e2273]: InfluxDB Tools
                - text: (also removed by
                - code [ref=f28e2274]: "--disable-write"
                - text: ", see above)"
                - strong [ref=f28e2275]: ":"
              - list [ref=f28e2276]:
                - listitem [ref=f28e2277]:
                  - code [ref=f28e2278]: query_influxdb
              - paragraph [ref=f28e2279]:
                - strong [ref=f28e2280]: SQL Datasource Tools
                - text: (also removed by
                - code [ref=f28e2281]: "--disable-write"
                - text: ", see above)"
                - strong [ref=f28e2282]: ":"
              - list [ref=f28e2283]:
                - listitem [ref=f28e2284]:
                  - code [ref=f28e2285]: query_clickhouse
                - listitem [ref=f28e2286]:
                  - code [ref=f28e2287]: query_snowflake
                - listitem [ref=f28e2288]:
                  - code [ref=f28e2289]: query_athena
              - paragraph [ref=f28e2290]:
                - strong [ref=f28e2291]: "Graphite Tools:"
              - list [ref=f28e2292]:
                - listitem [ref=f28e2293]:
                  - code [ref=f28e2294]: query_graphite
                - listitem [ref=f28e2295]:
                  - code [ref=f28e2296]: query_graphite_density
              - paragraph [ref=f28e2297]:
                - strong [ref=f28e2298]: "CloudWatch Tools:"
              - list [ref=f28e2299]:
                - listitem [ref=f28e2300]:
                  - code [ref=f28e2301]: query_cloudwatch
              - paragraph [ref=f28e2302]:
                - strong [ref=f28e2303]: "Pyroscope Tools:"
              - list [ref=f28e2304]:
                - listitem [ref=f28e2305]:
                  - code [ref=f28e2306]: query_pyroscope
              - paragraph [ref=f28e2307]:
                - strong [ref=f28e2308]: "Run Panel Query Tools:"
              - list [ref=f28e2309]:
                - listitem [ref=f28e2310]:
                  - code [ref=f28e2311]: run_panel_query
              - paragraph [ref=f28e2312]:
                - text: The
                - code [ref=f28e2313]: elasticsearch
                - text: ","
                - code [ref=f28e2314]: quickwit
                - text: ","
                - code [ref=f28e2315]: influxdb
                - text: ", and"
                - code [ref=f28e2316]: runpanelquery
                - text: categories contain nothing else, so they register no tools at all when queries are disabled. The sibling tools in every other category —
                - code [ref=f28e2317]: list_prometheus_metric_names
                - text: ","
                - code [ref=f28e2318]: list_loki_label_values
                - text: ","
                - code [ref=f28e2319]: describe_clickhouse_table
                - text: ","
                - code [ref=f28e2320]: list_cloudwatch_metrics
                - text: ", and so on — remain available."
              - paragraph [ref=f28e2321]:
                - text: Note that
                - code [ref=f28e2322]: "--disable-query"
                - text: gates the query tools and the
                - code [ref=f28e2323]: grafana_api_request
                - text: POST-to-
                - code [ref=f28e2324]: /api/ds/query
                - text: path, but does not police every route to a datasource. In read-only mode,
                - code [ref=f28e2325]: grafana_api_request
                - text: allows POST to
                - code [ref=f28e2326]: /api/ds/query
                - text: only when query tools are enabled (same gate as the raw-SQL tools — blocked by
                - code [ref=f28e2327]: "--disable-write"
                - text: unless
                - code [ref=f28e2328]: "--enable-query"
                - text: overrides).
                - code [ref=f28e2329]: get_panel_image
                - text: ", which renders a panel server-side, is unaffected."
              - paragraph [ref=f28e2330]:
                - strong [ref=f28e2331]: "Client TLS Configuration (for Grafana connections):"
              - list [ref=f28e2332]:
                - listitem [ref=f28e2333]:
                  - code [ref=f28e2334]: "--tls-cert-file"
                  - text: ": Path to TLS certificate file for client authentication"
                - listitem [ref=f28e2335]:
                  - code [ref=f28e2336]: "--tls-key-file"
                  - text: ": Path to TLS private key file for client authentication"
                - listitem [ref=f28e2337]:
                  - code [ref=f28e2338]: "--tls-ca-file"
                  - text: ": Path to TLS CA certificate file for server verification"
                - listitem [ref=f28e2339]:
                  - code [ref=f28e2340]: "--tls-skip-verify"
                  - text: ": Skip TLS certificate verification (insecure)"
              - paragraph [ref=f28e2341]:
                - strong [ref=f28e2342]: "Server TLS Configuration (streamable-http transport only):"
              - list [ref=f28e2343]:
                - listitem [ref=f28e2344]:
                  - code [ref=f28e2345]: "--server.tls-cert-file"
                  - text: ": Path to TLS certificate file for server HTTPS"
                - listitem [ref=f28e2346]:
                  - code [ref=f28e2347]: "--server.tls-key-file"
                  - text: ": Path to TLS private key file for server HTTPS"
              - generic [ref=f28e2348]:
                - heading "Usage" [level=2] [ref=f28e2349]
                - 'link "Permalink: Usage" [ref=f28e2350] [cursor=pointer]':
                  - /url: "#usage"
              - paragraph [ref=f28e2353]:
                - text: This MCP server works with both local Grafana instances and Grafana Cloud. For Grafana Cloud, use your instance URL (e.g.,
                - code [ref=f28e2354]: https://myinstance.grafana.net
                - text: ) instead of
                - code [ref=f28e2355]: http://localhost:3000
                - text: in the configuration examples below.
              - list [ref=f28e2356]:
                - listitem [ref=f28e2357]:
                  - paragraph [ref=f28e2358]:
                    - text: If using service account token authentication, create a service account in Grafana with enough permissions to use the tools you want to use, generate a service account token, and copy it to the clipboard for use in the configuration file. Follow the
                    - link "Grafana service account documentation" [ref=f28e2359] [cursor=pointer]:
                      - /url: https://grafana.com/docs/grafana/latest/administration/service-accounts/#add-a-token-to-a-service-account-in-grafana
                    - text: "for details on creating service account tokens. Tip: If you're not comfortable configuring fine-grained RBAC scopes, a simpler (but less restrictive) option is to assign the built-in"
                    - code [ref=f28e2360]: Editor
                    - text: role to the service account. This grants broad read/write access that covers most MCP server operations — use it when convenience outweighs strict least-privilege requirements.
                  - blockquote [ref=f28e2361]:
                    - paragraph [ref=f28e2362]:
                      - strong [ref=f28e2363]: "Note:"
                      - text: The environment variable
                      - code [ref=f28e2364]: GRAFANA_API_KEY
                      - text: is deprecated and will be removed in a future version. Please migrate to using
                      - code [ref=f28e2365]: GRAFANA_SERVICE_ACCOUNT_TOKEN
                      - text: instead. The old variable name will continue to work for backward compatibility but will show deprecation warnings.
              - generic [ref=f28e2366]:
                - heading "Reading the service account token from a file" [level=4] [ref=f28e2367]
                - 'link "Permalink: Reading the service account token from a file" [ref=f28e2368] [cursor=pointer]':
                  - /url: "#reading-the-service-account-token-from-a-file"
              - paragraph [ref=f28e2371]:
                - text: Instead of passing the token inline via
                - code [ref=f28e2372]: GRAFANA_SERVICE_ACCOUNT_TOKEN
                - text: ", you can point"
                - code [ref=f28e2373]: GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE
                - text: at a file path that contains the token. The file is read fresh on every request, so rotated tokens are picked up automatically without restarting the server.
              - paragraph [ref=f28e2374]: "This is particularly useful in Kubernetes, where a Secret mounted as a volume is updated in place when the underlying Secret changes (typically within ~1 minute). Combined with the per-request client cache — which is keyed on the token value — a rotated token transparently produces a new client with no pod restart and no downtime:"
              - generic [ref=f28e2375]:
                - generic [ref=f28e2376]: "env: - name: GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE value: /var/run/secrets/grafana/token volumeMounts: - name: grafana-token mountPath: /var/run/secrets/grafana readOnly: true volumes: - name: grafana-token secret: secretName: grafana-mcp-token"
                - button "Copy code to clipboard" [ref=f28e2378] [cursor=pointer]
              - paragraph [ref=f28e2382]:
                - text: Surrounding whitespace (including a trailing newline) is trimmed from the file contents. If both
                - code [ref=f28e2383]: GRAFANA_SERVICE_ACCOUNT_TOKEN
                - text: and
                - code [ref=f28e2384]: GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE
                - text: are set, the inline token takes precedence.
              - generic [ref=f28e2385]:
                - heading "Multi-Organization Support" [level=3] [ref=f28e2386]
                - 'link "Permalink: Multi-Organization Support" [ref=f28e2387] [cursor=pointer]':
                  - /url: "#multi-organization-support"
              - paragraph [ref=f28e2390]: "You can specify which organization to interact with using either:"
              - list [ref=f28e2391]:
                - listitem [ref=f28e2392]:
                  - strong [ref=f28e2393]: "Environment variable:"
                  - text: Set
                  - code [ref=f28e2394]: GRAFANA_ORG_ID
                  - text: to the numeric organization ID
                - listitem [ref=f28e2395]:
                  - strong [ref=f28e2396]: "HTTP header:"
                  - text: Set
                  - code [ref=f28e2397]: X-Grafana-Org-Id
                  - text: when using SSE or streamable HTTP transports (header takes precedence over environment variable - meaning you can set a default org as well).
              - paragraph [ref=f28e2398]:
                - text: When an organization ID is provided, the MCP server will set the
                - code [ref=f28e2399]: X-Grafana-Org-Id
                - text: header on all requests to Grafana, ensuring that operations are performed within the specified organization context.
              - generic [ref=f28e2400]:
                - heading "Dynamic (per-call) organization selection" [level=4] [ref=f28e2401]
                - 'link "Permalink: Dynamic (per-call) organization selection" [ref=f28e2402] [cursor=pointer]':
                  - /url: "#dynamic-per-call-organization-selection"
              - paragraph [ref=f28e2405]:
                - text: The options above fix the organization for the whole connection. To let a single connection target different organizations per tool call, start the server with the
                - code [ref=f28e2406]: "--dynamic-multi-org"
                - text: flag. This is off by default.
              - paragraph [ref=f28e2407]:
                - text: When enabled, every tool accepts an optional
                - code [ref=f28e2408]: orgId
                - text: argument that overrides the connection's organization for that call (driving both the
                - code [ref=f28e2409]: X-Grafana-Org-Id
                - text: header and, for app-platform APIs, the resolved Kubernetes namespace). Proxied datasource tools are additionally discovered across every organization the credential can access. Calls that omit
                - code [ref=f28e2410]: orgId
                - text: use the connection's default organization.
              - paragraph [ref=f28e2411]:
                - text: This only works for credentials that belong to more than one organization (e.g. a user or on-behalf-of identity); a service-account token remains bound to its single organization. Use the
                - link [ref=f28e2412] [cursor=pointer]:
                  - /url: "#user"
                  - code [ref=f28e2413]: user_info
                - text: tool to discover which
                - code [ref=f28e2414]: orgId
                - text: values are valid.
              - paragraph [ref=f28e2415]:
                - strong [ref=f28e2416]: "Example with organization ID:"
              - generic [ref=f28e2417]:
                - generic [ref=f28e2418]:
                  - text: "{ \"mcpServers\": { \"grafana\": { \"command\":"
                  - generic [ref=f28e2419]: "\"mcp-grafana\""
                  - text: ", \"args\": [], \"env\": { \"GRAFANA_URL\":"
                  - generic [ref=f28e2420]: "\"http://localhost:3000\""
                  - text: ", \"GRAFANA_USERNAME\":"
                  - generic [ref=f28e2421]: "\"<your username>\""
                  - text: ", \"GRAFANA_PASSWORD\":"
                  - generic [ref=f28e2422]: "\"<your password>\""
                  - text: ", \"GRAFANA_ORG_ID\":"
                  - generic [ref=f28e2423]: "\"2\""
                  - text: "} } } }"
                - button "Copy code to clipboard" [ref=f28e2425] [cursor=pointer]
              - generic [ref=f28e2429]:
                - heading "Custom HTTP Headers" [level=3] [ref=f28e2430]
                - 'link "Permalink: Custom HTTP Headers" [ref=f28e2431] [cursor=pointer]':
                  - /url: "#custom-http-headers"
              - paragraph [ref=f28e2434]:
                - text: You can add arbitrary HTTP headers to all Grafana API requests using the
                - code [ref=f28e2435]: GRAFANA_EXTRA_HEADERS
                - text: environment variable. The value should be a JSON object mapping header names to values.
              - paragraph [ref=f28e2436]:
                - strong [ref=f28e2437]: "Example with custom headers:"
              - generic [ref=f28e2438]:
                - generic [ref=f28e2439]:
                  - text: "{ \"mcpServers\": { \"grafana\": { \"command\":"
                  - generic [ref=f28e2440]: "\"mcp-grafana\""
                  - text: ", \"args\": [], \"env\": { \"GRAFANA_URL\":"
                  - generic [ref=f28e2441]: "\"http://localhost:3000\""
                  - text: ", \"GRAFANA_SERVICE_ACCOUNT_TOKEN\":"
                  - generic [ref=f28e2442]: "\"<your token>\""
                  - text: ", \"GRAFANA_EXTRA_HEADERS\":"
                  - generic [ref=f28e2443]: "\"{\\\"X-Custom-Header\\\": \\\"custom-value\\\", \\\"X-Tenant-ID\\\": \\\"tenant-123\\\"}\""
                  - text: "} } } }"
                - button "Copy code to clipboard" [ref=f28e2445] [cursor=pointer]
              - generic [ref=f28e2449]:
                - heading "SOCKS5 Proxy" [level=3] [ref=f28e2450]
                - 'link "Permalink: SOCKS5 Proxy" [ref=f28e2451] [cursor=pointer]':
                  - /url: "#socks5-proxy"
              - paragraph [ref=f28e2454]:
                - text: You can route all requests this server makes to Grafana through a SOCKS5 proxy using the
                - code [ref=f28e2455]: GRAFANA_SOCKS5_PROXY
                - text: "environment variable. The proxy is scoped to this server's Grafana traffic: it does not modify the global"
                - code [ref=f28e2456]: HTTP_PROXY
                - text: /
                - code [ref=f28e2457]: HTTPS_PROXY
                - text: variables, and when set it overrides their proxy selection for Grafana transports only, without affecting other MCP servers or your shell session. When unset, behavior is unchanged.
              - paragraph [ref=f28e2458]:
                - text: The URL must use the
                - code [ref=f28e2459]: socks5://
                - text: or
                - code [ref=f28e2460]: socks5h://
                - text: "scheme (Go treats them identically: hostname resolution is delegated to the proxy) and may include credentials, e.g."
                - code [ref=f28e2461]: socks5://user:pass@127.0.0.1:1080
                - text: .
              - paragraph [ref=f28e2462]:
                - strong [ref=f28e2463]: "Example:"
              - generic [ref=f28e2464]:
                - generic [ref=f28e2465]:
                  - text: "{ \"mcpServers\": { \"grafana\": { \"command\":"
                  - generic [ref=f28e2466]: "\"mcp-grafana\""
                  - text: ", \"args\": [], \"env\": { \"GRAFANA_URL\":"
                  - generic [ref=f28e2467]: "\"http://localhost:3000\""
                  - text: ", \"GRAFANA_SERVICE_ACCOUNT_TOKEN\":"
                  - generic [ref=f28e2468]: "\"<your token>\""
                  - text: ", \"GRAFANA_SOCKS5_PROXY\":"
                  - generic [ref=f28e2469]: "\"socks5://127.0.0.1:1080\""
                  - text: "} } } }"
                - button "Copy code to clipboard" [ref=f28e2471] [cursor=pointer]
              - paragraph [ref=f28e2475]: An invalid proxy URL is a startup error, and if building a proxied connection fails at runtime the server fails closed rather than silently sending Grafana traffic directly.
              - generic [ref=f28e2476]:
                - heading "Forwarding Headers from the Client (SSE/Streamable-HTTP Only)" [level=3] [ref=f28e2477]
                - 'link "Permalink: Forwarding Headers from the Client (SSE/Streamable-HTTP Only)" [ref=f28e2478] [cursor=pointer]':
                  - /url: "#forwarding-headers-from-the-client-ssestreamable-http-only"
              - paragraph [ref=f28e2481]:
                - text: When the MCP server runs behind a gateway or reverse proxy that handles SSO (e.g. an AWS ALB with OIDC), each user's session cookie must reach Grafana so it can associate the request with the authenticated user. The
                - code [ref=f28e2482]: GRAFANA_FORWARD_HEADERS
                - text: environment variable enables this by specifying a comma-separated allowlist of header names to copy from the
                - strong [ref=f28e2483]: incoming
                - text: HTTP request to every outbound Grafana API request.
              - paragraph [ref=f28e2484]:
                - text: This only applies when using SSE (
                - code [ref=f28e2485]: "-t sse"
                - text: ) or streamable-http (
                - code [ref=f28e2486]: "-t streamable-http"
                - text: ) transports. It has no effect in stdio mode.
              - paragraph [ref=f28e2487]:
                - strong [ref=f28e2488]: "Example: forward the session cookie"
              - generic [ref=f28e2489]:
                - generic [ref=f28e2490]:
                  - text: "{ \"env\": { \"GRAFANA_URL\":"
                  - generic [ref=f28e2491]: "\"https://grafana.internal\""
                  - text: ", \"GRAFANA_SERVICE_ACCOUNT_TOKEN\":"
                  - generic [ref=f28e2492]: "\"<your token>\""
                  - text: ", \"GRAFANA_FORWARD_HEADERS\":"
                  - generic [ref=f28e2493]: "\"Cookie\""
                  - text: "} }"
                - button "Copy code to clipboard" [ref=f28e2495] [cursor=pointer]
              - paragraph [ref=f28e2499]: "You can forward multiple headers by separating them with commas:"
              - generic [ref=f28e2500]:
                - code [ref=f28e2502]: GRAFANA_FORWARD_HEADERS=Cookie,X-Session-Id
                - button "Copy code to clipboard" [ref=f28e2504] [cursor=pointer]
              - paragraph [ref=f28e2508]:
                - text: Forwarded headers are merged with any headers defined in
                - code [ref=f28e2509]: GRAFANA_EXTRA_HEADERS
                - text: . If a header name appears in both, the value from the incoming request takes precedence for that request.
              - paragraph [ref=f28e2510]:
                - text: Trace context headers (
                - code [ref=f28e2511]: traceparent
                - text: ","
                - code [ref=f28e2512]: tracestate
                - text: ","
                - code [ref=f28e2513]: baggage
                - text: ") are the exception: the server propagates trace context itself, so a forwarded value never overrides the one it injects. See"
                - link "observability" [ref=f28e2514] [cursor=pointer]:
                  - /url: /grafana/mcp-grafana/blob/main/docs/sources/developer/observability-metrics-and-tracing.md#trace-context-propagation
                - text: .
              - list [ref=f28e2515]:
                - listitem [ref=f28e2516]:
                  - paragraph [ref=f28e2517]:
                    - text: You have several options to install
                    - code [ref=f28e2518]: mcp-grafana
                    - text: ":"
                  - list [ref=f28e2519]:
                    - listitem [ref=f28e2520]:
                      - paragraph [ref=f28e2521]:
                        - strong [ref=f28e2522]: uvx (recommended)
                        - text: ": If you have"
                        - link "uv" [ref=f28e2523] [cursor=pointer]:
                          - /url: https://docs.astral.sh/uv/getting-started/installation/
                        - text: installed, no extra setup is needed —
                        - code [ref=f28e2524]: uvx
                        - text: "will automatically download and run the server:"
                      - generic [ref=f28e2525]:
                        - generic [ref=f28e2526]: uvx mcp-grafana
                        - button "Copy code to clipboard" [ref=f28e2528] [cursor=pointer]
                    - listitem [ref=f28e2532]:
                      - paragraph [ref=f28e2533]:
                        - strong [ref=f28e2534]: Docker image
                        - text: ": Use the pre-built Docker image from Docker Hub."
                      - paragraph [ref=f28e2535]:
                        - strong [ref=f28e2536]: Important
                        - text: ": The Docker image's entrypoint is configured to run the MCP server in SSE mode by default, but most users will want to use STDIO mode for direct integration with AI assistants like Claude Desktop:"
                      - list [ref=f28e2537]:
                        - listitem [ref=f28e2538]:
                          - strong [ref=f28e2539]: STDIO Mode
                          - text: ": For stdio mode you must explicitly override the default with"
                          - code [ref=f28e2540]: "-t stdio"
                          - text: and include the
                          - code [ref=f28e2541]: "-i"
                          - text: "flag to keep stdin open:"
                      - generic [ref=f28e2542]:
                        - generic [ref=f28e2543]:
                          - text: docker pull grafana/mcp-grafana
                          - generic [ref=f28e2544]: "# For local Grafana:"
                          - text: docker run --rm -i -e GRAFANA_URL=http://localhost:3000 -e GRAFANA_SERVICE_ACCOUNT_TOKEN=<your service account token> grafana/mcp-grafana -t stdio
                          - generic [ref=f28e2545]: "# For Grafana Cloud:"
                          - text: docker run --rm -i -e GRAFANA_URL=https://myinstance.grafana.net -e GRAFANA_SERVICE_ACCOUNT_TOKEN=<your service account token> grafana/mcp-grafana -t stdio
                        - button "Copy code to clipboard" [ref=f28e2547] [cursor=pointer]
                      - blockquote [ref=f28e2551]:
                        - paragraph [ref=f28e2552]:
                          - strong [ref=f28e2553]: "Note — secure the networked modes:"
                          - text: In SSE and streamable-http modes the container binds a non-loopback address (
                          - code [ref=f28e2554]: 0.0.0.0:8000
                          - text: ). Without a caller token the server
                          - strong [ref=f28e2555]: starts but logs a security error
                          - text: (at the
                          - code [ref=f28e2556]: error
                          - text: log level, so it isn't hidden by
                          - code [ref=f28e2557]: "--log-level"
                          - text: ; and it will refuse to start in a future major release). Set
                          - code [ref=f28e2558]: MCP_GRAFANA_SERVER_TOKEN
                          - text: to require an
                          - code [ref=f28e2559]: "Authorization: Bearer <token>"
                          - text: from clients (recommended). STDIO mode is unaffected. See
                          - link "Caller Authentication" [ref=f28e2560] [cursor=pointer]:
                            - /url: "#cli-flags-reference"
                          - text: .
                      - list [ref=f28e2561]:
                        - listitem [ref=f28e2562]:
                          - strong [ref=f28e2563]: SSE Mode
                          - text: ": In this mode, the server runs as an HTTP server that clients connect to. You must expose port 8000 using the"
                          - code [ref=f28e2564]: "-p"
                          - text: "flag:"
                      - generic [ref=f28e2565]:
                        - generic [ref=f28e2566]: docker pull grafana/mcp-grafana docker run --rm -p 8000:8000 -e GRAFANA_URL=http://localhost:3000 -e GRAFANA_SERVICE_ACCOUNT_TOKEN=<your service account token> -e MCP_GRAFANA_SERVER_TOKEN=<caller auth token> grafana/mcp-grafana
                        - button "Copy code to clipboard" [ref=f28e2568] [cursor=pointer]
                      - list [ref=f28e2572]:
                        - listitem [ref=f28e2573]:
                          - strong [ref=f28e2574]: Streamable HTTP Mode
                          - text: ": In this mode, the server operates as an independent process that can handle multiple client connections. You must expose port 8000 using the"
                          - code [ref=f28e2575]: "-p"
                          - text: "flag: For this mode you must explicitly override the default with"
                          - code [ref=f28e2576]: "-t streamable-http"
                      - generic [ref=f28e2577]:
                        - generic [ref=f28e2578]: docker pull grafana/mcp-grafana docker run --rm -p 8000:8000 -e GRAFANA_URL=http://localhost:3000 -e GRAFANA_SERVICE_ACCOUNT_TOKEN=<your service account token> -e MCP_GRAFANA_SERVER_TOKEN=<caller auth token> grafana/mcp-grafana -t streamable-http
                        - button "Copy code to clipboard" [ref=f28e2580] [cursor=pointer]
                      - paragraph [ref=f28e2584]: "For HTTPS streamable HTTP mode with server TLS certificates:"
                      - generic [ref=f28e2585]:
                        - generic [ref=f28e2586]: docker pull grafana/mcp-grafana docker run --rm -p 8443:8443 \ -v /path/to/certs:/certs:ro \ -e GRAFANA_URL=http://localhost:3000 \ -e GRAFANA_SERVICE_ACCOUNT_TOKEN=<your service account token> \ -e MCP_GRAFANA_SERVER_TOKEN=<caller auth token> \ grafana/mcp-grafana \ -t streamable-http \ -addr :8443 \ --server.tls-cert-file /certs/server.crt \ --server.tls-key-file /certs/server.key
                        - button "Copy code to clipboard" [ref=f28e2588] [cursor=pointer]
                    - listitem [ref=f28e2592]:
                      - paragraph [ref=f28e2593]:
                        - strong [ref=f28e2594]: Download binary
                        - text: ": Download the latest release of"
                        - code [ref=f28e2595]: mcp-grafana
                        - text: from the
                        - link "releases page" [ref=f28e2596] [cursor=pointer]:
                          - /url: https://github.com/grafana/mcp-grafana/releases
                        - text: and place it in your
                        - code [ref=f28e2597]: $PATH
                        - text: .
                    - listitem [ref=f28e2598]:
                      - paragraph [ref=f28e2599]:
                        - strong [ref=f28e2600]: Build from source
                        - text: ": If you have a Go toolchain installed you can also build and install it from source, using the"
                        - code [ref=f28e2601]: GOBIN
                        - text: environment variable to specify the directory where the binary should be installed. This should also be in your
                        - code [ref=f28e2602]: $PATH
                        - text: .
                      - generic [ref=f28e2603]:
                        - generic [ref=f28e2604]:
                          - text: GOBIN=
                          - generic [ref=f28e2605]: "\"$HOME/go/bin\""
                          - text: go install github.com/grafana/mcp-grafana/cmd/mcp-grafana@latest
                        - button "Copy code to clipboard" [ref=f28e2607] [cursor=pointer]
                    - listitem [ref=f28e2611]:
                      - paragraph [ref=f28e2612]:
                        - strong [ref=f28e2613]: Deploy to Kubernetes using Helm
                        - text: ": use the"
                        - link "Helm chart from the Grafana helm-charts repository" [ref=f28e2614] [cursor=pointer]:
                          - /url: https://github.com/grafana/helm-charts/tree/main/charts/grafana-mcp
                      - generic [ref=f28e2615]:
                        - generic [ref=f28e2616]: helm repo add grafana https://grafana.github.io/helm-charts helm install --set grafana.apiKey=<Grafana_ApiKey> --set grafana.url=<GrafanaUrl> my-release grafana/grafana-mcp
                        - button "Copy code to clipboard" [ref=f28e2618] [cursor=pointer]
                - listitem [ref=f28e2622]:

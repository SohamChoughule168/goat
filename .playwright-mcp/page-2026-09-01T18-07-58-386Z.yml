                  - img "MCP Catalog" [ref=f28e322]
              - paragraph [ref=f28e323]:
                - text: A
                - link "Model Context Protocol" [ref=f28e324] [cursor=pointer]:
                  - /url: https://modelcontextprotocol.io/
                - text: (MCP) server for Grafana.
              - paragraph [ref=f28e325]: This provides access to your Grafana instance and the surrounding ecosystem.
              - generic [ref=f28e326]:
                - heading "Quick Start" [level=2] [ref=f28e327]
                - 'link "Permalink: Quick Start" [ref=f28e328] [cursor=pointer]':
                  - /url: "#quick-start"
              - paragraph [ref=f28e331]:
                - text: Requires
                - link "uv" [ref=f28e332] [cursor=pointer]:
                  - /url: https://docs.astral.sh/uv/getting-started/installation/
                - text: ". Add the following to your MCP client configuration (e.g. Claude Desktop, Cursor):"
              - generic [ref=f28e333]:
                - generic [ref=f28e334]:
                  - text: "{ \"mcpServers\": { \"grafana\": { \"command\":"
                  - generic [ref=f28e335]: "\"uvx\""
                  - text: ", \"args\": ["
                  - generic [ref=f28e336]: "\"mcp-grafana\""
                  - text: "], \"env\": { \"GRAFANA_URL\":"
                  - generic [ref=f28e337]: "\"http://localhost:3000\""
                  - text: ", \"GRAFANA_SERVICE_ACCOUNT_TOKEN\":"
                  - generic [ref=f28e338]: "\"<your service account token>\""
                  - text: "} } } }"
                - button "Copy code to clipboard" [ref=f28e340] [cursor=pointer]
              - paragraph [ref=f28e344]:
                - text: For Grafana Cloud, replace
                - code [ref=f28e345]: GRAFANA_URL
                - text: with your instance URL (e.g.
                - code [ref=f28e346]: https://myinstance.grafana.net
                - text: ). See
                - link "Usage" [ref=f28e347] [cursor=pointer]:
                  - /url: "#usage"
                - text: for more installation options including Docker, binary, and Helm.
              - generic [ref=f28e348]:
                - heading "Requirements" [level=2] [ref=f28e349]
                - 'link "Permalink: Requirements" [ref=f28e350] [cursor=pointer]':
                  - /url: "#requirements"
              - list [ref=f28e353]:
                - listitem [ref=f28e354]:
                  - strong [ref=f28e355]: Grafana version 9.0 or later
                  - text: is required for full functionality. Some features, particularly datasource-related operations, may not work correctly with earlier versions due to missing API endpoints.
              - generic [ref=f28e356]:
                - heading "Features" [level=2] [ref=f28e357]
                - 'link "Permalink: Features" [ref=f28e358] [cursor=pointer]':
                  - /url: "#features"
              - paragraph [ref=f28e361]:
                - emphasis [ref=f28e362]: The following features are currently available in MCP server. This list is for informational purposes only and does not represent a roadmap or commitment to future features.
              - generic [ref=f28e363]:
                - heading "Dashboards" [level=3] [ref=f28e364]
                - 'link "Permalink: Dashboards" [ref=f28e365] [cursor=pointer]':
                  - /url: "#dashboards"
              - list [ref=f28e368]:
                - listitem [ref=f28e369]:
                  - strong [ref=f28e370]: "Search for dashboards:"
                  - text: Find dashboards by title or other metadata
                - listitem [ref=f28e371]:
                  - strong [ref=f28e372]: "Get dashboard by UID:"
                  - text: Retrieve full dashboard details using its unique identifier.
                  - emphasis [ref=f28e373]: "Warning: Large dashboards can consume significant context window space."
                - listitem [ref=f28e374]:
                  - strong [ref=f28e375]: "Get dashboard summary:"
                  - text: Get a compact overview of a dashboard including title, panel count, panel types, variables, and metadata without the full JSON to minimize context window usage
                - listitem [ref=f28e376]:
                  - strong [ref=f28e377]: "Get dashboard property:"
                  - text: Extract specific parts of a dashboard using JSONPath expressions (e.g.,
                  - code [ref=f28e378]: $.title
                  - text: ","
                  - code [ref=f28e379]: $.panels[*].title
                  - text: ) to fetch only needed data and reduce context window consumption
                - listitem [ref=f28e380]:
                  - strong [ref=f28e381]: "Update or create a dashboard:"
                  - text: Modify existing dashboards or create new ones.
                  - emphasis [ref=f28e382]: "Warning: Requires full dashboard JSON which can consume large amounts of context window space."
                - listitem [ref=f28e383]:
                  - strong [ref=f28e384]: "Patch dashboard:"
                  - text: Apply specific changes to a dashboard without requiring the full JSON, significantly reducing context window usage for targeted modifications
                - listitem [ref=f28e385]:
                  - strong [ref=f28e386]: "Get panel queries and datasource info:"
                  - text: Get the title, query string, and datasource information (including UID and type, if available) from every panel in a dashboard
              - generic [ref=f28e387]:
                - heading "Run Panel Query" [level=3] [ref=f28e388]
                - 'link "Permalink: Run Panel Query" [ref=f28e389] [cursor=pointer]':
                  - /url: "#run-panel-query"
              - blockquote [ref=f28e392]:
                - paragraph [ref=f28e393]:

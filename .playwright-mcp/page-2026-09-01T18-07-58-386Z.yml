                  - text: . To enable them, add
                  - code [ref=f28e396]: runpanelquery
                  - text: to your
                  - code [ref=f28e397]: "--enabled-tools"
                  - text: flag.
              - list [ref=f28e398]:
                - listitem [ref=f28e399]:
                  - strong [ref=f28e400]: "Run panel query:"
                  - text: Execute a dashboard panel's query with custom time ranges and variable overrides.

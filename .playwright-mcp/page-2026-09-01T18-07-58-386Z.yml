              - generic [ref=f28e1853]:
                - heading "CLI Flags Reference" [level=2] [ref=f28e1854]
                - 'link "Permalink: CLI Flags Reference" [ref=f28e1855] [cursor=pointer]':
                  - /url: "#cli-flags-reference"
              - paragraph [ref=f28e1858]:
                - text: The
                - code [ref=f28e1859]: mcp-grafana
                - text: "binary supports various command-line flags for configuration:"
              - paragraph [ref=f28e1860]:
                - strong [ref=f28e1861]: "Transport Options:"
              - list [ref=f28e1862]:
                - listitem [ref=f28e1863]:
                  - code [ref=f28e1864]: "-t, --transport"
                  - text: ": Transport type ("
                  - code [ref=f28e1865]: stdio
                  - text: ","
                  - code [ref=f28e1866]: sse
                  - text: ", or"
                  - code [ref=f28e1867]: streamable-http
                  - text: ") - default:"
                  - code [ref=f28e1868]: stdio
                - listitem [ref=f28e1869]:
                  - code [ref=f28e1870]: "--address"
                  - text: ": The host and port for SSE/streamable-http server - default:"
                  - code [ref=f28e1871]: localhost:8000
                - listitem [ref=f28e1872]:
                  - code [ref=f28e1873]: "--base-path"
                  - text: ": Base path for the SSE/streamable-http server"
                - listitem [ref=f28e1874]:
                  - code [ref=f28e1875]: "--endpoint-path"
                  - text: ": Endpoint path for the streamable-http server - default:"
                  - code [ref=f28e1876]: /mcp
                - listitem [ref=f28e1877]:
                  - code [ref=f28e1878]: "--server-name"
                  - text: ": Server name used in the MCP handshake and OTel"
                  - code [ref=f28e1879]: service.name
                  - text: "- default:"
                  - code [ref=f28e1880]: mcp-grafana
                  - text: . Overrides
                  - code [ref=f28e1881]: GRAFANA_MCP_SERVER_NAME
                  - text: env var
              - paragraph [ref=f28e1882]:
                - strong [ref=f28e1883]: "HTTP Transport Security (SSE / streamable-http only):"
              - paragraph [ref=f28e1884]:
                - code [ref=f28e1885]: Host
                - text: /
                - code [ref=f28e1886]: Origin
                - text: validation is enforced on
                - emphasis [ref=f28e1887]: every
                - text: route on the listener —
                - code [ref=f28e1888]: /sse
                - text: ","
                - code [ref=f28e1889]: /mcp
                - text: ","
                - code [ref=f28e1890]: /healthz
                - text: ", and"
                - code [ref=f28e1891]: /metrics
                - text: — so a DNS-rebinding browser cannot reach any of them. Stdio transport is unaffected.
              - list [ref=f28e1892]:
                - listitem [ref=f28e1893]:
                  - code [ref=f28e1894]: "--allowed-hosts"
                  - text: ": Comma-separated allowlist of"
                  - code [ref=f28e1895]: Host
                  - text: header values. Defaults to loopback variants of
                  - code [ref=f28e1896]: "--address"
                  - text: (e.g.
                  - code [ref=f28e1897]: localhost:8000,127.0.0.1:8000,[::1]:8000
                  - text: ). A value that parses to empty (unset,
                  - code [ref=f28e1898]: ","
                  - text: ","
                  - code [ref=f28e1899]: ","
                  - text: ", etc.) also falls back to the defaults so a typo cannot silently disable the check. Requests with a"
                  - code [ref=f28e1900]: Host
                  - text: header outside the allowlist are rejected with
                  - code [ref=f28e1901]: "403"
                  - text: . Pass
                  - code [ref=f28e1902]: "*"
                  - text: to disable the check — only safe when running behind a trusted reverse proxy that rewrites
                  - code [ref=f28e1903]: Host
                  - text: ", or in an isolated network. K8s"
                  - code [ref=f28e1904]: httpGet
                  - text: probes and external
                  - code [ref=f28e1905]: /metrics
                  - text: scrapes will need either an explicit hostname in this list,
                  - code [ref=f28e1906]: "*"
                  - text: ", or a"
                  - code [ref=f28e1907]: tcpSocket
                  - text: probe / a separate metrics port (
                  - code [ref=f28e1908]: "--metrics-address"
                  - text: ).
                - listitem [ref=f28e1909]:
                  - code [ref=f28e1910]: "--allowed-origins"
                  - text: ": Comma-separated allowlist of"
                  - code [ref=f28e1911]: Origin
                  - text: header values. Empty by default — any request that carries an
                  - code [ref=f28e1912]: Origin
                  - text: header is rejected (browsers always send one for cross-origin requests, and no browser should be calling this server directly). Set to an explicit list to permit browser-based clients, or
                  - code [ref=f28e1913]: "*"
                  - text: to disable the check.
              - paragraph [ref=f28e1914]:
                - strong [ref=f28e1915]: "Caller Authentication (SSE / streamable-http only):"
              - paragraph [ref=f28e1916]:
                - text: Optionally require MCP clients to authenticate
                - emphasis [ref=f28e1917]: to the server
                - text: . This is separate from the credentials the server uses to reach Grafana. Stdio is unaffected.
              - list [ref=f28e1918]:
                - listitem [ref=f28e1919]:
                  - code [ref=f28e1920]: "--server-auth-token"
                  - text: ": Bearer token callers must send as"
                  - code [ref=f28e1921]: "Authorization: Bearer <token>"
                  - text: . Falls back to the
                  - code [ref=f28e1922]: MCP_GRAFANA_SERVER_TOKEN
                  - text: environment variable. When set, requests without a valid token are rejected with
                  - code [ref=f28e1923]: "401"
                  - text: before any tool runs. Prefer the env var so the secret isn't visible in the process arguments.
              - paragraph [ref=f28e1924]:
                - text: Caller authentication is enforced only when
                - code [ref=f28e1925]: "--server-auth-token"
                - text: is set. When it isn't and the server binds a non-loopback address, the server
                - strong [ref=f28e1926]: starts but logs a security error
                - text: — emitted at the
                - code [ref=f28e1927]: error
                - text: log level so it isn't hidden by
                - code [ref=f28e1928]: "--log-level"
                - text: (loopback and stdio are unaffected); a future major release will make that a startup error. Use TLS (or TLS termination) whenever caller auth is enabled on a non-loopback address. When caller auth is enabled, the validated
                - code [ref=f28e1929]: Authorization
                - text: header is stripped before requests reach Grafana; combining
                - code [ref=f28e1930]: "--server-auth-token"
                - text: with
                - code [ref=f28e1931]: GRAFANA_FORWARD_HEADERS=Authorization
                - text: is rejected at startup.
              - paragraph [ref=f28e1932]:
                - strong [ref=f28e1933]: "Debug and Logging:"
              - list [ref=f28e1934]:
                - listitem [ref=f28e1935]:
                  - code [ref=f28e1936]: "--debug"
                  - text: ": Enable debug mode for detailed HTTP request/response logging"
                - listitem [ref=f28e1937]:
                  - code [ref=f28e1938]: "--log-level"
                  - text: ": Log level ("
                  - code [ref=f28e1939]: debug
                  - text: ","
                  - code [ref=f28e1940]: info
                  - text: ","
                  - code [ref=f28e1941]: warn
                  - text: ","
                  - code [ref=f28e1942]: error
                  - text: ") - default:"
                  - code [ref=f28e1943]: info
              - paragraph [ref=f28e1944]:
                - strong [ref=f28e1945]: "Grafana Client Options:"
              - list [ref=f28e1946]:
                - listitem [ref=f28e1947]:
                  - code [ref=f28e1948]: "--grafana-timeout"
                  - text: ": Time limit for requests made by the Grafana client. Accepts Go duration strings (e.g.,"
                  - code [ref=f28e1949]: 10s
                  - text: ","
                  - code [ref=f28e1950]: 500ms
                  - text: ") - default:"
                  - code [ref=f28e1951]: 10s
                - listitem [ref=f28e1952]:
                  - code [ref=f28e1953]: "--include-args-in-spans"
                  - text: ": Include tool call arguments in OpenTelemetry spans. Only enable in non-production environments or when arguments are known not to contain PII - default:"
                  - code [ref=f28e1954]: "false"
              - paragraph [ref=f28e1955]:
                - strong [ref=f28e1956]: "Observability:"
              - list [ref=f28e1957]:
                - listitem [ref=f28e1958]:
                  - code [ref=f28e1959]: "--metrics"
                  - text: ": Enable Prometheus metrics endpoint at"
                  - code [ref=f28e1960]: /metrics
                - listitem [ref=f28e1961]:
                  - code [ref=f28e1962]: "--metrics-address"
                  - text: ": Separate address for metrics server (e.g.,"
                  - code [ref=f28e1963]: :9090
                  - text: ). If empty, metrics are served on the main server
                - listitem [ref=f28e1964]:
                  - code [ref=f28e1965]: "--slow-request-threshold"
                  - text: ": Log an event when any MCP request (tool invocation, list, resource read, etc.) takes longer than this duration. Accepts Go duration strings (e.g.,"
                  - code [ref=f28e1966]: 500ms
                  - text: ","
                  - code [ref=f28e1967]: 5s
                  - text: ). Default
                  - code [ref=f28e1968]: "0"
                  - text: disables slow-request logging. See the
                  - link "Slow-request logging" [ref=f28e1969] [cursor=pointer]:
                    - /url: "#slow-request-logging"
                  - text: section.
                - listitem [ref=f28e1970]:
                  - code [ref=f28e1971]: "--slow-request-log-level"
                  - text: ": Log level for slow-request events ("
                  - code [ref=f28e1972]: info
                  - text: or
                  - code [ref=f28e1973]: warn
                  - text: ") - default:"
                  - code [ref=f28e1974]: warn
                  - text: .
              - paragraph [ref=f28e1975]:
                - strong [ref=f28e1976]: "Session Management:"
              - list [ref=f28e1977]:
                - listitem [ref=f28e1978]:
                  - code [ref=f28e1979]: "--session-idle-timeout-minutes"

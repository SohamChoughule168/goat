              - paragraph [ref=f28e1982]:
                - strong [ref=f28e1983]: "Tool Configuration:"
              - list [ref=f28e1984]:
                - listitem [ref=f28e1985]:
                  - code [ref=f28e1986]: "--enabled-tools"
                  - text: ": Comma-separated list of enabled categories - default: all categories except"
                  - code [ref=f28e1987]: admin
                  - text: ","
                  - code [ref=f28e1988]: agento11y
                  - text: ","
                  - code [ref=f28e1989]: assistant
                  - text: ","
                  - code [ref=f28e1990]: athena
                  - text: ","
                  - code [ref=f28e1991]: clickhouse
                  - text: ","
                  - code [ref=f28e1992]: cloudwatch
                  - text: ","
                  - code [ref=f28e1993]: elasticsearch
                  - text: ","
                  - code [ref=f28e1994]: examples
                  - text: ","
                  - code [ref=f28e1995]: graphite
                  - text: ","
                  - code [ref=f28e1996]: quickwit
                  - text: ","
                  - code [ref=f28e1997]: runpanelquery
                  - text: ", and"
                  - code [ref=f28e1998]: snowflake
                  - text: . To enable disabled categories, add them to the list (e.g.,
                  - code [ref=f28e1999]: "\"search,datasource,...,snowflake\""
                  - text: )
                - listitem [ref=f28e2000]:
                  - code [ref=f28e2001]: "--max-loki-log-limit"
                  - text: ": Maximum number of log lines returned per"
                  - code [ref=f28e2002]: query_loki_logs
                  - text: "call - default:"
                  - code [ref=f28e2003]: "100"
                  - text: ". Note: Set this at least 1 below Loki's server-side"
                  - code [ref=f28e2004]: max_entries_limit_per_query
                  - text: to allow truncation detection (the tool requests
                  - code [ref=f28e2005]: limit+1
                  - text: internally to detect if more data exists).
                - listitem [ref=f28e2006]:
                  - code [ref=f28e2007]: "--loki-guardrail-mode"
                  - text: ": Loki query cost guardrail for"
                  - code [ref=f28e2008]: query_loki_logs
                  - text: "- default:"
                  - code [ref=f28e2009]: "off"
                  - text: . Loki does not enforce
                  - code [ref=f28e2010]: max_query_bytes_read
                  - text: on log queries without a line filter, so a broad selector over a wide range can scan terabytes; the guardrail requires a selective stream selector, caps the effective time range (including range-vector durations like
                  - code [ref=f28e2011]: "[30d]"
                  - text: ), and pre-checks Loki's index/stats byte estimate before running the query.
                  - code [ref=f28e2012]: shadow
                  - text: logs queries that would be blocked but lets them run (it still pays the index/stats round trip);
                  - code [ref=f28e2013]: enforce
                  - text: rejects them with rewrite guidance the LLM can act on. On VictoriaLogs the guardrail applies only to selector-shaped (
                  - code [ref=f28e2014]: "{...}"
                  - text: ") queries — when no selector parses (the normal brace-less LogsQL shape), the query passes through entirely, and the byte-budget check never applies (no cheap index estimate). Env fallback:"
                  - code [ref=f28e2015]: GRAFANA_LOKI_GUARDRAIL_MODE
                  - text: .
                - listitem [ref=f28e2016]:
                  - code [ref=f28e2017]: "--loki-guardrail-max-bytes"
                  - text: ": Maximum bytes a single"
                  - code [ref=f28e2018]: query_loki_logs
                  - text: "call may scan, estimated via Loki's index/stats API - default:"
                  - code [ref=f28e2019]: "107374182400"
                  - text: (100 GiB).
                  - code [ref=f28e2020]: "0"
                  - text: "disables the byte-budget check. Env fallback:"
                  - code [ref=f28e2021]: GRAFANA_LOKI_GUARDRAIL_MAX_BYTES
                  - text: .
                - listitem [ref=f28e2022]:
                  - code [ref=f28e2023]: "--loki-guardrail-max-range"
                  - text: ": Maximum effective time range for a single"
                  - code [ref=f28e2024]: query_loki_logs
                  - text: "call, including range-vector durations - default:"
                  - code [ref=f28e2025]: 24h
                  - text: . Accepts Go duration strings.
                  - code [ref=f28e2026]: "0"
                  - text: "disables the range check. Env fallback:"
                  - code [ref=f28e2027]: GRAFANA_LOKI_GUARDRAIL_MAX_RANGE
                  - text: .
                - listitem [ref=f28e2028]:
                  - code [ref=f28e2029]: "--disable-search"

                  - code [ref=f28e2076]: "--disable-cloudwatch"
                  - text: ": Disable CloudWatch tools"
                - listitem [ref=f28e2077]:
                  - code [ref=f28e2078]: "--disable-examples"
                  - text: ": Disable query examples tools"
                - listitem [ref=f28e2079]:
                  - code [ref=f28e2080]: "--disable-clickhouse"
                  - text: ": Disable ClickHouse tools"
                - listitem [ref=f28e2081]:
                  - code [ref=f28e2082]: "--disable-snowflake"
                  - text: ": Disable Snowflake tools"
                - listitem [ref=f28e2083]:
                  - code [ref=f28e2084]: "--disable-runpanelquery"
                  - text: ": Disable run panel query tools"
                - listitem [ref=f28e2085]:
                  - code [ref=f28e2086]: "--disable-graphite"

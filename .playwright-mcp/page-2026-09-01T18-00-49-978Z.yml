                - paragraph [ref=f20e470]:
                  - text: When
                  - code [ref=f20e471]: platform
                  - text: carries a per-request credential, create the handler per request and close it when the response finishes. The handler closes over the
                  - code [ref=f20e472]: platform
                  - text: you supply, so a shared one serves every request with that platform.
                - paragraph [ref=f20e473]:
                  - text: A long-lived handler is fine when the
                  - code [ref=f20e474]: platform
                  - text: is meant to be shared, a service-account token for example. Create it once and
                  - code [ref=f20e475]: close()
                  - text: it at shutdown rather than per response, since
                  - code [ref=f20e476]: close()
                  - text: tears down the subscription router and refuses later requests.

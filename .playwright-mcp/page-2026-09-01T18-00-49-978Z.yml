                - paragraph [ref=f20e358]:
                  - text: Before setting up the MCP server, we recommend you read our
                  - link "security best practices" [ref=f20e359] [cursor=pointer]:
                    - /url: https://supabase.com/docs/guides/ai-tools/mcp#security-risks
                  - text: to understand the risks of connecting an LLM to your Supabase projects and how to mitigate them.
                - generic [ref=f20e360]:
                  - heading "2. Configure your MCP client" [level=3] [ref=f20e361]
                  - 'link "Permalink: 2. Configure your MCP client" [ref=f20e362] [cursor=pointer]':
                    - /url: "#2-configure-your-mcp-client"
                - paragraph [ref=f20e365]:
                  - text: To configure the Supabase MCP server on your client, visit our
                  - link "setup documentation" [ref=f20e366] [cursor=pointer]:
                    - /url: https://supabase.com/docs/guides/getting-started/mcp#step-2-configure-your-ai-tool
                  - text: . You can also generate a custom MCP URL for your project by visiting the
                  - link "MCP connection tab" [ref=f20e367] [cursor=pointer]:
                    - /url: https://supabase.com/dashboard/project/_?showConnect=true&connectTab=mcp
                  - text: in the Supabase dashboard.
                - paragraph [ref=f20e368]: Your MCP client will automatically prompt you to log in to Supabase during setup. Be sure to choose the organization that contains the project you wish to work with.
                - paragraph [ref=f20e369]: "Most MCP clients require the following information:"
                - generic [ref=f20e370]:

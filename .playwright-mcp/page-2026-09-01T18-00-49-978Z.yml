                - blockquote [ref=f20e339]:
                  - paragraph [ref=f20e340]: Connect your Supabase projects to Cursor, Claude, Windsurf, and other AI assistants.
                - paragraph [ref=f20e341]:
                  - link [ref=f20e343] [cursor=pointer]:
                    - /url: https://private-user-images.githubusercontent.com/4133076/428151199-3fce101a-b7d4-482f-9182-0be70ed1ad56.gif?jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..jpIFSq5FmPRodD3uaT1GH86j9rQfbakmzq_qwW4-l5Y
                    - img "supabase-mcp-demo" [ref=f20e344]
                - paragraph [ref=f20e345]:
                  - text: The
                  - link "Model Context Protocol" [ref=f20e346] [cursor=pointer]:
                    - /url: https://modelcontextprotocol.io/introduction
                  - text: (MCP) standardizes how Large Language Models (LLMs) talk to external services like Supabase. It connects AI assistants directly with your Supabase project and allows them to perform tasks like managing tables, fetching config, and querying data. See the
                  - link "full list of tools" [ref=f20e347] [cursor=pointer]:
                    - /url: https://supabase.com/mcp#available-tools
                  - text: .
                - generic [ref=f20e348]:
                  - heading "Setup" [level=2] [ref=f20e349]

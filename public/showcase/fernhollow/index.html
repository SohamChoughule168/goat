<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fernhollow</title>
<meta name="description" content="A regenerative design studio. Wander through a night valley of flowers that grows as you move.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--u:min(calc(100vw/1600),calc(100vh/900));--cream:#f5efe2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{color:var(--cream);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#valley{position:fixed;inset:0}
.js-canvas-container{position:absolute;inset:0}
.js-canvas-container canvas{display:block;width:100%!important;height:100%!important}
.lil-gui{display:none!important}
.ui{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1.6s ease}
.ui.on{opacity:1}
.ui a,.ui button{pointer-events:auto}
header{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(24*var(--u)) calc(44*var(--u)) 0}
.logo{font-size:calc(26*var(--u));font-weight:500;letter-spacing:-.02em}
nav{display:flex;align-items:center;gap:calc(44*var(--u));font-size:calc(14.5*var(--u));font-weight:500;letter-spacing:.16em;text-transform:uppercase}
nav a:not(.pill){transition:opacity .2s}nav a:not(.pill):hover{opacity:.6}
.pill{display:inline-flex;align-items:center;height:calc(46*var(--u));padding:0 calc(26*var(--u));border-radius:99px;background:var(--cream);color:#151510;transition:transform .25s}
.pill:hover{transform:translateY(-1px)}
.hero{position:absolute;left:0;right:0;top:50%;transform:translateY(-46%);display:flex;flex-direction:column;align-items:center;text-align:center}
h1{font:400 calc(158*var(--u))/.92 Antonio,"Arial Narrow",sans-serif;letter-spacing:-.012em;white-space:nowrap}
.cap{margin-top:calc(48*var(--u));font-size:calc(20*var(--u));line-height:1.3}
.go{display:grid;place-items:center;margin-top:calc(34*var(--u));width:calc(58*var(--u));height:calc(58*var(--u));border:1.5px solid var(--cream);border-radius:50%;transition:background .3s,color .3s}
.go:hover{background:var(--cream);color:#151510}
.go svg{width:calc(22*var(--u));height:calc(22*var(--u));fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.corner{position:absolute;right:calc(44*var(--u));bottom:calc(44*var(--u));display:flex;align-items:center;gap:calc(18*var(--u));font-size:calc(12.5*var(--u));font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.corner i{width:1px;height:calc(26*var(--u));background:rgba(245,239,226,.45)}
.sound{display:grid;place-items:center;width:calc(28*var(--u));height:calc(28*var(--u))}
.sound svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sound .w{transition:opacity .3s}.sound[aria-pressed=false] .w{opacity:0}
.sound[aria-pressed=true] .x{opacity:0}
.loader{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:#000;transition:opacity 1s ease;pointer-events:none}
.loader.gone{opacity:0}
.loader span{width:calc(9*var(--u));height:calc(9*var(--u));min-width:6px;min-height:6px;border-radius:50%;background:var(--cream);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.4);opacity:.4}}
a:focus-visible,button:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
@media (max-width:820px){
  :root{--u:1px}
  header{padding:18px 18px 0}
  nav a:not(.pill){display:none}
  .pill{height:40px;padding:0 18px;font-size:12px}
  .hero{left:20px;right:20px}
  .corner{left:20px;justify-content:center}
  h1{font-size:clamp(64px,19vw,96px);white-space:normal}
  .cap{font-size:17px}
  .corner{right:20px;bottom:30px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){.loader span{animation:none}}
</style>
</head>
<body>
<div id="valley" aria-hidden="true"><div class="js-canvas-container"></div></div>
<div class="ui" id="ui">
  <header>
    <a class="logo" href="#" aria-label="Fernhollow">Fernhollow</a>
    <nav aria-label="Main"><a href="#">Work</a><a href="#">About</a><a href="#">Journal</a><a class="pill" href="#">Let’s talk</a></nav>
  </header>
  <section class="hero">
    <h1>Grown, not built.</h1>
    <p class="cap">Rooted in nature.<br>Built for what’s next.</p>
    <a class="go" href="#" id="go" aria-label="See our work"><svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a>
  </section>
  <div class="corner"><span>Scroll to wander</span><i></i>
    <button class="sound" id="sound" aria-pressed="false" aria-label="Ambient sound"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5Z"/><path class="w" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="m16 10 4 4m0-4-4 4"/></svg></button>
  </div>
</div>
<div class="loader" id="loader"><span></span></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// Procedural texture generators for glowing flowers & leaves
function createFlowerTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 128;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');
  
  const cx = 64, cy = 64;
  const grad = ctx.createRadialGradient(cx, cy, 2, cx, cy, 60);
  grad.addColorStop(0, 'rgba(255, 255, 245, 1)');
  grad.addColorStop(0.2, 'rgba(245, 239, 226, 0.95)');
  grad.addColorStop(0.45, 'rgba(165, 235, 195, 0.7)');
  grad.addColorStop(0.7, 'rgba(75, 175, 140, 0.25)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(cx, cy, 62, 0, Math.PI * 2);
  ctx.fill();

  // 5 delicate flower petals
  ctx.fillStyle = 'rgba(255, 255, 250, 0.85)';
  for (let i = 0; i < 5; i++) {
    const angle = (i * Math.PI * 2) / 5;
    const px = cx + Math.cos(angle) * 18;
    const py = cy + Math.sin(angle) * 18;
    ctx.beginPath();
    ctx.arc(px, py, 13, 0, Math.PI * 2);
    ctx.fill();
  }
  
  // Center pistil
  ctx.fillStyle = 'rgba(255, 240, 160, 1)';
  ctx.beginPath();
  ctx.arc(cx, cy, 6, 0, Math.PI * 2);
  ctx.fill();

  return new THREE.CanvasTexture(canvas);
}

function createLeafTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 64;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');
  const grad = ctx.createRadialGradient(32, 32, 2, 32, 32, 30);
  grad.addColorStop(0, 'rgba(160, 225, 175, 0.9)');
  grad.addColorStop(0.4, 'rgba(60, 150, 110, 0.5)');
  grad.addColorStop(0.8, 'rgba(20, 80, 50, 0.15)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(32, 32, 30, 0, Math.PI * 2);
  ctx.fill();
  return new THREE.CanvasTexture(canvas);
}

// Procedural audio synthesizer for the ambient night-valley track
class AmbientSoundStore {
  constructor() {
    this.isInitialized = false;
    this.muted = true;
    this.ctx = null;
    this.masterGain = null;
    this.filter = null;
    this.oscillators = [];
  }

  initAudio() {
    if (this.isInitialized) return;
    try {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
      
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.setValueAtTime(0, this.ctx.currentTime);

      this.filter = this.ctx.createBiquadFilter();
      this.filter.type = 'lowpass';
      this.filter.frequency.setValueAtTime(1400, this.ctx.currentTime);
      this.filter.Q.setValueAtTime(3.5, this.ctx.currentTime);

      this.masterGain.connect(this.filter);
      this.filter.connect(this.ctx.destination);

      // 4 harmonic ethereal pads (D minor 9 chord: D, F, A, C, E)
      const freqs = [146.83, 220.00, 261.63, 329.63, 440.00, 523.25];
      freqs.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const oscGain = this.ctx.createGain();
        osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

        // LFO for subtle frequency detune drift
        const lfo = this.ctx.createOscillator();
        const lfoGain = this.ctx.createGain();
        lfo.frequency.setValueAtTime(0.08 + idx * 0.03, this.ctx.currentTime);
        lfoGain.gain.setValueAtTime(1.5 + idx * 0.8, this.ctx.currentTime);
        lfo.connect(osc.frequency);
        lfo.start();

        oscGain.gain.setValueAtTime(0.04 / (idx + 1), this.ctx.currentTime);
        osc.connect(oscGain);
        oscGain.connect(this.masterGain);
        osc.start();
        this.oscillators.push(osc);
      });

      this.isInitialized = true;
    } catch(e) {
      console.warn("Audio Context error:", e);
    }
  }

  toggleMute() {
    if (!this.isInitialized) this.initAudio();
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume();
    }
    this.muted = !this.muted;
    const targetGain = this.muted ? 0.0001 : 0.35;
    if (this.masterGain && this.ctx) {
      this.masterGain.gain.linearRampToValueAtTime(targetGain, this.ctx.currentTime + 1.2);
    }
    return this.muted;
  }

  setMuffle(muffled) {
    if (!this.filter || !this.ctx) return;
    const targetFreq = muffled ? 340 : 1400;
    this.filter.frequency.exponentialRampToValueAtTime(targetFreq, this.ctx.currentTime + 0.8);
  }
}

// 3D Valley Engine
class ValleyScene {
  constructor(container, onLoaded, onIntroDone) {
    this.container = container;
    this.onLoaded = onLoaded;
    this.onIntroDone = onIntroDone;
    this.isHovered = false;
    this.hoverProgress = 0;
    this.scrollProgress = 0;
    this.scrollVelocity = 0;
    this.mouse = new THREE.Vector2(0, 0);
    this.targetMouse = new THREE.Vector2(0, 0);

    this.initThree();
    this.createTerrain();
    this.createFlora();
    this.createDustParticles();
    this.setupCurvePath();
    this.bindEvents();

    // Signal loaded
    setTimeout(() => {
      if (this.onLoaded) this.onLoaded();
      setTimeout(() => {
        if (this.onIntroDone) this.onIntroDone();
      }, 350);
    }, 400);

    this.animate = this.animate.bind(this);
    requestAnimationFrame(this.animate);
  }

  initThree() {
    this.scene = new THREE.Scene();
    this.scene.fog = new THREE.FogExp2(0x020704, 0.014);

    this.camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.1, 1200);
    
    this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    this.renderer.setSize(window.innerWidth, window.innerHeight);
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.setClearColor(0x000201, 1);

    const canvasContainer = this.container.querySelector('.js-canvas-container') || this.container;
    canvasContainer.appendChild(this.renderer.domElement);

    // Moonlight & Ambient
    const ambientLight = new THREE.AmbientLight(0x0b1e16, 1.2);
    this.scene.add(ambientLight);

    const moonLight = new THREE.DirectionalLight(0xa5d8c8, 1.8);
    moonLight.position.set(40, 100, -80);
    this.scene.add(moonLight);
  }

  setupCurvePath() {
    // 3D Path winding through the night flower valley
    const points = [
      new THREE.Vector3(0, 14, 0),
      new THREE.Vector3(12, 10, -50),
      new THREE.Vector3(-18, 8, -110),
      new THREE.Vector3(15, 6, -180),
      new THREE.Vector3(-10, 9, -260),
      new THREE.Vector3(18, 5, -340),
      new THREE.Vector3(-14, 8, -420),
      new THREE.Vector3(8, 11, -500),
      new THREE.Vector3(0, 14, -580)
    ];
    this.curve = new THREE.CatmullRomCurve3(points, true);
    this.pathLength = 580;
  }

  createTerrain() {
    const geo = new THREE.PlaneGeometry(360, 720, 90, 180);
    geo.rotateX(-Math.PI / 2);

    const pos = geo.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const z = pos.getZ(i);
      // Gentle rolling hills with valley in the center (x ~ 0)
      const valleyTrough = Math.pow(Math.abs(x) / 38, 1.8) * 4.5;
      const hills = Math.sin(x * 0.04) * Math.cos(z * 0.03) * 6 + Math.sin(z * 0.02) * 4;
      pos.setY(i, valleyTrough + hills - 6);
    }
    geo.computeVertexNormals();

    const mat = new THREE.MeshStandardMaterial({
      color: 0x05130b,
      roughness: 0.85,
      metalness: 0.15,
      flatShading: false
    });

    this.terrain = new THREE.Mesh(geo, mat);
    this.terrain.position.set(0, 0, -290);
    this.scene.add(this.terrain);
  }

  createFlora() {
    const count = 3800;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);
    const originalPositions = new Float32Array(count * 3);
    const colors = new Float32Array(count * 3);
    const scales = new Float32Array(count);
    const randomVels = new Float32Array(count * 3);

    const palette = [
      new THREE.Color(0xf5efe2), // Cream
      new THREE.Color(0xc6f3be), // Soft sage
      new THREE.Color(0xa2ecd8), // Bioluminescent cyan
      new THREE.Color(0xe8d5f5), // Night lavender
      new THREE.Color(0xfff8d6)  // Pale gold
    ];

    for (let i = 0; i < count; i++) {
      const x = (Math.random() - 0.5) * 220;
      const z = -Math.random() * 640;
      // Terrain height approximation
      const valleyTrough = Math.pow(Math.abs(x) / 38, 1.8) * 4.5;
      const hills = Math.sin(x * 0.04) * Math.cos(z * 0.03) * 6 + Math.sin(z * 0.02) * 4;
      const y = valleyTrough + hills - 4.5 + Math.random() * 2.2;

      positions[i * 3] = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = z;

      originalPositions[i * 3] = x;
      originalPositions[i * 3 + 1] = y;
      originalPositions[i * 3 + 2] = z;

      const col = palette[Math.floor(Math.random() * palette.length)];
      colors[i * 3] = col.r;
      colors[i * 3 + 1] = col.g;
      colors[i * 3 + 2] = col.b;

      scales[i] = 1.4 + Math.random() * 2.8;

      randomVels[i * 3] = (Math.random() - 0.5) * 40;
      randomVels[i * 3 + 1] = (Math.random() + 0.3) * 35;
      randomVels[i * 3 + 2] = (Math.random() - 0.5) * 40;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    geometry.setAttribute('scale', new THREE.BufferAttribute(scales, 1));

    this.flowerTexture = createFlowerTexture();

    const material = new THREE.PointsMaterial({
      size: 7.5,
      map: this.flowerTexture,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      vertexColors: true
    });

    this.flowerPoints = new THREE.Points(geometry, material);
    this.originalPositions = originalPositions;
    this.randomVels = randomVels;
    this.scene.add(this.flowerPoints);
  }

  createDustParticles() {
    const count = 450;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(count * 3);

    for (let i = 0; i < count; i++) {
      positions[i * 3] = (Math.random() - 0.5) * 160;
      positions[i * 3 + 1] = Math.random() * 30;
      positions[i * 3 + 2] = -Math.random() * 600;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const mat = new THREE.PointsMaterial({
      size: 2.8,
      map: createLeafTexture(),
      transparent: true,
      opacity: 0.65,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      color: 0x98f5d0
    });

    this.dustPoints = new THREE.Points(geometry, mat);
    this.scene.add(this.dustPoints);
  }

  startHoverTransition() {
    this.isHovered = true;
  }

  stopHoverTransition() {
    this.isHovered = false;
  }

  bindEvents() {
    window.addEventListener('resize', () => {
      this.camera.aspect = window.innerWidth / window.innerHeight;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Virtual scroller with wheel
    window.addEventListener('wheel', (e) => {
      this.scrollVelocity += e.deltaY * 0.00035;
    }, { passive: true });

    // Touch support (20x multiplier)
    let touchY = 0;
    window.addEventListener('touchstart', (e) => {
      touchY = e.touches[0].clientY;
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
      const dy = touchY - e.touches[0].clientY;
      touchY = e.touches[0].clientY;
      this.scrollVelocity += dy * 0.007;
    }, { passive: true });

    // Mouse pointer
    window.addEventListener('pointermove', (e) => {
      this.targetMouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      this.targetMouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });
  }

  animate(time) {
    requestAnimationFrame(this.animate);

    const t = time * 0.001;

    // Hover transition progress
    const targetHover = this.isHovered ? 1 : 0;
    this.hoverProgress += (targetHover - this.hoverProgress) * 0.06;

    // Flight speed: drifts slowly forward when idle, slows to a stop on hover
    const idleSpeed = 0.00028 * (1 - this.hoverProgress * 0.95);
    this.scrollVelocity *= 0.92;
    this.scrollProgress = (this.scrollProgress + idleSpeed + this.scrollVelocity * (1 - this.hoverProgress)) % 1;
    if (this.scrollProgress < 0) this.scrollProgress += 1;

    // Camera along curve
    const camPos = this.curve.getPointAt(this.scrollProgress);
    const lookTarget = this.curve.getPointAt((this.scrollProgress + 0.035) % 1);

    this.mouse.x += (this.targetMouse.x - this.mouse.x) * 0.05;
    this.mouse.y += (this.targetMouse.y - this.mouse.y) * 0.05;

    this.camera.position.copy(camPos);
    this.camera.position.x += this.mouse.x * 2.5;
    this.camera.position.y += this.mouse.y * 1.8;

    this.camera.lookAt(lookTarget.x + this.mouse.x * 3.5, lookTarget.y + this.mouse.y * 2.5, lookTarget.z);

    // Animate flower dispersion on hover
    if (this.flowerPoints) {
      const posAttr = this.flowerPoints.geometry.attributes.position;
      const count = posAttr.count;
      for (let i = 0; i < count; i++) {
        const ox = this.originalPositions[i * 3];
        const oy = this.originalPositions[i * 3 + 1];
        const oz = this.originalPositions[i * 3 + 2];

        const vx = this.randomVels[i * 3];
        const vy = this.randomVels[i * 3 + 1];
        const vz = this.randomVels[i * 3 + 2];

        // Float up and disperse outward
        const curX = ox + vx * this.hoverProgress;
        const curY = oy + vy * this.hoverProgress + Math.sin(t * 1.5 + i) * 0.4;
        const curZ = oz + vz * this.hoverProgress;

        posAttr.setXYZ(i, curX, curY, curZ);
      }
      posAttr.needsUpdate = true;
    }

    // Gentle dust rise
    if (this.dustPoints) {
      const pos = this.dustPoints.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        let y = pos.getY(i) + 0.04;
        if (y > 32) y = 0;
        pos.setY(i, y);
      }
      pos.needsUpdate = true;
    }

    this.renderer.render(this.scene, this.camera);
  }
}

// Attach engine & wire interface events
window.__GE = {
  et: () => ValleyScene,
  Y: () => {
    if (!window.__soundStore) window.__soundStore = new AmbientSoundStore();
    return () => window.__soundStore;
  }
};

const Valley = window.__GE.et(), audioStore = window.__GE.Y();
let introShown = false;
const valley = new Valley(
  document.getElementById('valley'),
  () => document.getElementById('loader').classList.add('gone'),
  () => { if (!introShown) { introShown = true; document.getElementById('ui').classList.add('on'); } }
);

audioStore().initAudio();
const sound = document.getElementById('sound');
sound.onclick = () => {
  const s = audioStore();
  const muted = s.toggleMute();
  sound.setAttribute('aria-pressed', String(!muted));
};

const go = document.getElementById('go');
go.addEventListener('pointerenter', () => {
  valley.startHoverTransition();
  const s = audioStore();
  if (s.isInitialized) s.setMuffle(true);
});
go.addEventListener('pointerleave', () => {
  valley.stopHoverTransition();
  const s = audioStore();
  if (s.isInitialized) s.setMuffle(false);
});
</script>
</body>
</html>
